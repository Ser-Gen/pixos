<body>
<script src="browserfs.js"></script>
<script src="js/mount-manager.js"></script>

<script src="js/goldenlayout/goldenlayout.min.js"></script>
<link rel="stylesheet" href="js/goldenlayout/goldenlayout-base.css">
<link rel="stylesheet" href="js/goldenlayout/goldenlayout-dark-theme.css">
<style>
	html,
	body {
		margin: 0;
		height: 100%;
		overflow: hidden;
	}
	body {
		background-color: #12141a;
		color: #fff;
	}

	/* The shell is four stacked layers and z-index is the entire contract between them.
	   #windows is fixed at the viewport origin on purpose: the containers inside it are
	   positioned from getBoundingClientRect(), i.e. in viewport coordinates, so giving
	   this element a transform or an offset parent silently misplaces every window. */
	#shell {
		position: fixed;
		inset: 0;
	}
	#desktop {
		position: absolute;
		inset: 0;
		z-index: 0;
		overflow: hidden;
	}
	/* The bottom inset is the taskbar's height, published by taskbar.js so the number
	   lives in one place. GoldenLayout lays windows out inside this box and the iframe
	   rects follow from it, so nothing ends up underneath the bar. */
	#root {
		position: absolute;
		inset: 0 0 var(--pixos-taskbar-height, 38px) 0;
		z-index: 10;
	}
	#windows {
		position: fixed;
		inset: 0;
		z-index: 100;
		pointer-events: none;
	}
	#taskbar {
		position: fixed;
		inset: auto 0 0 0;
		z-index: 200;
	}
	#overlays {
		position: fixed;
		inset: 0;
		z-index: 300;
		pointer-events: none;
	}
	#windows > *,
	#overlays > * {
		pointer-events: auto;
	}

	/* One layout per desktop, stacked in the same box; only the active one is shown.
	   Hiding rather than detaching is what keeps every iframe alive across a switch. */
	#root > .PixWorkspace {
		position: absolute;
		inset: 0;
	}

	[data-goldenlayout-contid] {
		position: absolute;
	}
	[data-goldenlayout-winid] {
		width: 100%;
		height: 100%;
	}

	/* Let the wallpaper through: the dark theme paints both of these opaque. */
	.lm_goldenlayout,
	.lm_content {
		background: transparent;
	}

	/* With no windows open the layout is still a full-screen transparent sheet. Without
	   this the desktop underneath would never receive a right-click. */
	.PixShell--empty #root {
		pointer-events: none;
	}

	/* Peek hides the windows without touching them. Anything that moved an iframe in the
	   DOM here would reload it and throw away the app's state. */
	#root,
	#windows {
		transition: opacity 180ms ease;
	}
	.PixShell--peek #root,
	.PixShell--peek #windows {
		opacity: 0;
		pointer-events: none;
	}
	/* The rule above puts pointer-events back on every window; without this an invisible
	   iframe still swallows the clicks and right-clicks meant for the desktop. */
	.PixShell--peek #windows > * {
		pointer-events: none;
	}

	iframe {
		border: 1px solid #000;
		background-color: #1b1e23;
		box-sizing: border-box;
	}

	/* A window showing an external site. Most sites refuse to be framed and there is no
	   way to detect that from here -- a blocked frame still fires load -- so the bar is
	   always there rather than appearing after a guess about what went wrong. */
	.PixWebView {
		display: flex;
		flex-direction: column;
		border: 1px solid #000;
		background: #1b1e23;
		box-sizing: border-box;
	}

	.PixWebView iframe {
		flex: 1 1 auto;
		width: 100%;
		border: 0;
	}

	.PixWebView__bar {
		flex: 0 0 auto;
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 5px 8px;
		font: 11px/1.4 Arial, Helvetica, sans-serif;
		color: #98a0ac;
		background: #171a20;
		border-bottom: 1px solid rgba(255, 255, 255, .08);
	}

	.PixWebView__url {
		flex: 1 1 auto;
		min-width: 0;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.PixWebView__bar button {
		flex: none;
		font: inherit;
		padding: 3px 8px;
		color: #dfe3ea;
		background: rgba(255, 255, 255, .07);
		border: 1px solid rgba(255, 255, 255, .12);
		border-radius: 3px;
		cursor: pointer;
	}

	.PixWebView__bar button:hover { background: rgba(255, 255, 255, .14); }
	#omg {
		position: fixed;
		top: 0;
		left: 50%;
		z-index: 100;
	}
</style>

<div id="shell">
	<div id="desktop"></div>
	<div id="root"></div>
	<div id="windows"></div>
	<div id="taskbar"></div>
	<div id="overlays"></div>
</div>

<script type="module">
import WM from "./js/shell/wm.js";
import * as desktop from "./js/shell/desktop.js";
import * as taskbar from "./js/shell/taskbar.js";
import * as appsModel from "./js/shell/apps-model.js";
import * as contextMenu from "./js/shell/context-menu.js";
import * as session from "./js/shell/session.js";
import * as startMenu from "./js/shell/start-menu.js";
import * as palette from "./js/shell/command-palette.js";

var winManager = new WM({
	root: '#root',
	windowsRoot: '#windows'
});

window.wm = winManager;
window.desktop = desktop;

var scope = location.pathname.replace(/\/[^\/]+$/, '/');

if ('serviceWorker' in navigator) {
	// loading this repo from browerFS will not work because serviceWorker can't be loaded from
	// service worker.
	if (!scope.match(/__browserfs__/)) {
		navigator.serviceWorker.register('sw.js', {scope})
			.then(function(reg) {
				reg.addEventListener('updatefound', function() {
					var installingWorker = reg.installing;
					console.log('A new service worker is being installed:',
								installingWorker);
				});
				// registration worked
				console.log('Registration succeeded. Scope is ' + reg.scope);

				function ensureCrossOriginIsolated() {
					if (window.crossOriginIsolated) {
						sessionStorage.removeItem('pixos-coi-reload');
						return;
					}
					if (sessionStorage.getItem('pixos-coi-reload')) {
						return;
					}
					if (!navigator.serviceWorker.controller) {
						return;
					}
					sessionStorage.setItem('pixos-coi-reload', '1');
					location.reload();
				}
				ensureCrossOriginIsolated();
				navigator.serviceWorker.addEventListener('controllerchange', ensureCrossOriginIsolated);

				BrowserFS.configure({
					fs: "MountableFileSystem",
					options: {
						"/": {
							fs: "IndexedDB",
							options: {
								storeName: 'lol'
							}
						}
					}
				}, fsOnInit);
			}).catch(function(error) {
				// registration failed
					console.log('Registration failed with ' + error);
			});
	}
}

// СДЕЛАТЬ: возможно, нужно показывать прогресбар
function fsOnInit () {
	window.fs = BrowserFS.BFSRequire('fs');
	window.path = BrowserFS.BFSRequire('path');
	var {Buffer} = BrowserFS.BFSRequire('buffer');
	window.Buffer = Buffer;
	window.mountManager = new MountManager(BrowserFS, window.fs);

	// File System Access API must run in the same window as window.fs / MountManager.
	window.pickNativeDirectory = async function () {
		if (typeof showDirectoryPicker !== 'function') {
			throw new Error('File System Access API is not supported in this browser');
		}
		var handle = await showDirectoryPicker();
		if (handle.requestPermission) {
			var perm = await handle.queryPermission({ mode: 'readwrite' });
			if (perm !== 'granted') {
				perm = await handle.requestPermission({ mode: 'readwrite' });
			}
			if (perm !== 'granted') {
				throw new Error('Permission denied for local folder');
			}
		}
		return handle;
	};

	// Listen for file read requests from the Service Worker.
	// When SW can't find a file in IndexedDB (e.g. it's on a mounted FS),
	// it asks the main thread to read it via MessageChannel.
	if (navigator.serviceWorker) {
		navigator.serviceWorker.addEventListener('message', function (event) {
			if (!event.data || !event.ports || !event.ports.length) return;
			var port = event.ports[0];

			if (event.data.type === 'readFile') {
				window.fs.readFile(event.data.path, function (err, buf) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({buffer: buf.buffer || buf});
					}
				});
			} else if (event.data.type === 'stat') {
				window.fs.stat(event.data.path, function (err, stat) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({
							isFile: stat.isFile(),
							isDirectory: stat.isDirectory()
						});
					}
				});
			} else if (event.data.type === 'readdir') {
				window.fs.readdir(event.data.path, function (err, list) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({list: list});
					}
				});
			}
		});
	}

	// The preload list is data, not code: settings/preinstall.json says which files a
	// fresh system needs, which catalog apps to install, which user files to seed and
	// which extensions get a default app. It is fetched over HTTP from the served repo
	// rather than read from BrowserFS, because on a first boot BrowserFS is empty.
	//
	// A boot must survive that file being unreachable, so FALLBACK_PREINSTALL below is
	// the minimum that still produces a usable system: the shell's own two apps and the
	// registry they need.
	var FALLBACK_PREINSTALL = {
		files: [
			{path: '/apps/explorer/index.html', refresh: true},
			{path: '/apps/explorer/favicon.svg', refresh: true},
			{path: '/apps/app-manager/index.html', refresh: true},
			{path: '/apps/app-manager/favicon.svg', refresh: true},
			{path: '/apps/app-catalog.js', refresh: true},
			{path: '/apps/registry.json', refresh: true}
		],
		apps: [],
		seed: [],
		defaultApps: {}
	};

	var preinstall = FALLBACK_PREINSTALL;

	function fetchServed (filePath) {
		return fetch(path.join(scope, filePath) + '?' + Math.random());
	}

	async function loadPreinstallConfig () {
		try {
			var response = await fetchServed('/settings/preinstall.json');
			if (!response.ok) {
				throw new Error(response.status + ' ' + response.statusText);
			}
			var config = await response.json();
			return {
				files: Array.isArray(config.files) ? config.files : [],
				apps: Array.isArray(config.apps) ? config.apps : [],
				seed: Array.isArray(config.seed) ? config.seed : [],
				defaultApps: (config.defaultApps && typeof config.defaultApps === 'object') ? config.defaultApps : {}
			};
		}
		catch (err) {
			console.error('settings/preinstall.json could not be read; '
				+ 'booting with the built-in minimum', err);
			return FALLBACK_PREINSTALL;
		}
	}

	// `refresh` files are re-copied on every boot -- the shell's own apps and the
	// generated registry, which have to track the served copy or an update never
	// arrives. Everything else is copied only when missing, so a local edit survives.
	async function copyPreinstallFiles (entries) {
		await Promise.all(entries.map(async function (entry) {
			var item = typeof entry === 'string' ? {path: entry} : entry;
			if (!item || !item.path) {
				return;
			}
			if (!item.refresh && await stat(item.path)) {
				return;
			}
			try {
				var response = await fetchServed(item.path);
				if (!response.ok) {
					throw new Error(response.status + ' ' + response.statusText);
				}
				await writeFilePromise(item.path, Buffer.from(await response.arrayBuffer()));
			}
			catch (err) {
				// One missing file must not stop the boot: the rest of the system is
				// still worth having, and App Manager can repair an app later.
				console.error('Preloading ' + item.path + ' failed', err);
			}
		}));
	}

	// What preinstall has already done, so it never does it twice. One rule covers both
	// halves: anything the user removes afterwards stays removed. A preinstall list that
	// puts back what you deleted is worse than no preinstall list at all.
	//
	// The file used to be a bare array of app ids; that form is still read.
	async function readPreinstallState () {
		var raw = await readJsonFile('/settings/preinstalled.json', null);
		if (Array.isArray(raw)) {
			return {apps: raw.slice(), seeded: []};
		}
		return {
			apps: Array.isArray(raw && raw.apps) ? raw.apps.slice() : [],
			seeded: Array.isArray(raw && raw.seeded) ? raw.seeded.slice() : []
		};
	}

	function writePreinstallState (state) {
		return writeFilePromise('/settings/preinstalled.json', Buffer.from(JSON.stringify(state, null, 2)));
	}

	// User files, copied from a template exactly once and never refreshed: /home/about.md
	// is yours the moment it exists, and a boot that overwrote it would be a bug you only
	// noticed after losing something. Recorded once written, so deleting the file is a
	// decision the next boot respects rather than undoes.
	async function seedUserFiles (entries, state) {
		var changed = false;

		for (var i = 0; i < entries.length; i++) {
			var entry = entries[i];
			if (!entry || !entry.path || !entry.from) {
				continue;
			}
			if (state.seeded.indexOf(entry.path) !== -1 || await stat(entry.path)) {
				// Already seeded once, or already there. Record the second case too, so a
				// system that predates this bookkeeping does not re-seed after a delete.
				if (state.seeded.indexOf(entry.path) === -1) {
					state.seeded.push(entry.path);
					changed = true;
				}
				continue;
			}
			try {
				var response = await fetchServed(entry.from);
				if (!response.ok) {
					throw new Error(response.status + ' ' + response.statusText);
				}
				await writeFilePromise(entry.path, Buffer.from(await response.arrayBuffer()));
				state.seeded.push(entry.path);
				changed = true;
			}
			catch (err) {
				// Not recorded, so the next boot tries again: a template that failed to
				// download is not the user deciding they do not want the file.
				console.error('Seeding ' + entry.path + ' failed', err);
			}
		}

		return changed;
	}

	// Catalog apps that should be there on a fresh system, installed once and recorded.
	async function installPreinstallApps (ids, state) {
		var changed = false;

		for (var i = 0; i < ids.length; i++) {
			var id = ids[i];
			if (state.apps.indexOf(id) !== -1) {
				continue;
			}
			try {
				await window.installAppById(id);
			}
			catch (err) {
				console.error('Preinstalling ' + id + ' failed', err);
				// Not recorded, so the next boot tries again: a failure here is usually a
				// file that had not been generated yet, not a decision.
				continue;
			}
			state.apps.push(id);
			changed = true;
		}

		return changed;
	}

	// Only extensions with no default yet: this is a suggestion for a fresh system, not
	// a preference the shell gets to reassert over the user's own choice.
	async function seedDefaultApps (map) {
		var extensions = Object.keys(map || {});
		if (!extensions.length) {
			return;
		}
		var associations = window.defaultAppAssociations || {};
		var changed = false;
		extensions.forEach(function (extension) {
			var key = normalizeExtension(extension);
			if (associations[key] || !isInstalledApp(map[extension])) {
				return;
			}
			associations[key] = map[extension];
			changed = true;
		});
		if (changed) {
			window.defaultAppAssociations = associations;
			await persistDefaultAppAssociations();
		}
	}

	var preinstallState = {apps: [], seeded: []};

	loadPreinstallConfig()
		.then(function (config) {
			preinstall = config;
			return copyPreinstallFiles(config.files);
		})
		.then(async function () {
			preinstallState = await readPreinstallState();
			return seedUserFiles(preinstall.seed, preinstallState);
		})
		.then(function () {
			return loadDefaultAppAssociations();
		})
		.then(function () {
			return initDesktop();
		})
		.then(async function () {
			window.apps = [];
			// Awaited, unlike before: restoring a session needs to resolve each window's
			// app to an entry path, and that is only possible once the registry is built.
			try {
				await window.refreshInstalledAppsRegistry();
				scheduleInstalledAppSupportHydration();
			}
			catch (err) {
				console.error('refreshInstalledAppsRegistry failed', err);
			}
			// After the registry, because installing reads it; before the session,
			// because restoring a window has to be able to resolve its app.
			await installPreinstallApps(preinstall.apps, preinstallState);
			// One write for both halves, at the end: a crash mid-boot leaves the state as
			// it was, and the next boot repeats work rather than skipping it.
			await writePreinstallState(preinstallState);
			await seedDefaultApps(preinstall.defaultApps);
			await initSession();
		});

	function writeFile(filePath, contents, cb) {
		fs.stat(path.dirname(filePath), async function (e, stats) {
			if (stats) {
				fs.writeFile(filePath, contents, cb);
			}
			else {
				await checkAndCreateDestinationPath(path.dirname(filePath));
				fs.writeFile(filePath, contents, cb);
			}
		})
	}

	function checkAndCreateDestinationPath (fileDestination) {
		const dirPath = fileDestination.split('/');

		return Promise.all(
			dirPath.map(async (element, index) => {
				var stats = await stat(dirPath.slice(0, index + 1).join('/'));

				if (!stats) {
					return await mkdir(dirPath.slice(0, index + 1).join('/')); 
				}
				else {
					return Promise.resolve(true)
				}
			})
		)
	}

	function stat (path) {
		return new Promise(function (resolve) {
			fs.stat(path, function (e, stats) {
				if (stats) {
					resolve(true);
				}
				else {
					resolve(false);
				}
			})
		})
	}
	function mkdir (path) {
		return new Promise(function (resolve) {
			fs.mkdir(path, function (e) {
				resolve();
			})
		})
	}

	// Returns a Promise resolving to the written path, rejecting with the BrowserFS
	// error. Callers that ignore the result keep the old fire-and-forget behaviour:
	// the internal no-op catch marks a rejection handled, so a failed write logs to
	// the console instead of raising an unhandled rejection.
	window.saveFileLocal = function (path, content) {
		path = path.replace('/__browserfs__', '');
		var saved = new Promise(function (resolve, reject) {
			fs.writeFile(path, content, function (e) {
				if (e) {
					console.error(e);
					reject(e);
					return;
				}
				resolve(path);
			});
		});
		saved.catch(function () {});
		return saved;
	}

	PixosAppRegistry.init({
		fs: fs,
		path: path,
		scope: scope,
		legacyCatalog: window.PIXOS_APP_CATALOG || {},
		readJsonFile: readJsonFile,
		writeFile: function (filePath, contents) {
			return new Promise(function (resolve) {
				writeFile(filePath, contents, function () {
					resolve();
				});
			});
		},
		ensureDir: async function (dirPath) {
			await checkAndCreateDestinationPath(dirPath);
		},
		updateDefaultAppAssociations: updateDefaultAppAssociationId
	});

	window.refreshInstalledAppsRegistry = async function () {
		await PixosAppRegistry.buildAppRegistry();
		window.apps = await PixosAppRegistry.scanInstalledApps();
		notifyAppsRegistryChanged();
		return window.apps;
	};

	window.buildAppRegistry = function () {
		return PixosAppRegistry.buildAppRegistry();
	};

	window.installAppById = async function (appId) {
		var result = await PixosAppRegistry.installAppById(appId);
		await window.refreshInstalledAppsRegistry();
		scheduleInstalledAppSupportHydration([appId]);
		return result;
	};

	window.checkAppUpdate = function (appId) {
		return PixosAppRegistry.checkAppUpdate(appId);
	};

	window.detectLocalModifications = function (appId) {
		return PixosAppRegistry.detectLocalModifications(appId);
	};

	window.updateAppById = async function (appId, options) {
		var result = await PixosAppRegistry.updateAppById(appId, options);
		if (result.updated) {
			await window.refreshInstalledAppsRegistry();
			scheduleInstalledAppSupportHydration([appId]);
		}
		return result;
	};

	window.checkAllAppUpdates = function () {
		return PixosAppRegistry.checkAllAppUpdates();
	};

	window.getManagerApps = function () {
		return PixosAppRegistry.getManagerApps();
	};

	window.validateLocalAppId = function (newId, oldId) {
		return PixosAppRegistry.validateLocalAppId(newId, oldId);
	};

	window.renameLocalApp = async function (oldId, newId) {
		var result = await PixosAppRegistry.renameLocalApp(oldId, newId);
		await window.refreshInstalledAppsRegistry();
		return result;
	};

	window.getInstallableApps = function () {
		return PixosAppRegistry.getInstallableApps();
	};
	window.getCatalogApp = function (id) {
		var app = PixosAppRegistry.getCatalogApp(id);
		if (!app) {
			return null;
		}
		var installedRecord = getInstalledAppRecord(id);
		if (installedRecord) {
			return Object.assign({}, app, {
				supportStatus: installedRecord.supportStatus
			});
		}
		return app;
	};
	window.getInstalledAppRecord = getInstalledAppRecord;
	window.ensureAppSupportedExtensions = ensureAppSupportedExtensions;
	window.ensureInstalledAppsSupportHydrated = ensureInstalledAppsSupportHydrated;
	window.ensureCatalogAppsSupportHydrated = ensureCatalogAppsSupportHydrated;

	window.getFileCompatibilityProfile = getFileCompatibilityProfile;
	window.getExtensionCompatibilityProfile = getExtensionCompatibilityProfile;
	window.getExtensionCandidates = getExtensionCandidates;
	window.normalizeExtensionCandidates = normalizeExtensionCandidates;
	window.isAppCompatibleWithProfile = isAppCompatibleWithProfile;

	window.getDefaultAppForExtension = function (ext) {
		var normalizedExt = normalizeExtension(ext);
		var appId = (window.defaultAppAssociations || {})[normalizedExt];
		if (!appId || !isInstalledApp(appId)) {
			return null;
		}
		return appId;
	};

	window.setDefaultAppForExtension = async function (ext, appId) {
		var normalizedExt = normalizeExtension(ext);
		if (!normalizedExt) {
			throw new Error('Extension is required');
		}
		if (!appId || !isInstalledApp(appId)) {
			throw new Error('Installed app is required');
		}
		window.defaultAppAssociations = window.defaultAppAssociations || {};
		window.defaultAppAssociations[normalizedExt] = appId;
		await persistDefaultAppAssociations();
	};

	window.clearDefaultAppForExtension = async function (ext) {
		var normalizedExt = normalizeExtension(ext);
		if (!normalizedExt) return;
		window.defaultAppAssociations = window.defaultAppAssociations || {};
		delete window.defaultAppAssociations[normalizedExt];
		await persistDefaultAppAssociations();
	};

	window.getAllDefaultAppAssociations = function () {
		var out = {};
		Object.keys(window.defaultAppAssociations || {}).forEach(function (ext) {
			out[ext] = window.defaultAppAssociations[ext];
		});
		return out;
	};

	function getCatalogApps () {
		return PixosAppRegistry.getCatalogApps();
	}

	function getAppRecord (id) {
		var installedRecord = getInstalledAppRecord(id);
		var app = PixosAppRegistry.getApp(id) || PixosAppRegistry.getCatalogApp(id);
		if (!app) {
			return null;
		}
		if (installedRecord) {
			app = Object.assign({}, app, {
				supportStatus: installedRecord.supportStatus
			});
		}
		return app;
	}

	async function loadSupportedExtensionsFromSource (files) {
		var supportedFilePath = (files || []).find(function (item) {
			return /\/pixos_supported$/.test(item);
		});
		if (!supportedFilePath) return [];
		try {
			var raw = await fetch(path.join(scope, supportedFilePath) + '?' + Math.random()).then(function (r) {
				return r.text();
			});
			return raw.trim() ? raw.trim().split(/\n/).map(function (item) {
				return item.trim().replace(/^\./, '').toLowerCase();
			}).filter(Boolean) : [];
		}
		catch (err) {
			console.error(err);
			return [];
		}
	}


	function getInstalledAppRecord (appId) {
		return (window.apps || []).find(function (entry) {
			return entry.id === appId;
		}) || null;
	}

	function ensureAppSupportedExtensions (appId) {
		window.__pixosAppSupportLoads = window.__pixosAppSupportLoads || {};
		var app = getAppRecord(appId);
		if (!app) {
			return Promise.resolve([]);
		}

		var installedRecord = getInstalledAppRecord(appId);
		if (installedRecord && Array.isArray(installedRecord.supportedExtensions)) {
			return Promise.resolve(installedRecord.supportedExtensions.slice());
		}
		if (Array.isArray(app.supportedExtensions) && app.supportedExtensions.length) {
			if (installedRecord) {
				installedRecord.supportedExtensions = app.supportedExtensions.slice();
				installedRecord.supportStatus = 'ready';
				notifyAppsRegistryChanged();
			}
			return Promise.resolve(app.supportedExtensions.slice());
		}
		if (window.__pixosAppSupportLoads[appId]) {
			return window.__pixosAppSupportLoads[appId];
		}

		if (installedRecord) {
			installedRecord.supportStatus = 'loading';
			notifyAppsRegistryChanged();
		}

		var filePaths = (app.files || []).map(function (item) {
			return typeof item === 'string' ? item : item.path;
		});
		var loadPromise = (installedRecord && app.supportedFilePath
			? readSupportedExtensionsFromFs(app.supportedFilePath)
			: loadSupportedExtensionsFromSource(filePaths)
		).then(function (extensions) {
			var normalized = Array.isArray(extensions) ? extensions.slice() : [];
			var raw = window.PIXOS_APP_CATALOG && window.PIXOS_APP_CATALOG[appId];
			if (raw) {
				raw.supportedExtensions = normalized.slice();
			}
			var currentRecord = getInstalledAppRecord(appId);
			if (currentRecord) {
				currentRecord.supportedExtensions = normalized.slice();
				currentRecord.supportStatus = 'ready';
				notifyAppsRegistryChanged();
			}
			return normalized;
		}).catch(function (err) {
			var currentRecord = getInstalledAppRecord(appId);
			if (currentRecord) {
				currentRecord.supportedExtensions = [];
				currentRecord.supportStatus = 'error';
				notifyAppsRegistryChanged();
			}
			console.error(err);
			return [];
		}).finally(function () {
			delete window.__pixosAppSupportLoads[appId];
		});

		window.__pixosAppSupportLoads[appId] = loadPromise;
		return loadPromise;
	}

	function scheduleInstalledAppSupportHydration (appIds) {
		var ids = Array.isArray(appIds) && appIds.length
			? appIds.slice()
			: (window.apps || []).map(function (entry) { return entry.id; });
		setTimeout(function () {
			ids.forEach(function (appId) {
				var record = getInstalledAppRecord(appId);
				if (!record || record.supportStatus === 'ready' || record.supportStatus === 'loading') {
					return;
				}
				ensureAppSupportedExtensions(appId);
			});
		}, 0);
	}

	async function ensureInstalledAppsSupportHydrated () {
		var ids = (window.apps || []).map(function (entry) {
			return entry.id;
		});
		return Promise.all(ids.map(function (appId) {
			return ensureAppSupportedExtensions(appId);
		}));
	}

	async function ensureCatalogAppsSupportHydrated () {
		var ids = getCatalogApps()
			.filter(function (app) {
				return !!app.entryPath;
			})
			.map(function (app) {
				return app.id;
			});
		return Promise.all(ids.map(function (appId) {
			return ensureAppSupportedExtensions(appId);
		}));
	}

	function readSupportedExtensionsFromFs (filePath) {
		return new Promise(function (resolve) {
			fs.readFile(filePath, function (err, file) {
				if (err || !file) {
					resolve([]);
					return;
				}
				resolve(normalizeSupportedExtensions(file.toString()));
			});
		});
	}

	function normalizeSupportedExtensions (raw) {
		return String(raw || '').trim()
			? String(raw).trim().split(/\n/).map(function (item) {
				return item.trim().replace(/^\./, '').toLowerCase();
			}).filter(Boolean)
			: [];
	}

	async function loadDefaultAppAssociations () {
		window.defaultAppAssociations = await readJsonFile('/settings/default-apps.json', {});
		return window.defaultAppAssociations;
	}

	async function updateDefaultAppAssociationId (oldId, newId) {
		var changed = false;
		Object.keys(window.defaultAppAssociations || {}).forEach(function (ext) {
			if (window.defaultAppAssociations[ext] === oldId) {
				window.defaultAppAssociations[ext] = newId;
				changed = true;
			}
		});
		if (changed) {
			await persistDefaultAppAssociations();
		}
	}

	async function persistDefaultAppAssociations () {
		var cleaned = {};
		Object.keys(window.defaultAppAssociations || {}).forEach(function (ext) {
			var appId = window.defaultAppAssociations[ext];
			if (appId && isInstalledApp(appId)) {
				cleaned[normalizeExtension(ext)] = appId;
			}
		});
		window.defaultAppAssociations = cleaned;
		await writeFile('/settings/default-apps.json', Buffer.from(JSON.stringify(cleaned, null, 2)));
	}

	// still leaves a surface with a working right-click menu.

	async function initSession () {
		session.init({
			wm: winManager,
			clean: new URLSearchParams(location.search).get('clean') === '1',
			read: function () {
				return readJsonFile('/settings/session.json', null);
			},
			write: function (data) {
				return writeFilePromise('/settings/session.json', Buffer.from(JSON.stringify(data, null, 2)));
			},
			writeAside: function (data) {
				return writeFilePromise('/settings/session-failed.json', Buffer.from(JSON.stringify(data, null, 2)));
			},
			launch: launch
		});

		// A session file that cannot be restored at all must not wedge the boot: log it,
		// start empty, and carry on to opening Explorer below.
		var result = {restored: 0, reason: null};
		try {
			result = await session.restore();
		}
		catch (err) {
			console.error('Restoring the session failed', err);
			result = {restored: 0, reason: 'the saved session could not be read'};
		}
		// Otherwise every later reload of this tab would keep starting clean, because the
		// flag is in the URL rather than in anything the user meant to make permanent.
		if (location.search.indexOf('clean=1') > -1 && window.history && history.replaceState) {
			history.replaceState(null, '', location.pathname);
		}
		if (result.reason) {
			console.log('PixOS session: starting clean (' + result.reason + ')');
		}
		// A restore that brought nothing back still needs somewhere to start.
		if (!result.restored) {
			openApp('explorer').catch(function (err) {
				console.error('Failed to open Explorer', err);
			});
		}
		// Only now: autosaving any earlier would write the empty mid-restore state over
		// the session being restored.
		session.start();
	}

	window.startCleanSession = async function () {
		await session.clear();
		location.href = location.pathname + '?clean=1';
	};

	function writeFilePromise (filePath, contents) {
		return new Promise(function (resolve) {
			writeFile(filePath, contents, function () {
				resolve();
			});
		});
	}

	// Typing in the palette walks one directory at a time, and usually the same one for
	// several keystrokes in a row, so the last listing is worth keeping -- but only
	// briefly, or a file created while the palette is open would never show up.
	var LISTING_TTL = 5000;
	var lastListing = {path: null, entries: null, at: 0};

	function listDirectoryEntries (dirPath) {
		if (lastListing.path === dirPath && Date.now() - lastListing.at < LISTING_TTL) {
			return Promise.resolve(lastListing.entries);
		}
		return new Promise(function (resolve) {
			fs.readdir(dirPath, function (err, names) {
				if (err || !names) {
					resolve([]);
					return;
				}
				Promise.all(names.slice(0, 500).map(function (name) {
					return new Promise(function (done) {
						fs.stat(path.join(dirPath, name), function (statErr, stats) {
							done({name: name, isDirectory: !!(stats && stats.isDirectory())});
						});
					});
				})).then(function (entries) {
					lastListing = {path: dirPath, entries: entries, at: Date.now()};
					resolve(entries);
				});
			});
		});
	}

	function openDesktopContextMenu (workspace, x, y, rename) {
		var onlyOne = winManager.listWorkspaces().length < 2;

				// nowhere for them to go, so the last desktop stays.
				disabled: onlyOne,
				hint: onlyOne ? 'last one' : 'windows move over',
				action: function () { winManager.closeWorkspace(workspace.id); }
			},
			{separator: true},

					winManager.switchTo(created.id);

	function buildShellCommands () {

			.filter(function (workspace) {
				return !workspace.active;
			})
			.map(function (workspace) {

					run: function () { winManager.switchTo(workspace.id); }

		return commands.concat([
			{
				title: 'New desktop',

				run: function () {

					winManager.switchTo(created.id);
				}
			},
			{
				title: 'Start clean session',
				subtitle: 'Forget the saved desktops and windows, then reload. No files are touched',
				run: function () { window.startCleanSession(); }
			},
			{title: 'Show desktop', subtitle: 'Hide every window without closing it', run: function () { desktop.togglePeek(); }},
			{title: 'Wallpaper...', subtitle: 'Change the desktop background', run: function () { desktop.openWallpaperPicker(); }},
			{title: 'New Explorer', subtitle: 'Open a file manager window', run: function () { openApp('explorer'); }},
			{title: 'App Manager', subtitle: 'Install and update applications', run: function () { openApp('app-manager'); }},
			{

				subtitle: 'Rebuild the registry from the filesystem',
				run: function () {
					window.refreshInstalledAppsRegistry().catch(function (err) {
						console.error('Rescan failed', err);
					});
				}
			}
		]);

	// Cmd/Ctrl+K is the web's command-palette idiom and is unclaimed in Chrome; Ctrl+Space
	// is the second binding for anyone who prefers it, though macOS may take it for
	// switching input sources. The palette is reachable without either: the start menu's
	// search field and the desktop menu both lead to the same list.
	function isPaletteChord (e) {
		if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.code === 'KeyK') {
			return true;
		}
		return e.ctrlKey && !e.metaKey && !e.altKey && e.code === 'Space';
	}

	function onShellHotkey (e) {
		if (isPaletteChord(e)) {
			e.preventDefault();
			e.stopPropagation();
			startMenu.close();
			palette.toggle();
			return;
		}
		// Ctrl+1..9 switches desktops. If the OS claims it the way it claims Ctrl+Space,
		// the taskbar strip and the palette's "Desktop: ..." entries still work.
		if (e.ctrlKey && !e.metaKey && !e.altKey && /^Digit[1-9]$/.test(e.code)) {
			var workspaces = winManager.listWorkspaces();
			var target = workspaces[Number(e.code.slice(5)) - 1];
			if (target) {
				e.preventDefault();
				e.stopPropagation();
				winManager.switchTo(target.id);
			}
		}
	}

	async function persistDesktopSettings (patch) {
		var settings = await readJsonFile('/settings/desktop.json', {});
		var next = Object.assign({}, settings, patch);
		await writeFile('/settings/desktop.json', Buffer.from(JSON.stringify(next, null, 2)));
		return next;
	}

	function normalizeExtension (ext) {
		return String(ext || '').trim().replace(/^\./, '').toLowerCase();
	}

	// Expand an extension into match candidates, most specific first:
	// 'fb2.zip' -> ['fb2.zip', 'zip'], 'txt' -> ['txt']. Compound extensions
	// let an app claim a compound type without hijacking the trailing one.
	function normalizeExtensionCandidates (ext) {
		var normalized = normalizeExtension(ext);
		if (!normalized) {
			return [];
		}
		var parts = normalized.split('.');
		if (parts.length < 2) {
			return [normalized];
		}
		return [normalized, parts[parts.length - 1]];
	}

	// Candidates for a path: 'book.fb2.zip' -> ['fb2.zip', 'zip'].
	// Dotfiles ('.bashrc') stay extension-less, as path.extname reports them.
	function getExtensionCandidates (filePath) {
		var single = normalizeExtension(window.path.extname(filePath || ''));
		if (!single) {
			return [];
		}
		var parts = window.path.basename(String(filePath || '')).split('.');
		if (parts.length > 2 && parts[0] !== '') {
			return normalizeExtensionCandidates(parts.slice(-2).join('.'));
		}
		return [single];
	}

	function normalizeMimeType (mimeType) {
		return String(mimeType || '').trim().toLowerCase();
	}

	function isInstalledApp (appId) {
		return (window.apps || []).some(function (entry) {
			return entry.id === appId;
		});
	}

	function getFileCompatibilityProfile (filePath) {
		return new Promise(async function (resolve) {
			var extensions = getExtensionCandidates(filePath);
			var head = await readFileHead(filePath, 4096);
			var mimeType = await detectMimeType(head);
			var fallbackProfile = getExtensionCompatibilityProfile(extensions[0]);
			resolve({
				extension: extensions[0] || '',
				extensions: extensions,
				mimeType: mimeType || fallbackProfile.mimeType || null,
				isText: detectTextBytes(head, fallbackProfile.isText)
			});
		});
	}

	function getExtensionCompatibilityProfile (ext) {
		var extensions = normalizeExtensionCandidates(ext);
		var mimeType = null;
		for (var i = 0; i < extensions.length && !mimeType; i++) {
			mimeType = guessMimeTypeFromExtension(extensions[i]);
		}
		return {
			extension: extensions[0] || '',
			extensions: extensions,
			mimeType: mimeType,
			isText: extensions.some(function (item) {
				return isLikelyTextExtension(item, mimeType);
			})
		};
	}

	async function isAppCompatibleWithProfile (appId, profile) {
		var app = getAppRecord(appId);
		if (!app || !profile) return false;
		// Profiles built elsewhere may carry only the single `extension`.
		var candidates = Array.isArray(profile.extensions) && profile.extensions.length
			? profile.extensions
			: normalizeExtensionCandidates(profile.extension);
		var supportedExtensions = candidates.length ? await ensureAppSupportedExtensions(appId) : (app.supportedExtensions || []);
		if (candidates.some(function (ext) { return supportedExtensions.indexOf(ext) > -1; })) {
			return true;
		}
		if (profile.mimeType && app.supportedMimeTypes.indexOf(profile.mimeType) > -1) {
			return true;
		}
		if (profile.isText && app.supportsText) {
			return true;
		}
		return false;
	}

	function notifyAppsRegistryChanged () {
		window.dispatchEvent(new CustomEvent('pixos:apps-registry-updated', {
			detail: {
				apps: (window.apps || []).map(function (entry) {
					return {
						id: entry.id,
						installed: entry.installed,
						supportedExtensions: Array.isArray(entry.supportedExtensions) ? entry.supportedExtensions.slice() : null,
						supportStatus: entry.supportStatus
					};
				})
			}
		}));
	}

	function readJsonFile (filePath, fallbackValue) {
		return new Promise(function (resolve) {
			fs.readFile(filePath, function (err, content) {
				if (err || !content) {
					resolve(fallbackValue);
					return;
				}
				try {
					resolve(JSON.parse(content.toString()));
				}
				catch (parseErr) {
					console.error(parseErr);
					resolve(fallbackValue);
				}
			});
		});
	}

	function readFileHead (filePath, size) {
		return new Promise(function (resolve) {
			fs.open(filePath, 'r', function (openErr, fd) {
				if (openErr || fd === undefined || fd === null) {
					resolve(new Uint8Array(0));
					return;
				}
				var buffer = Buffer.alloc(size);
				fs.read(fd, buffer, 0, size, 0, function (readErr, bytesRead) {
					fs.close(fd, function () {});
					if (readErr || !bytesRead) {
						resolve(new Uint8Array(0));
						return;
					}
					resolve(new Uint8Array(buffer.slice(0, bytesRead)));
				});
			});
		});
	}

	async function detectMimeType (bytes) {
		if (!bytes || !bytes.length || typeof window.fileTypeFromBuffer !== 'function') {
			return null;
		}
		try {
			var result = await window.fileTypeFromBuffer(bytes);
			return result && result.mime ? normalizeMimeType(result.mime) : null;
		}
		catch (err) {
			console.error(err);
			return null;
		}
	}

	function detectTextBytes (bytes, fallbackIsText) {
		if (!bytes || !bytes.length) {
			return true;
		}
		var nulBytes = 0;
		for (var i = 0; i < bytes.length; i++) {
			if (bytes[i] === 0) {
				nulBytes++;
			}
		}
		if (nulBytes > Math.max(1, Math.floor(bytes.length * 0.02))) {
			return false;
		}
		try {
			new TextDecoder('utf-8', {fatal: true}).decode(bytes);
			return true;
		}
		catch (err) {
			return !!fallbackIsText;
		}
	}

	function guessMimeTypeFromExtension (extension) {
		var map = {
			txt: 'text/plain',
			md: 'text/markdown',
			log: 'text/plain',
			csv: 'text/csv',
			html: 'text/html',
			htm: 'text/html',
			css: 'text/css',
			js: 'text/javascript',
			mjs: 'text/javascript',
			json: 'application/json',
			xml: 'application/xml',
			yml: 'application/yaml',
			yaml: 'application/yaml',
			svg: 'image/svg+xml'
		};
		return map[extension] || null;
	}

	function isLikelyTextExtension (extension, mimeType) {
		if (!extension && !mimeType) return false;
		if (mimeType && /^text\//.test(mimeType)) {
			return true;
		}
		return [
			'txt', 'md', 'log', 'csv', 'html', 'htm', 'css', 'js', 'mjs',
			'json', 'xml', 'yml', 'yaml', 'svg'
		].indexOf(extension) > -1;
	}

}

window.listLaunchableApps = listLaunchableApps;

window.viewCounter = 0;

// Explorer and App Manager are preloaded before the registry exists, so the launcher
// has to know where they are without asking it.
var SYSTEM_APPS = {
	explorer: {name: 'Explorer', entryPath: '/apps/explorer/index.html', icon: '/apps/explorer/favicon.svg'},
	'app-manager': {name: 'App Manager', entryPath: '/apps/app-manager/index.html', icon: '/apps/app-manager/favicon.svg'}
};

// Per-app launch quirks live in this table rather than as branches inside openFile().
// Each entry may provide:
//   url(descriptor, entryPath)         the iframe src, defaulting to the entry path
//   iframeAttrs                        extra attributes on the iframe element
//   multi                              app takes several files in one window
//   prepare(descriptor)                runs before the window opens; result goes to deliver
//   deliver(frame, descriptor, ready)  runs on iframe load, instead of the default
//                                      contentWindow.openFile(path, name)
// Not an app: the launcher for a window whose content is a web page rather than a file.
// `launch({url})` selects it, and it is the one launcher whose src is used verbatim
// instead of being resolved under /__browserfs__.
//
// Most interesting sites refuse to be framed, and there is no way to find out from here
// -- a blocked frame still fires `load`, and its document is cross-origin -- so instead
// of guessing, the window says up front where the escape hatch is.
//
// `credentialless` is not optional. sw.js stamps Cross-Origin-Embedder-Policy on every
// response, and COEP is inherited by nested frames: without it *every* cross-origin site
// is blocked before it loads, whether or not it would have allowed being framed. The
// attribute is the per-frame exemption, and it is why apps/photopea works. Its cost is
// that the frame gets no cookies -- a site you are signed in to renders signed out.
var WEB_VIEW = {
	content: function (frameId, src, descriptor) {
		return '<div class="PixWebView">'
			+ '<div class="PixWebView__bar">'
			+ '<span class="PixWebView__url"></span>'
			+ '<button data-action="tab">Open in a browser tab</button>'
			+ '</div>'
			+ '<iframe id="' + frameId + '" credentialless src="' + escapeAttribute(src) + '"></iframe>'
			+ '</div>';
	},
	decorate: function (frame, descriptor) {
		var element = frame.parentElement;
		var label = element.querySelector('.PixWebView__url');
		if (label) {
			label.textContent = descriptor.url;
			label.title = descriptor.url;
		}
		var button = element.querySelector('[data-action="tab"]');
		if (button) {
			button.addEventListener('click', function () {
				window.open(descriptor.url, '_blank', 'noopener');
			});
		}
	},
	deliver: function () {}
};

// Only http(s) ever becomes a window: openUrl is reachable from any app in an iframe,
// and a javascript: or data: src would run in the shell's own origin.
function toWebViewUrl (raw) {
	var text = String(raw == null ? '' : raw).trim();
	if (!/^https?:\/\//i.test(text)) {
		return null;
	}
	try {
		return new URL(text).href;
	}
	catch (err) {
		return null;
	}
}

function escapeAttribute (value) {
	return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

var APP_LAUNCHERS = {
	explorer: {
		iframeAttrs: 'allow="file-system-access"',
		// Explorer reads its starting directory as it boots, which is long before the
		// parent's load handler could hand it one -- so it has to be in the URL.
		url: function (descriptor, entryPath) {
			return descriptor.paths[0]
				? entryPath + '?cwd=' + encodeURIComponent(descriptor.paths[0])
				: entryPath;
		},
		deliver: function () {}
	},
	treemap: {
		url: function (descriptor, entryPath) {
			if (!descriptor.paths[0]) {
				return entryPath;
			}
			var normalized = descriptor.paths[0].startsWith('/') ? descriptor.paths[0] : '/' + descriptor.paths[0];
			return entryPath + '?path=' + encodeURIComponent(normalized);
		},
		deliver: function () {}
	},
	'media-player': {
		multi: true,
		url: function (descriptor, entryPath) {
			return buildMediaPlayerEntryPath(descriptor.paths, entryPath);
		},
		// initPlaylist does not autoplay on its own.
		deliver: function (frame) {
			scheduleMediaPlayerAutoplay(frame);
		}
	},
	transcriber: {
		url: function (descriptor, entryPath) {
			return buildTranscriberEntryPath(descriptor.paths[0], entryPath);
		},
		deliver: function () {}
	},
	tic80: {
		// The app reads parent.__ticUrl as it boots, so the object URL has to exist
		// before the iframe is created, not on load.
		prepare: async function (descriptor) {
			if (!descriptor.paths[0]) {
				return null;
			}
			var blob = await fetch('/__browserfs__' + descriptor.paths[0]).then(function (r) {
				return r.blob();
			});
			window.__ticUrl = URL.createObjectURL(blob);
			return null;
		},
		deliver: function () {}
	},
	photopea: {
		// Photopea's openFile() wants an ArrayBuffer, not a path. The previous code
		// passed it an undefined variable, so opening an image here never worked.
		prepare: function (descriptor) {
			if (!descriptor.paths[0]) {
				return null;
			}
			return fetch('/__browserfs__' + descriptor.paths[0]).then(function (r) {
				return r.arrayBuffer();
			});
		},
		deliver: function (frame, descriptor, prepared) {
			frame.contentWindow.openFile(prepared, window.path.basename(descriptor.paths[0]));
		}
	}
};

// Every window in the system is opened through here, including windows with no file at
// all. The descriptor is also what a session restore will replay, so anything a window
// needs in order to come back has to be expressible in it.
// `restore` is only passed by session.js: it pins the window's id and desktop and says
// the placeholder is already in the layout about to be rebuilt around it.
async function launch (descriptor, restore) {
	descriptor = Object.assign({paths: []}, descriptor);
	descriptor.paths = (descriptor.paths || []).filter(Boolean);

	// A url descriptor is a web page in a window, and takes precedence over everything
	// else: there is no app and no file, so none of the resolution below applies.
	descriptor.url = descriptor.url ? toWebViewUrl(descriptor.url) : null;
	var external = !!descriptor.url;

	var appId = external ? null : (descriptor.appId || null);
	var launcher = external ? WEB_VIEW : ((appId && APP_LAUNCHERS[appId]) || {});
	// Without an app the path is the window: that is how Explorer opens a bare html file.
	var entryPath = external ? descriptor.url : (appId ? getAppEntryPath(appId) : descriptor.paths[0]);

	if (appId && !entryPath) {
		throw new Error('App ' + appId + ' has no launch path');
	}
	if (!entryPath) {
		throw new Error('launch() needs an app, a path or a url');
	}

	// A failed prepare must not swallow the whole launch: an app that opens empty is at
	// least visible and closable, whereas a rejected launch looks like a dead click.
	var prepared = null;
	if (launcher.prepare) {
		try {
			prepared = await launcher.prepare(descriptor);
		}
		catch (err) {
			console.error('Preparing ' + appId + ' for ' + descriptor.paths[0] + ' failed', err);
		}
	}
	var url = launcher.url ? launcher.url(descriptor, entryPath) : entryPath;

	window.viewCounter++;
	var frameId = 'view' + window.viewCounter;
	var attributes = launcher.iframeAttrs ? ' ' + launcher.iframeAttrs : '';
	var src = external ? url : '__browserfs__' + url;

	var record = winManager.openWindow({
		title: (restore && restore.title) || descriptor.title || defaultWindowTitle(descriptor),
		appId: appId,
		path: descriptor.paths[0] || null,
		launch: {
			appId: appId,
			paths: descriptor.paths.slice(),
			url: descriptor.url,
			title: descriptor.title || null
		},
		content: launcher.content
			? launcher.content(frameId, src, descriptor)
			: '<iframe id="' + frameId + '"' + attributes + ' src="' + src + '"></iframe>',
		id: restore ? restore.id : undefined,
		workspace: restore ? restore.workspace : undefined,
		detached: restore ? restore.detached : false
	});

	var frame = winManager.getFrame(record.id);

	if (launcher.decorate) {
		launcher.decorate(frame, descriptor);
	}
	frame.onload = function () {
		if (launcher.deliver) {
			launcher.deliver(frame, descriptor, prepared);
		}
		else {
			deliverFile(frame, descriptor);
		}
	};

	return record;
}

// The App API: the shell hands the app a /__browserfs__ path plus the real basename,
// because the path it is served from may carry no usable extension.
function deliverFile (frame, descriptor) {
	if (!descriptor.appId || !descriptor.paths.length) {
		return;
	}
	frame.contentWindow.openFile('/__browserfs__' + descriptor.paths[0], window.path.basename(descriptor.paths[0]));
}

function defaultWindowTitle (descriptor) {
	if (descriptor.url) {
		return descriptor.url.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[/?#]/)[0];
	}
	if (descriptor.paths.length > 1) {
		return descriptor.paths.length + ' files';
	}
	if (descriptor.paths[0]) {
		return descriptor.paths[0];
	}
	return getAppName(descriptor.appId) || 'PixOS';
}

function openApp (appId) {
	// Recorded here rather than in each launcher, so every route -- menu, start panel,
	// palette, Explorer -- feeds the same recents list.
	appsModel.noteLaunch(appId);
	return launch({appId: appId});
}

async function openFile (filePath, appId) {
	if (!appId) {
		appId = await getDefaultAppForPath(filePath);
	}
	return launch({appId: appId, paths: [filePath]});
}

async function openFiles (paths, appId) {
	if (!Array.isArray(paths) || !paths.length) {
		return;
	}
	if (paths.length === 1) {
		return openFile(paths[0], appId);
	}
	if (!appId) {
		appId = 'media-player';
	}
	if ((APP_LAUNCHERS[appId] || {}).multi) {
		return launch({appId: appId, paths: paths});
	}
	for (var i = 0; i < paths.length; i++) {
		await openFile(paths[i], appId);
	}
}

// A web page in a PixOS window. Reachable from any app through `parent.openUrl` --
// Bookmarks uses it for links flagged "open inside PixOS" -- so the url is validated in
// launch() rather than trusted here.
function openUrl (url, title) {
	return launch({url: url, title: title || null});
}

// 'new explorer' is what Explorer's own menu still calls this.
async function openPath (dirPath, appId) {
	if (!appId || appId === 'new explorer') {
		appId = 'explorer';
	}
	return launch({appId: appId, paths: dirPath ? [dirPath] : []});
}

function buildDesktopMenu () {
	var groups = appsModel.ordered();
	var submenu = [];

	// Recents on top, separated -- the same ordering the start menu uses.
	if (groups.recent.length) {
		submenu = submenu.concat(groups.recent.map(appMenuItem), [{separator: true}]);
	}
	submenu = submenu.concat(groups.rest.map(appMenuItem));

	if (!submenu.length) {
		submenu = [{label: 'No applications installed', disabled: true}];
	}

	return [
		{label: 'Applications', submenu: submenu},
		{label: 'Search...', hint: 'Ctrl+K', action: function () { palette.open(); }},
		{separator: true},
		{label: 'New Explorer', action: function () { openApp('explorer'); }},
		{label: 'App Manager', action: function () { openApp('app-manager'); }},
		{separator: true},
		{label: 'Wallpaper...', action: function () { desktop.openWallpaperPicker(); }},
		{
			label: desktop.isPeeking() ? 'Show windows' : 'Show desktop',
			action: function () { desktop.togglePeek(); }
		}
	];
}

function appMenuItem (app) {
	return {
		label: app.name,
		icon: app,
		action: function () {
			openApp(app.id);
		}
	};
}

// Only apps whose files are actually in BrowserFS: the catalog also lists apps that are
// merely installable, and launching one of those opens a window onto nothing.
function listLaunchableApps () {
	var installed = {};
	(window.apps || []).forEach(function (entry) {
		installed[entry.id] = true;
	});

	var apps = (typeof window.getInstallableApps === 'function' ? window.getInstallableApps() : [])
		.filter(function (app) {
			return installed[app.id];
		})
		.map(function (app) {
			// App Manager's records call it `label`; the manifest calls it `name`.
			return {id: app.id, name: app.name || app.label || app.id, icon: app.icon || null};
		});

	Object.keys(SYSTEM_APPS).forEach(function (id) {
		if (!apps.some(function (app) { return app.id === id; })) {
			apps.push({id: id, name: SYSTEM_APPS[id].name, icon: SYSTEM_APPS[id].icon || null});
		}
	});

	return apps.sort(function (a, b) {
		return a.name.localeCompare(b.name);
	});
}

// Same resolution order as getAppEntryPath: the catalog alone would miss local apps,
// which are folders the user created under /apps/ and never appear there.
// One record per app for anything that has to draw it: id, name and icon path.
function getLaunchableApp (appId) {
	if (!appId) {
		return null;
	}
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	if (app) {
		return {id: app.id, name: app.name || app.label || app.id, icon: app.icon || null};
	}
	return SYSTEM_APPS[appId]
		? {id: appId, name: SYSTEM_APPS[appId].name, icon: SYSTEM_APPS[appId].icon || null}
		: null;
}

function getAppName (appId) {
	if (!appId) {
		return null;
	}
	if (SYSTEM_APPS[appId]) {
		return SYSTEM_APPS[appId].name;
	}
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	return (app && (app.name || app.label)) || appId;
}

function buildBrowserFsAbsoluteUrl (fsPath) {
	var normalized = String(fsPath || '');
	if (!normalized.startsWith('/')) {
		normalized = '/' + normalized;
	}
	return new URL('/__browserfs__' + normalized, location.href).href;
}

function guessMediaPlayerMimeType (ext) {
	var map = {
		mp4: 'video/mp4',
		m4v: 'video/mp4',
		mov: 'video/quicktime',
		webm: 'video/webm',
		mkv: 'video/x-matroska',
		avi: 'video/x-msvideo',
		mpg: 'video/mpeg',
		mpeg: 'video/mpeg',
		m2ts: 'video/mp2t',
		ts: 'video/mp2t',
		mp3: 'audio/mpeg',
		m4a: 'audio/mp4',
		aac: 'audio/aac',
		wav: 'audio/wav',
		flac: 'audio/flac',
		ogg: 'audio/ogg',
		oga: 'audio/ogg',
		opus: 'audio/ogg',
		m3u8: 'application/vnd.apple.mpegurl',
		m3u: 'audio/x-mpegurl'
	};
	return map[ext] || null;
}

function buildMediaPlayerPlaylistEntry (fsPath) {
	var fileUrl = buildBrowserFsAbsoluteUrl(fsPath);
	var name = window.path.basename(fsPath);
	var ext = window.path.extname(fsPath).replace(/^\./, '').toLowerCase();
	var entry = {
		url: fileUrl,
		name: name
	};
	var mimeType = guessMediaPlayerMimeType(ext);
	if (mimeType) {
		entry.mimeType = mimeType;
	}
	return entry;
}

function buildMediaPlayerEntryPath (fsPaths, appEntryPath) {
	var paths = Array.isArray(fsPaths) ? fsPaths : [fsPaths];
	var playlist = encodeURIComponent(JSON.stringify(
		paths.map(buildMediaPlayerPlaylistEntry)
	));
	var base = appEntryPath || '/apps/media-player/index.html';
	return base + '?initPlaylist=' + playlist;
}

function buildTranscriberEntryPath (fsPath, appEntryPath) {
	var audioUrl = buildBrowserFsAbsoluteUrl(fsPath);
	var base = appEntryPath || '/apps/transcriber/index.html';
	return base + '?audio=' + encodeURIComponent(audioUrl);
}

function scheduleMediaPlayerAutoplay (iframe) {
	var attempts = 0;
	function tryPlay () {
		attempts++;
		var doc = iframe.contentDocument;
		if (!doc) {
			return;
		}
		var playBtn = doc.querySelector('[data-playlist-play]')
			|| doc.querySelector('#viewer-center-button');
		if (playBtn && !playBtn.disabled) {
			playBtn.click();
			return;
		}
		if (attempts < 40) {
			setTimeout(tryPlay, 150);
		}
	}
	setTimeout(tryPlay, 200);
}

async function getDefaultAppForPath (path) {
	if (typeof window.getExtensionCandidates !== 'function' || typeof window.getDefaultAppForExtension !== 'function') {
		return null;
	}
	// Most specific first, so a 'fb2.zip' association beats a plain 'zip' one.
	var candidates = window.getExtensionCandidates(path);
	var appId = null;
	for (var i = 0; i < candidates.length && !appId; i++) {
		appId = window.getDefaultAppForExtension(candidates[i]);
	}
	if (!appId) {
		return null;
	}
	if (typeof window.getFileCompatibilityProfile === 'function' && typeof window.isAppCompatibleWithProfile === 'function') {
		var profile = await window.getFileCompatibilityProfile(path);
		return await window.isAppCompatibleWithProfile(appId, profile) ? appId : null;
	}
	return appId;
}

function getAppEntryPath (appId) {
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	if (app && app.entryPath) {
		return app.entryPath;
	}
	return SYSTEM_APPS[appId] ? SYSTEM_APPS[appId].entryPath : null;
}

function blobToBase64(blob) {
  return new Promise((resolve, _) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

</script>
</body>
