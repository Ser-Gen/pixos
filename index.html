<!-- PeerJS, vendored: it was loaded from unpkg, which made every peer feature dead on an
     offline boot with nothing on screen saying why. It is an IIFE that sets window.Peer,
     not a module, so it cannot be imported -- js/shell/peers.js reads the global and says
     so when it is missing. See js/peerjs/README.md. -->
<script src="js/peerjs/peerjs.min.js"></script>
<link rel="stylesheet" href="js/goldenlayout/goldenlayout-base.css">
<link rel="stylesheet" href="js/goldenlayout/goldenlayout-dark-theme.css">
<style>
	html,
	body {
		margin: 0;
		height: 100%;
		overflow: hidden;
	}
	body {
		background-color: #12141a;
		color: #fff;
	}

	/* The shell is four stacked layers and z-index is the entire contract between them.
	   #windows is fixed at the viewport origin on purpose: the containers inside it are
	   positioned from getBoundingClientRect(), i.e. in viewport coordinates, so giving
	   this element a transform or an offset parent silently misplaces every window. */
	#shell {
		position: fixed;
		inset: 0;
	}
	#desktop {
		position: absolute;
		inset: 0;
		z-index: 0;
		overflow: hidden;
	}
	/* The bottom inset is the taskbar's height, published by taskbar.js so the number
	   lives in one place. GoldenLayout lays windows out inside this box and the iframe
	   rects follow from it, so nothing ends up underneath the bar. */
	#root {
		position: absolute;
		inset: 0 0 var(--pixos-taskbar-height, 38px) 0;
		z-index: 10;
	}
	#windows {
		position: fixed;
		inset: 0;
		z-index: 100;
		pointer-events: none;
	}
	#taskbar {
		position: fixed;
		inset: auto 0 0 0;
		z-index: 200;
	}
	#overlays {
		position: fixed;
		inset: 0;
		z-index: 300;
		pointer-events: none;
	}
	#windows > *,
	#overlays > * {
		pointer-events: auto;
	}

	/* One layout per desktop, stacked in the same box; only the active one is shown.
	   Hiding rather than detaching is what keeps every iframe alive across a switch. */
	#root > .PixWorkspace {
		position: absolute;
		inset: 0;
	}

	[data-goldenlayout-contid] {
		position: absolute;
	}
	[data-goldenlayout-winid] {
		width: 100%;
		height: 100%;
	}

	/* Let the wallpaper through: the dark theme paints both of these opaque. */
	.lm_goldenlayout,
	.lm_content {
		background: transparent;
	}

	/* With no windows open the layout is still a full-screen transparent sheet. Without
	   this the desktop underneath would never receive a right-click. */
	.PixShell--empty #root {
		pointer-events: none;
	}

	/* Peek hides the windows without touching them. Anything that moved an iframe in the
	   DOM here would reload it and throw away the app's state. */
	#root,
	#windows {
		transition: opacity 180ms ease;
	}
	.PixShell--peek #root,
	.PixShell--peek #windows {
		opacity: 0;
		pointer-events: none;
	}
	/* The rule above puts pointer-events back on every window; without this an invisible
	   iframe still swallows the clicks and right-clicks meant for the desktop. */
	.PixShell--peek #windows > * {
		pointer-events: none;
	}

	iframe {
		border: 1px solid #000;
		background-color: #1b1e23;
		box-sizing: border-box;
	}

	/* A window showing an external site. Most sites refuse to be framed and there is no
	   way to detect that from here -- a blocked frame still fires load -- so the bar is
	   always there rather than appearing after a guess about what went wrong. */
	.PixWebView {
		display: flex;
		flex-direction: column;
		border: 1px solid #000;
		background: #1b1e23;
		box-sizing: border-box;
	}

	.PixWebView iframe {
		flex: 1 1 auto;
		width: 100%;
		border: 0;
	}

	.PixWebView__bar {
		flex: 0 0 auto;
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 5px 8px;
		font: 11px/1.4 Arial, Helvetica, sans-serif;
		color: #98a0ac;
		background: #171a20;
		border-bottom: 1px solid rgba(255, 255, 255, .08);
	}

	.PixWebView__url {
		flex: 1 1 auto;
		min-width: 0;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.PixWebView__bar button {
		flex: none;
		font: inherit;
		padding: 3px 8px;
		color: #dfe3ea;
		background: rgba(255, 255, 255, .07);
		border: 1px solid rgba(255, 255, 255, .12);
		border-radius: 3px;
		cursor: pointer;
	}

	.PixWebView__bar button:hover { background: rgba(255, 255, 255, .14); }
	#omg {
		position: fixed;
		top: 0;
		left: 50%;
		z-index: 100;
	}
</style>

<div id="shell">
	<div id="desktop"></div>
	<div id="root"></div>
	<div id="windows"></div>
	<div id="taskbar"></div>
	<div id="overlays"></div>
</div>

<script type="module">
import WM from "./js/shell/wm.js";
import * as desktop from "./js/shell/desktop.js";
import * as taskbar from "./js/shell/taskbar.js";
import * as appsModel from "./js/shell/apps-model.js";
import * as contextMenu from "./js/shell/context-menu.js";
import * as session from "./js/shell/session.js";
import * as startMenu from "./js/shell/start-menu.js";
import * as palette from "./js/shell/command-palette.js";
import * as notifications from "./js/shell/notifications.js";
import * as failure from "./js/shell/failure.js";
import * as stats from "./js/shell/system-stats.js";
import * as tabs from "./js/shell/tabs.js";
import * as fullscreen from "./js/shell/fullscreen.js";
import * as overview from "./js/shell/overview.js";
import * as peers from "./js/shell/peers.js";
import * as peersPanel from "./js/shell/peers-panel.js";
import * as peerFs from "./js/shell/peer-fs.js";
import * as fileSearch from "./js/shell/file-search.js";
import * as openWith from "./js/shell/open-with.js";
import * as bookmarks from "./js/shell/bookmarks.js";

var winManager = new WM({
	root: '#root',
	windowsRoot: '#windows'
});

window.wm = winManager;
window.desktop = desktop;

// Set up before anything else in the boot sequence, so a failure *during* boot has
// somewhere to be reported. The overlay layer already exists in the markup.
notifications.init({host: document.getElementById('overlays')});

// Reachable from inside any app iframe as parent.notify(...). The source label is not
// optional and not the caller's to omit: a note has to say who raised it, or an app could
// put words in the system's mouth.
window.notify = function (input) {
	var note = Object.assign({}, input || {});
	if (!note.source) {
		note.source = 'PixOS';
	}
	return notifications.notify(note);
};
window.dismissNotification = notifications.dismiss;

// Exposed for apps, which cannot import shell modules -- they are installed into
// BrowserFS and have to be self-contained. Explorer uses these to explain a failed
// download; anything calling them should degrade if they are absent.
window.describeFetchFailure = function (options) {
	return failure.describeFetchFailure(Object.assign({
		online: navigator.onLine,
		pageOrigin: location.origin
	}, options || {}));
};
window.describeError = function (context, error, options) {
	return failure.describeError(context, error, Object.assign({
		online: navigator.onLine
	}, options || {}));
};

// The net. Every silent failure in the system lands here whether or not anyone thought to
// catch it -- which is the point, because the ones worth finding are the ones nobody
// expected. Both are capture-phase on window so nothing can swallow them first.
window.addEventListener('unhandledrejection', function (e) {
	var described = window.describeError('Something failed in the background', e.reason);
	console.error('Unhandled rejection', e.reason);
	notifications.notify({
		level: 'error',
		title: described.title,
		message: described.message,
		source: 'PixOS'
	});
});

window.addEventListener('error', function (e) {
    // Resource load failures (a missing <img>) also fire this, with no error object and a
    // target that is not the window. Those are not worth interrupting anyone for.
    if (!e.error) {
        return;
    }
    console.error('Uncaught error', e.error);
    notifications.notify({
        level: 'error',
        title: 'Something went wrong',
        message: String(e.error.message || e.error),
        source: 'PixOS'
    });
});

var scope = location.pathname.replace(/\/[^\/]+$/, '/');

if ('serviceWorker' in navigator) {
	// loading this repo from browerFS will not work because serviceWorker can't be loaded from
	// service worker.
	if (!scope.match(/__browserfs__/)) {
		navigator.serviceWorker.register('sw.js', {scope})
			.then(function(reg) {
				reg.addEventListener('updatefound', function() {
					var installingWorker = reg.installing;
					console.log('A new service worker is being installed:',
								installingWorker);
				});
				// registration worked
				console.log('Registration succeeded. Scope is ' + reg.scope);

				function ensureCrossOriginIsolated() {
					if (window.crossOriginIsolated) {
						sessionStorage.removeItem('pixos-coi-reload');
						return;
					}
					if (sessionStorage.getItem('pixos-coi-reload')) {
						return;
					}
					if (!navigator.serviceWorker.controller) {
						return;
					}
					sessionStorage.setItem('pixos-coi-reload', '1');
					location.reload();
				}
				ensureCrossOriginIsolated();
				navigator.serviceWorker.addEventListener('controllerchange', ensureCrossOriginIsolated);

				BrowserFS.configure({
					fs: "MountableFileSystem",
					options: {
						"/": {
							fs: "IndexedDB",
							options: {
								storeName: 'lol'
							}
						}
					}
				}, fsOnInit);
			}).catch(function(error) {
				// registration failed
					console.log('Registration failed with ' + error);
			});
	}
}

// СДЕЛАТЬ: возможно, нужно показывать прогресбар
function fsOnInit () {
	window.fs = BrowserFS.BFSRequire('fs');
	window.path = BrowserFS.BFSRequire('path');
	var {Buffer} = BrowserFS.BFSRequire('buffer');
	window.Buffer = Buffer;
	window.mountManager = new MountManager(BrowserFS, window.fs);

	// File System Access API must run in the same window as window.fs / MountManager.
	window.pickNativeDirectory = async function () {
		if (typeof showDirectoryPicker !== 'function') {
			throw new Error('File System Access API is not supported in this browser');
		}
		var handle = await showDirectoryPicker();
		if (handle.requestPermission) {
			var perm = await handle.queryPermission({ mode: 'readwrite' });
			if (perm !== 'granted') {
				perm = await handle.requestPermission({ mode: 'readwrite' });
			}
			if (perm !== 'granted') {
				throw new Error('Permission denied for local folder');
			}
		}
		return handle;
	};

	// Listen for file read requests from the Service Worker.
	// When SW can't find a file in IndexedDB (e.g. it's on a mounted FS),
	// it asks the main thread to read it via MessageChannel.
	if (navigator.serviceWorker) {
		navigator.serviceWorker.addEventListener('message', function (event) {
			if (!event.data || !event.ports || !event.ports.length) return;
			var port = event.ports[0];

			if (event.data.type === 'readFile') {
				window.fs.readFile(event.data.path, function (err, buf) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({buffer: buf.buffer || buf});
					}
				});
			} else if (event.data.type === 'stat') {
				window.fs.stat(event.data.path, function (err, stat) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({
							isFile: stat.isFile(),
							isDirectory: stat.isDirectory()
						});
					}
				});
			} else if (event.data.type === 'readdir') {
				window.fs.readdir(event.data.path, function (err, list) {
					if (err) {
						port.postMessage({error: err.message || String(err)});
					} else {
						port.postMessage({list: list});
					}
				});
			}
		});
	}

	// The preload list is data, not code: settings/preinstall.json says which files a
	// fresh system needs, which catalog apps to install, which user files to seed and
	// which extensions get a default app. It is fetched over HTTP from the served repo
	// rather than read from BrowserFS, because on a first boot BrowserFS is empty.
	//
	// A boot must survive that file being unreachable, so FALLBACK_PREINSTALL below is
	// the minimum that still produces a usable system: the shell's own two apps and the
	// registry they need.
	var FALLBACK_PREINSTALL = {
		files: [
			{path: '/apps/explorer/index.html', refresh: true},
			{path: '/apps/explorer/favicon.svg', refresh: true},
			{path: '/apps/app-manager/index.html', refresh: true},
			{path: '/apps/app-manager/favicon.svg', refresh: true},
			{path: '/apps/app-catalog.js', refresh: true},
			{path: '/apps/registry.json', refresh: true}
		],
		apps: [],
		seed: [],
		defaultApps: {}
	};

	var preinstall = FALLBACK_PREINSTALL;

	function fetchServed (filePath) {
		return fetch(path.join(scope, filePath) + '?' + Math.random());
	}

	async function loadPreinstallConfig () {
		try {
			var response = await fetchServed('/settings/preinstall.json');
			if (!response.ok) {
				throw new Error(response.status + ' ' + response.statusText);
			}
			var config = await response.json();
			return {
				files: Array.isArray(config.files) ? config.files : [],
				apps: Array.isArray(config.apps) ? config.apps : [],
				seed: Array.isArray(config.seed) ? config.seed : [],
				defaultApps: (config.defaultApps && typeof config.defaultApps === 'object') ? config.defaultApps : {}
			};
		}
		catch (err) {
			console.error('settings/preinstall.json could not be read; '
				+ 'booting with the built-in minimum', err);
			return FALLBACK_PREINSTALL;
		}
	}

	// `refresh` files are re-copied on every boot -- the shell's own apps and the
	// generated registry, which have to track the served copy or an update never
	// arrives. Everything else is copied only when missing, so a local edit survives.
	async function copyPreinstallFiles (entries) {
		await Promise.all(entries.map(async function (entry) {
			var item = typeof entry === 'string' ? {path: entry} : entry;
			if (!item || !item.path) {
				return;
			}
			if (!item.refresh && await stat(item.path)) {
				return;
			}
			try {
				var response = await fetchServed(item.path);
				if (!response.ok) {
					throw new Error(response.status + ' ' + response.statusText);
				}
				await writeFilePromise(item.path, Buffer.from(await response.arrayBuffer()));
			}
			catch (err) {
				// One missing file must not stop the boot: the rest of the system is
				// still worth having, and App Manager can repair an app later.
				console.error('Preloading ' + item.path + ' failed', err);
			}
		}));
	}

	// What preinstall has already done, so it never does it twice. One rule covers both
	// halves: anything the user removes afterwards stays removed. A preinstall list that
	// puts back what you deleted is worse than no preinstall list at all.
	//
	// The file used to be a bare array of app ids; that form is still read.
	async function readPreinstallState () {
		var raw = await readJsonFile('/settings/preinstalled.json', null);
		if (Array.isArray(raw)) {
			return {apps: raw.slice(), seeded: []};
		}
		return {
			apps: Array.isArray(raw && raw.apps) ? raw.apps.slice() : [],
			seeded: Array.isArray(raw && raw.seeded) ? raw.seeded.slice() : []
		};
	}

	function writePreinstallState (state) {
		return writeFilePromise('/settings/preinstalled.json', Buffer.from(JSON.stringify(state, null, 2)));
	}

	// User files, copied from a template exactly once and never refreshed: /home/about.md
	// is yours the moment it exists, and a boot that overwrote it would be a bug you only
	// noticed after losing something. Recorded once written, so deleting the file is a
	// decision the next boot respects rather than undoes.
	async function seedUserFiles (entries, state) {
		var changed = false;

		for (var i = 0; i < entries.length; i++) {
			var entry = entries[i];
			if (!entry || !entry.path || !entry.from) {
				continue;
			}
			if (state.seeded.indexOf(entry.path) !== -1 || await stat(entry.path)) {
				// Already seeded once, or already there. Record the second case too, so a
				// system that predates this bookkeeping does not re-seed after a delete.
				if (state.seeded.indexOf(entry.path) === -1) {
					state.seeded.push(entry.path);
					changed = true;
				}
				continue;
			}
			try {
				var response = await fetchServed(entry.from);
				if (!response.ok) {
					throw new Error(response.status + ' ' + response.statusText);
				}
				await writeFilePromise(entry.path, Buffer.from(await response.arrayBuffer()));
				state.seeded.push(entry.path);
				changed = true;
			}
			catch (err) {
				// Not recorded, so the next boot tries again: a template that failed to
				// download is not the user deciding they do not want the file.
				console.error('Seeding ' + entry.path + ' failed', err);
			}
		}

		return changed;
	}

	// Catalog apps that should be there on a fresh system, installed once and recorded.
	async function installPreinstallApps (ids, state) {
		var changed = false;

		for (var i = 0; i < ids.length; i++) {
			var id = ids[i];
			if (state.apps.indexOf(id) !== -1) {
				continue;
			}
			try {
				await window.installAppById(id);
			}
			catch (err) {
				console.error('Preinstalling ' + id + ' failed', err);
				// Not recorded, so the next boot tries again: a failure here is usually a
				// file that had not been generated yet, not a decision.
				continue;
			}
			state.apps.push(id);
			changed = true;
		}

		return changed;
	}

	// Only extensions with no default yet: this is a suggestion for a fresh system, not
	// a preference the shell gets to reassert over the user's own choice.
	async function seedDefaultApps (map) {
		var extensions = Object.keys(map || {});
		if (!extensions.length) {
			return;
		}
		var associations = window.defaultAppAssociations || {};
		var changed = false;
		extensions.forEach(function (extension) {
			var key = normalizeExtension(extension);
			if (associations[key] || !isInstalledApp(map[extension])) {
				return;
			}
			associations[key] = map[extension];
			changed = true;
		});
		if (changed) {
			window.defaultAppAssociations = associations;
			await persistDefaultAppAssociations();
		}
	}

	var preinstallState = {apps: [], seeded: []};

	loadPreinstallConfig()
		.then(function (config) {
			preinstall = config;
			return copyPreinstallFiles(config.files);
		})
		.then(async function () {
			preinstallState = await readPreinstallState();
			return seedUserFiles(preinstall.seed, preinstallState);
		})
		.then(function () {
			return loadDefaultAppAssociations();
		})
		.then(function () {
			// Before the desktop: the election has to be under way before anything is in a
			// position to write a settings file, and it takes a fraction of a second to
			// settle during which nobody writes at all.
			initTabs();
			fullscreen.init();
			return initDesktop();
		})
		.then(async function () {
			window.apps = [];
			// Awaited, unlike before: restoring a session needs to resolve each window's
			// app to an entry path, and that is only possible once the registry is built.
			try {
				await window.refreshInstalledAppsRegistry();
				scheduleInstalledAppSupportHydration();
			}
			catch (err) {
				console.error('refreshInstalledAppsRegistry failed', err);
			}
			// After the registry, because installing reads it; before the session,
			// because restoring a window has to be able to resolve its app.
			await installPreinstallApps(preinstall.apps, preinstallState);
			// One write for both halves, at the end: a crash mid-boot leaves the state as
			// it was, and the next boot repeats work rather than skipping it.
			await writePreinstallState(preinstallState);
			await seedDefaultApps(preinstall.defaultApps);
			await initSession();
		});

	function writeFile(filePath, contents, cb) {
		fs.stat(path.dirname(filePath), async function (e, stats) {
			if (stats) {
				fs.writeFile(filePath, contents, cb);
			}
			else {
				await checkAndCreateDestinationPath(path.dirname(filePath));
				fs.writeFile(filePath, contents, cb);
			}
		})
	}

	function checkAndCreateDestinationPath (fileDestination) {
		const dirPath = fileDestination.split('/');

		return Promise.all(
			dirPath.map(async (element, index) => {
				var stats = await stat(dirPath.slice(0, index + 1).join('/'));

				if (!stats) {
					return await mkdir(dirPath.slice(0, index + 1).join('/')); 
				}
				else {
					return Promise.resolve(true)
				}
			})
		)
	}

	function stat (path) {
		return new Promise(function (resolve) {
			fs.stat(path, function (e, stats) {
				if (stats) {
					resolve(true);
				}
				else {
					resolve(false);
				}
			})
		})
	}
	function mkdir (path) {
		return new Promise(function (resolve) {
			fs.mkdir(path, function (e) {
				resolve();
			})
		})
	}

	// Returns a Promise resolving to the written path, rejecting with the BrowserFS
	// error. Callers that ignore the result keep the old fire-and-forget behaviour:
	// the internal no-op catch marks a rejection handled, so a failed write logs to
	// the console instead of raising an unhandled rejection.
	window.saveFileLocal = function (path, content) {
		path = path.replace('/__browserfs__', '');
		var saved = new Promise(function (resolve, reject) {
			fs.writeFile(path, content, function (e) {
				if (e) {
					console.error(e);
					reject(e);
					return;
				}
				resolve(path);
			});
		});
		saved.catch(function () {});
		return saved;
	}

	PixosAppRegistry.init({
		fs: fs,
		path: path,
		scope: scope,
		legacyCatalog: window.PIXOS_APP_CATALOG || {},
		readJsonFile: readJsonFile,
		writeFile: function (filePath, contents) {
			return new Promise(function (resolve) {
				writeFile(filePath, contents, function () {
					resolve();
				});
			});
		},
		ensureDir: async function (dirPath) {
			await checkAndCreateDestinationPath(dirPath);
		},
		updateDefaultAppAssociations: updateDefaultAppAssociationId
	});

	function getAppRecord (id) {
		var installedRecord = getInstalledAppRecord(id);
		var app = PixosAppRegistry.getApp(id) || PixosAppRegistry.getCatalogApp(id);
		if (!app) {
			return null;
		}
		if (installedRecord) {
			app = Object.assign({}, app, {
				supportStatus: installedRecord.supportStatus
			});
		}
		return app;
	}

	async function loadSupportedExtensionsFromSource (files) {
		var supportedFilePath = (files || []).find(function (item) {
			return /\/pixos_supported$/.test(item);
		});
		if (!supportedFilePath) return [];
		try {
			var raw = await fetch(path.join(scope, supportedFilePath) + '?' + Math.random()).then(function (r) {
				return r.text();
			});
			return raw.trim() ? raw.trim().split(/\n/).map(function (item) {
				return item.trim().replace(/^\./, '').toLowerCase();
			}).filter(Boolean) : [];
		}
		catch (err) {
			console.error(err);
			return [];
		}
	}


	function getInstalledAppRecord (appId) {
		return (window.apps || []).find(function (entry) {
			return entry.id === appId;
		}) || null;
	}

	function ensureAppSupportedExtensions (appId) {
		window.__pixosAppSupportLoads = window.__pixosAppSupportLoads || {};
		var app = getAppRecord(appId);
		if (!app) {
			return Promise.resolve([]);
		}

		var installedRecord = getInstalledAppRecord(appId);
		if (installedRecord && Array.isArray(installedRecord.supportedExtensions)) {
			return Promise.resolve(installedRecord.supportedExtensions.slice());
		}
		if (Array.isArray(app.supportedExtensions) && app.supportedExtensions.length) {
			if (installedRecord) {
				installedRecord.supportedExtensions = app.supportedExtensions.slice();
				installedRecord.supportStatus = 'ready';
				notifyAppsRegistryChanged();
			}
			return Promise.resolve(app.supportedExtensions.slice());
		}
		if (window.__pixosAppSupportLoads[appId]) {
			return window.__pixosAppSupportLoads[appId];
		}

		if (installedRecord) {
			installedRecord.supportStatus = 'loading';
			notifyAppsRegistryChanged();
		}

		var filePaths = (app.files || []).map(function (item) {
			return typeof item === 'string' ? item : item.path;
		});
		var loadPromise = (installedRecord && app.supportedFilePath
			? readSupportedExtensionsFromFs(app.supportedFilePath)
			: loadSupportedExtensionsFromSource(filePaths)
		).then(function (extensions) {
			var normalized = Array.isArray(extensions) ? extensions.slice() : [];
			var raw = window.PIXOS_APP_CATALOG && window.PIXOS_APP_CATALOG[appId];
			if (raw) {
				raw.supportedExtensions = normalized.slice();
			}
			var currentRecord = getInstalledAppRecord(appId);
			if (currentRecord) {
				currentRecord.supportedExtensions = normalized.slice();
				currentRecord.supportStatus = 'ready';
				notifyAppsRegistryChanged();
			}
			return normalized;
		}).catch(function (err) {
			var currentRecord = getInstalledAppRecord(appId);
			if (currentRecord) {
				currentRecord.supportedExtensions = [];
				currentRecord.supportStatus = 'error';
				notifyAppsRegistryChanged();
			}
			console.error(err);
			return [];
		}).finally(function () {
			delete window.__pixosAppSupportLoads[appId];
		});

		window.__pixosAppSupportLoads[appId] = loadPromise;
		return loadPromise;
	}

	function scheduleInstalledAppSupportHydration (appIds) {
		var ids = Array.isArray(appIds) && appIds.length
			? appIds.slice()
			: (window.apps || []).map(function (entry) { return entry.id; });
		setTimeout(function () {
			ids.forEach(function (appId) {
				var record = getInstalledAppRecord(appId);
				if (!record || record.supportStatus === 'ready' || record.supportStatus === 'loading') {
					return;
				}
				ensureAppSupportedExtensions(appId);
			});
		}, 0);
	}

	async function ensureInstalledAppsSupportHydrated () {
		var ids = (window.apps || []).map(function (entry) {
			return entry.id;
		});
		return Promise.all(ids.map(function (appId) {
			return ensureAppSupportedExtensions(appId);
		}));
	}

	async function ensureCatalogAppsSupportHydrated () {
		var ids = getCatalogApps()
			.filter(function (app) {
				return !!app.entryPath;
			})
			.map(function (app) {
				return app.id;
			});
		return Promise.all(ids.map(function (appId) {
			return ensureAppSupportedExtensions(appId);
		}));
	}

	function readSupportedExtensionsFromFs (filePath) {
		return new Promise(function (resolve) {
			fs.readFile(filePath, function (err, file) {
				if (err || !file) {
					resolve([]);
					return;
				}
				resolve(normalizeSupportedExtensions(file.toString()));
			});
		});
	}

	function normalizeSupportedExtensions (raw) {
		return String(raw || '').trim()
			? String(raw).trim().split(/\n/).map(function (item) {
				return item.trim().replace(/^\./, '').toLowerCase();
			}).filter(Boolean)
			: [];
	}

	async function loadDefaultAppAssociations () {
		window.defaultAppAssociations = await readJsonFile('/settings/default-apps.json', {});
		return window.defaultAppAssociations;
	}

	// A rename carries the association across; an uninstall passes no new id, and then the
	// entry is *removed* rather than set to nothing. A null left in the table is an
	// extension that claims to have a default app and names none, which reads as an app
	// that failed to launch instead of a file with no default.
	async function updateDefaultAppAssociationId (oldId, newId) {
		var changed = false;
		Object.keys(window.defaultAppAssociations || {}).forEach(function (ext) {
			if (window.defaultAppAssociations[ext] === oldId) {
				if (newId) {
					window.defaultAppAssociations[ext] = newId;
				}
				else {
					delete window.defaultAppAssociations[ext];
				}
				changed = true;
			}
		});
		if (changed) {
			await persistDefaultAppAssociations();
		}
	}

	async function persistDefaultAppAssociations () {
		var cleaned = {};
		Object.keys(window.defaultAppAssociations || {}).forEach(function (ext) {
			var appId = window.defaultAppAssociations[ext];
			if (appId && isInstalledApp(appId)) {
				cleaned[normalizeExtension(ext)] = appId;
			}
		});
		window.defaultAppAssociations = cleaned;
		await writeFile('/settings/default-apps.json', Buffer.from(JSON.stringify(cleaned, null, 2)));
	}

	// The desktop is booted before the first window so that a failure anywhere later
	// still leaves a surface with a working right-click menu.
	// Two tabs of PixOS share one filesystem and one settings file. This elects one of them
	// to write the settings; the other keeps working normally and says who is in charge.
	// Deliberately not a lock on the *files* -- that race is real and unsolved, and the
	// note below says so rather than implying otherwise.
	function initTabs () {
		tabs.init({});
		var followerNote = null;

		tabs.subscribe(function (isOwner, ownerId) {
			if (followerNote !== null) {
				notifications.dismiss(followerNote);
				followerNote = null;
			}
			if (isOwner || ownerId === null) {
				return;
			}
			followerNote = notifications.notify({
				level: 'warn',
				title: 'Another PixOS tab is in charge',
				message: 'Your desktops, windows and recent apps are being saved by the '
					+ 'other tab, so this one will not overwrite them. Files work normally '
					+ 'here \u2014 but two tabs writing the same file at the same time is '
					+ 'still a race, and this does not fix that.',
				source: 'PixOS',
				actions: [{
					label: 'Take over',
					run: function () { tabs.takeOver(); }
				}]
			});
		});

		// Hand it on rather than leaving the others following a tab that no longer exists.
		// pagehide rather than unload: it is the one that fires on iOS and on a restored
		// back/forward navigation.
		window.addEventListener('pagehide', function () {
			tabs.release();
		});
	}

	async function initDesktop () {
		var settings = await readJsonFile('/settings/desktop.json', {});

		// Everything PixOS holds lives in IndexedDB, which the browser is free to evict
		// under storage pressure -- with no warning and no way back. This asks it not to.
		// Deliberately not awaited: Firefox may put a prompt in front of it, and the
		// desktop should not wait behind a dialog the user did not ask for. The answer
		// reaches the storage widget when it arrives.
		stats.requestPersistence().catch(function (err) {
			console.warn('persistent storage could not be requested', err);
		});

		appsModel.init({
			listApps: listLaunchableApps,
			readRecents: function () {

			},
			writeRecents: function (ids) {

			},
			readRecentFiles: function () {

			},

		});
		await appsModel.load();

		desktop.init({
			shell: document.getElementById('shell'),
			desktop: document.getElementById('desktop'),

			wm: winManager,

			widgets: settings.widgets,

		startMenu.init({
			host: document.getElementById('overlays'),
			openApp: openApp,
			openRecentFile: openRecentFile,
			actions: [
				{label: 'App Manager', run: function () { openApp('app-manager'); }},

			}
		});

		palette.init({
			host: document.getElementById('overlays'),
			wm: winManager,
			getApp: getLaunchableApp,
			openApp: openApp,
			openFile: openFile,
			openPath: openPath,
			openRecentFile: openRecentFile,
			listFiles: listDirectoryEntries,
			searchFiles: searchFiles,
			describeSearch: fileSearch.describe,
			commands: buildShellCommands
		});

		openWith.init({
			host: document.getElementById('overlays'),
			getApp: getLaunchableApp
		});

		// One connection to another PixOS, and the one place that says who is on it. The
		// shell owns this rather than Explorer because a shared folder is a mount, a call
		// is not a file manager's business, and a phone driving this machine is not
		// either -- Explorer is one caller among several to come.
		peers.init({
			read: function () {
				return readJsonFile(peers.SETTINGS_PATH, null);
			},
			write: function (data) {
				return writeFilePromise(peers.SETTINGS_PATH, Buffer.from(JSON.stringify(data, null, 2)));
			},
			// A peer id can only be registered with a broker once, so the tab that owns
			// the session owns the connection too. A second tab watches.
			canWrite: tabs.isOwner,
			readFile: function (filePath) {
				return new Promise(function (resolve, reject) {
					window.fs.readFile(filePath, function (err, buffer) {
						if (err) {
							reject(err);
						}
						else {
							resolve(buffer);
						}
					});
				});
			},
			readdir: function (dirPath) {
				return new Promise(function (resolve, reject) {
					window.fs.readdir(dirPath, function (err, list) {
						if (err) {
							reject(err);
						}
						else {
							resolve(list || []);
						}
					});
				});
			},
			stat: function (filePath) {
				return new Promise(function (resolve, reject) {
					window.fs.stat(filePath, function (err, stats) {
						if (err) {
							reject(err);
						}
						else {
							resolve(stats);
						}
					});
				});
			},
			// Mounting a folder is a bigger question than accepting one file, and it is
			// asked the same way: a note naming who and which folder, with Accept and
			// Refuse. Holding a peer id gets you as far as asking.
			askMount: function (request) {
				return new Promise(function (resolve) {
					var decided = false;
					var answer = function (accepted) {
						if (!decided) {
							decided = true;
							resolve(accepted);
						}
					};
					notifications.notify({
						level: 'warn',
						title: request.from + ' wants to open a folder you shared',
						message: request.folder + ' — they would be able to read everything '
							+ 'in it and everything under it, until you stop sharing or they '
							+ 'disconnect. They cannot write.',
						source: 'PixOS',
						actions: [
							{label: 'Let them', run: function () { answer(true); }},
							{label: 'No', run: function () { answer(false); }}
						]
					});
				});
			},
			// The far side stopped sharing, or the connection went. Either way the mount
			// is now a folder whose every call fails, which is worse than no folder.
			onUnshare: function (peerId) {
				unmountPeer(peerId);
			},
			// An incoming file is a question with a name and a size on it, never an
			// event: a peer that can write into this filesystem because you once pressed
			// Connect is not a peer, it is an intruder.
			ask: function (offer) {
				return new Promise(function (resolve) {
					var decided = false;
					var answer = function (accepted) {
						if (!decided) {
							decided = true;
							resolve(accepted);
						}
					};
					notifications.notify({
						level: 'warn',
						title: offer.from + ' wants to send you a file',
						message: offer.name + ' — ' + peers.formatBytes(offer.size)
							+ '. It would be saved into ' + peers.INBOX + '.',
						source: 'PixOS',
						actions: [
							{label: 'Accept', run: function () { answer(true); }},
							{label: 'Refuse', run: function () { answer(false); }}
						]
					});
				});
			},
			saveIncoming: async function (name, parts) {
				await checkAndCreateDestinationPath(peers.INBOX);
				var taken = await new Promise(function (resolve) {
					window.fs.readdir(peers.INBOX, function (err, list) {
						resolve(err ? [] : (list || []));
					});
				});
				// Never on top of something already there -- not one of yours, and not an
				// earlier file of the same name from somebody else.
				var target = path.join(peers.INBOX, peers.freeName(name, taken));
				await writeFilePromise(target, Buffer.concat(parts.map(function (part) {
					return Buffer.from(part);
				})));
				return target;
			},
			onSaved: function (info) {
				notifications.notify({
					level: 'info',
					title: 'Received ' + info.name,
					message: 'From ' + info.from + ', saved as ' + info.path,
					source: 'PixOS',
					actions: [{label: 'Open it', run: function () { openFile(info.path); }}]
				});
			},
			onFailed: function (info) {
				notifications.notify({
					level: 'error',
					title: 'Could not save ' + info.name,
					message: (info.error && info.error.message) || 'The write failed.',
					source: 'PixOS'
				});
			}
		});
		peers.load();

		peersPanel.init({
			host: document.getElementById('overlays'),
			onMount: function (peerId) {
				return mountPeerFolder(peerId);
			}
		});


		overview.init({
			host: document.getElementById('overlays'),
			wm: winManager,
			getApp: getLaunchableApp,
			onShow: revealWindow,
			onClose: function (id) {
				winManager.closeWindow(id);

			}
		});

		taskbar.init({
			host: document.getElementById('taskbar'),
			isMenuOpen: startMenu.isOpen,
			onCloseMenu: startMenu.close,
			wm: winManager,
			getApp: getLaunchableApp,
			onStart: function (anchorRect, anchorElement) {

			},
			onPeek: function () {

			onOverview: function () {

			onPeers: function () {

		});

		// The same handler for keys pressed while an app iframe has focus.
		winManager.on('keydown', onShellHotkey);

		winManager.on('mousedown', function () {
			startMenu.close();
			palette.close();
		});
	}

	async function initSession () {
		session.init({
			wm: winManager,
			clean: new URLSearchParams(location.search).get('clean') === '1',
			read: function () {
				return readJsonFile('/settings/session.json', null);
			},
			write: function (data) {
				return writeFilePromise('/settings/session.json', Buffer.from(JSON.stringify(data, null, 2)));
			},
			writeAside: function (data) {
				return writeFilePromise('/settings/session-failed.json', Buffer.from(JSON.stringify(data, null, 2)));
			},
			canWrite: tabs.isOwner,
			launch: launch
		});

		// A session file that cannot be restored at all must not wedge the boot: log it,
		// start empty, and carry on to opening Explorer below.
		var result = {restored: 0, reason: null};
		try {
			result = await session.restore();
		}
		catch (err) {
			console.error('Restoring the session failed', err);
			result = {restored: 0, reason: 'the saved session could not be read'};
		}
		// Otherwise every later reload of this tab would keep starting clean, because the
		// flag is in the URL rather than in anything the user meant to make permanent.
		if (location.search.indexOf('clean=1') > -1 && window.history && history.replaceState) {
			history.replaceState(null, '', location.pathname);
		}
		if (result.reason) {
			console.log('PixOS session: starting clean (' + result.reason + ')');
		}
		// A restore that brought nothing back still needs somewhere to start.
		if (!result.restored) {
			openApp('explorer').catch(function (err) {
				console.error('Failed to open Explorer', err);
			});
		}
		// Only now: autosaving any earlier would write the empty mid-restore state over
		// the session being restored.
		session.start();
	}

	// The browser's dialog is generic and cannot say what is unsaved, so the value is
	// entirely in *when* it appears. Armed only while some window says it has unsaved work;
	// a page that always asks is a page nobody reads.
	window.addEventListener('beforeunload', function (e) {
		if (!winManager.listDirty().length) {
			return;
		}
		e.preventDefault();

		e.returnValue = '';

	// Entering announces what changed, because the whole value of the mode is knowing
	// whether Ctrl/Cmd+W is about to cost you your desktop -- and where the browser will
	// not give the key up, saying so is the entire point rather than a caveat.
	async function toggleFullscreen () {
		var info = fullscreen.describe();
		if (!info.available) {
			notifications.notify({level: 'warn', title: info.title, message: info.message, source: 'PixOS'});
			return;
		}
		try {
			var next = await fullscreen.toggle();
			if (next.active) {
				notifications.notify({
					level: next.locked ? 'info' : 'warn',
					title: info.title,
					message: info.message,
					source: 'PixOS'
				});
			}
		}
		catch (err) {
			notifications.notify({
				level: 'warn',
				title: 'Could not go fullscreen',
				message: 'The browser refused. Fullscreen has to be asked for by a click or '
					+ 'a keypress, and some browsers refuse it in an embedded page.',
				source: 'PixOS'
			});
		}
	}

	window.toggleFullscreen = toggleFullscreen;

	window.startCleanSession = async function () {
		await session.clear();
		location.href = location.pathname + '?clean=1';

	function writeFilePromise (filePath, contents) {
		return new Promise(function (resolve) {
			writeFile(filePath, contents, function () {
				resolve();
			});
		});
	}

	// Typing in the palette walks one directory at a time, and usually the same one for
	// several keystrokes in a row, so the last listing is worth keeping -- but only
	// briefly, or a file created while the palette is open would never show up.
	var LISTING_TTL = 5000;
	var lastListing = {path: null, entries: null, at: 0};

	function listDirectoryEntries (dirPath) {
		if (lastListing.path === dirPath && Date.now() - lastListing.at < LISTING_TTL) {
			return Promise.resolve(lastListing.entries);
		}
		return readDirectory(dirPath).then(function (entries) {
			lastListing = {path: dirPath, entries: entries, at: Date.now()};
			return entries;
		});
	}

	// Deliberately not cached: a tree walk reads hundreds of directories and would evict
	// the one listing the palette is showing on every step.
	function readDirectory (dirPath) {
		return new Promise(function (resolve) {
			fs.readdir(dirPath, function (err, names) {
				if (err || !names) {
					resolve([]);
					return;
				}
				Promise.all(names.slice(0, 500).map(function (name) {
					return new Promise(function (done) {
						fs.stat(path.join(dirPath, name), function (statErr, stats) {
							done({name: name, isDirectory: !!(stats && stats.isDirectory())});
						});
					});
				})).then(resolve);
			});
		});
	}

	// The palette asks for a walk and gets back a token it can cancel plus the promise.
	// Splitting them is what lets the next keystroke stop this one without waiting for it.
	function searchFiles (request) {
		var token = fileSearch.createToken();
		return {
			token: token,
			done: fileSearch.search({
				readdir: readDirectory,
				query: request.query,
				root: request.root,
				token: token
			})
		};
	}

	function openDesktopContextMenu (workspace, x, y, rename) {

				label: 'Close desktop',

				// nowhere for them to go, so the last desktop stays.
				disabled: onlyOne,
				hint: onlyOne ? 'last one' : 'windows move over',
				action: function () { winManager.closeWorkspace(workspace.id); }

			{

			},
			{
				title: 'Peers',
				// The subtitle is the reading, because "is anyone connected to my machine"
				// is the question this command exists to answer and the palette can answer

				subtitle: (function () {
					var state = peers.snapshot();
					return state.links.length
						? state.links.length + (state.links.length === 1 ? ' machine is' : ' machines are')

					// a close command that will not say what it closes is one nobody uses.
					subtitle: focused
						? (focused.path || focused.title) + (focused.dirty ? ' — has unsaved changes' : '')
						: 'No window is focused',

						}

						return win.path || win.title;
					}).join(', ');
				})(),
				// The browser's close dialog cannot tell you *which* window, so this can.
				run: function () {

					if (dirty.length) {

					}

				subtitle: tabs.isOwner()

					: 'Another tab is saving the desktops and windows. Save from this one instead',
				run: function () { tabs.takeOver(); }
			},
			{
				title: 'Start clean session',
				subtitle: 'Forget the saved desktops and windows, then reload. No files are touched',
				run: function () { window.startCleanSession(); }

			{title: 'App Manager', subtitle: 'Install and update applications', run: function () { openApp('app-manager'); }},
			{

				subtitle: 'Rebuild the registry from the filesystem',
				run: function () {
					window.refreshInstalledAppsRegistry().catch(function (err) {

	// Cmd/Ctrl+K is the web's command-palette idiom and is unclaimed in Chrome; Ctrl+Space
	// is the second binding for anyone who prefers it, though macOS may take it for
	// switching input sources. The palette is reachable without either: the start menu's
	// search field and the desktop menu both lead to the same list.
	function isPaletteChord (e) {
		if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.code === 'KeyK') {
			return true;
		}
		return e.ctrlKey && !e.metaKey && !e.altKey && e.code === 'Space';
	}

	// The overview's chord. Two of them, for the same reason the palette has two: a chord
	// that turns out to be claimed by the OS is a feature nobody can reach, and this has
	// happened twice already in this project. Neither is the only route -- the taskbar
	// button and the palette command both open it.
	function isOverviewChord (e) {
		if ((e.metaKey || e.ctrlKey) && e.shiftKey && !e.altKey && e.code === 'KeyK') {
			return true;
		}
		return e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && e.code === 'Backquote';
	}

	function onShellHotkey (e) {
		if (isOverviewChord(e)) {
			e.preventDefault();
			e.stopPropagation();
			startMenu.close();
			palette.close();
			overview.toggle();
			return;
		}
		if (isPaletteChord(e)) {
			e.preventDefault();
			e.stopPropagation();
			startMenu.close();
			palette.toggle();
			return;
		}
		// Ctrl/Cmd+W. Only reachable at all while fullscreen *and* the keyboard lock was
		// granted -- otherwise the browser closed the tab before this ever ran, and
		// handling it here would be a lie in code. Checked rather than assumed, because
		// leaving fullscreen releases the lock without telling us in the keydown.
		if ((e.metaKey || e.ctrlKey) && !e.altKey && e.code === 'KeyW') {
			if (!fullscreen.isKeyboardLocked()) {
				return;
			}
			e.preventDefault();
			e.stopPropagation();
			var focused = winManager.getActiveWindow && winManager.getActiveWindow();
			var closeId = focused ? focused.id : null;
			if (closeId === null) {
				var open = winManager.listWindows(winManager.getActiveWorkspace());
				closeId = open.length ? open[open.length - 1].id : null;
			}
			if (closeId !== null) {
				winManager.closeWindow(closeId);
			}
			return;
		}
		// Ctrl+Shift+1..9 switches desktops. It was Ctrl+1..9, which is the browser's own
		// tab switching on Windows and Linux -- it only ever worked here because macOS
		// puts that on Cmd+1..9. If the OS claims this one too, the taskbar strip and the
		// palette's "Desktop: ..." entries still work.
		if (e.ctrlKey && e.shiftKey && !e.metaKey && !e.altKey && /^Digit[1-9]$/.test(e.code)) {
			var workspaces = winManager.listWorkspaces();
			var target = workspaces[Number(e.code.slice(5)) - 1];
			if (target) {
				e.preventDefault();
				e.stopPropagation();
				winManager.switchTo(target.id);
			}
		}
	}

	async function persistDesktopSettings (patch) {
		var settings = await readJsonFile('/settings/desktop.json', {});
		var next = Object.assign({}, settings, patch);
		// Applied in this tab either way -- the wallpaper you just picked should appear --
		// but only written by the tab that owns the session. See js/shell/tabs.js.
		if (tabs.isOwner()) {
			await writeFile('/settings/desktop.json', Buffer.from(JSON.stringify(next, null, 2)));
		}
		return next;
	}

	window.setWallpaper = function (config) {
		return desktop.setWallpaper(config);
	};

	window.setWallpaperImage = function (filePath, options) {
		return desktop.setWallpaperImage(filePath, options);
	};

	function normalizeExtension (ext) {
		return String(ext || '').trim().replace(/^\./, '').toLowerCase();
	}

	// Expand an extension into match candidates, most specific first:
	// 'fb2.zip' -> ['fb2.zip', 'zip'], 'txt' -> ['txt']. Compound extensions
	// let an app claim a compound type without hijacking the trailing one.
	function normalizeExtensionCandidates (ext) {
		var normalized = normalizeExtension(ext);
		if (!normalized) {
			return [];
		}
		var parts = normalized.split('.');
		if (parts.length < 2) {
			return [normalized];
		}
		return [normalized, parts[parts.length - 1]];
	}

	// Candidates for a path: 'book.fb2.zip' -> ['fb2.zip', 'zip'].
	// Dotfiles ('.bashrc') stay extension-less, as path.extname reports them.
	function getExtensionCandidates (filePath) {
		var single = normalizeExtension(window.path.extname(filePath || ''));
		if (!single) {
			return [];
		}
		var parts = window.path.basename(String(filePath || '')).split('.');
		if (parts.length > 2 && parts[0] !== '') {
			return normalizeExtensionCandidates(parts.slice(-2).join('.'));
		}
		return [single];
	}

	function normalizeMimeType (mimeType) {
		return String(mimeType || '').trim().toLowerCase();
	}

	function isInstalledApp (appId) {
		return (window.apps || []).some(function (entry) {
			return entry.id === appId;
		});
	}

	function getFileCompatibilityProfile (filePath) {
		return new Promise(async function (resolve) {
			var extensions = getExtensionCandidates(filePath);
			var head = await readFileHead(filePath, 4096);
			var mimeType = await detectMimeType(head);
			var fallbackProfile = getExtensionCompatibilityProfile(extensions[0]);
			resolve({
				extension: extensions[0] || '',
				extensions: extensions,
				mimeType: mimeType || fallbackProfile.mimeType || null,
				isText: detectTextBytes(head, fallbackProfile.isText)
			});
		});
	}

	function getExtensionCompatibilityProfile (ext) {
		var extensions = normalizeExtensionCandidates(ext);
		var mimeType = null;
		for (var i = 0; i < extensions.length && !mimeType; i++) {
			mimeType = guessMimeTypeFromExtension(extensions[i]);
		}
		return {
			extension: extensions[0] || '',
			extensions: extensions,
			mimeType: mimeType,
			isText: extensions.some(function (item) {
				return isLikelyTextExtension(item, mimeType);
			})
		};
	}

	async function isAppCompatibleWithProfile (appId, profile) {
		var app = getAppRecord(appId);
		if (!app || !profile) return false;
		// Profiles built elsewhere may carry only the single `extension`.
		var candidates = Array.isArray(profile.extensions) && profile.extensions.length
			? profile.extensions
			: normalizeExtensionCandidates(profile.extension);
		var supportedExtensions = candidates.length ? await ensureAppSupportedExtensions(appId) : (app.supportedExtensions || []);
		if (candidates.some(function (ext) { return supportedExtensions.indexOf(ext) > -1; })) {
			return true;
		}
		if (profile.mimeType && app.supportedMimeTypes.indexOf(profile.mimeType) > -1) {
			return true;
		}
		if (profile.isText && app.supportsText) {
			return true;
		}
		return false;
	}

	function notifyAppsRegistryChanged () {
		window.dispatchEvent(new CustomEvent('pixos:apps-registry-updated', {
			detail: {
				apps: (window.apps || []).map(function (entry) {
					return {
						id: entry.id,
						installed: entry.installed,
						supportedExtensions: Array.isArray(entry.supportedExtensions) ? entry.supportedExtensions.slice() : null,
						supportStatus: entry.supportStatus
					};
				})
			}
		}));
	}

	function readJsonFile (filePath, fallbackValue) {
		return new Promise(function (resolve) {
			fs.readFile(filePath, function (err, content) {
				if (err || !content) {
					resolve(fallbackValue);
					return;
				}
				try {
					resolve(JSON.parse(content.toString()));
				}
				catch (parseErr) {
					console.error(parseErr);
					resolve(fallbackValue);
				}
			});
		});
	}

	function readFileHead (filePath, size) {
		return new Promise(function (resolve) {
			fs.open(filePath, 'r', function (openErr, fd) {
				if (openErr || fd === undefined || fd === null) {
					resolve(new Uint8Array(0));
					return;
				}
				var buffer = Buffer.alloc(size);
				fs.read(fd, buffer, 0, size, 0, function (readErr, bytesRead) {
					fs.close(fd, function () {});
					if (readErr || !bytesRead) {
						resolve(new Uint8Array(0));
						return;
					}
					resolve(new Uint8Array(buffer.slice(0, bytesRead)));
				});
			});
		});
	}

	async function detectMimeType (bytes) {
		if (!bytes || !bytes.length || typeof window.fileTypeFromBuffer !== 'function') {
			return null;
		}
		try {
			var result = await window.fileTypeFromBuffer(bytes);
			return result && result.mime ? normalizeMimeType(result.mime) : null;
		}
		catch (err) {
			console.error(err);
			return null;
		}
	}

	function detectTextBytes (bytes, fallbackIsText) {
		if (!bytes || !bytes.length) {
			return true;
		}
		var nulBytes = 0;
		for (var i = 0; i < bytes.length; i++) {
			if (bytes[i] === 0) {
				nulBytes++;
			}
		}
		if (nulBytes > Math.max(1, Math.floor(bytes.length * 0.02))) {
			return false;
		}
		try {
			new TextDecoder('utf-8', {fatal: true}).decode(bytes);
			return true;
		}
		catch (err) {
			return !!fallbackIsText;
		}
	}

	function guessMimeTypeFromExtension (extension) {
		var map = {
			txt: 'text/plain',
			md: 'text/markdown',
			log: 'text/plain',
			csv: 'text/csv',
			html: 'text/html',
			htm: 'text/html',
			css: 'text/css',
			js: 'text/javascript',
			mjs: 'text/javascript',
			json: 'application/json',
			xml: 'application/xml',
			yml: 'application/yaml',
			yaml: 'application/yaml',
			svg: 'image/svg+xml'
		};
		return map[extension] || null;
	}

	function isLikelyTextExtension (extension, mimeType) {
		if (!extension && !mimeType) return false;
		if (mimeType && /^text\//.test(mimeType)) {
			return true;
		}
		return [
			'txt', 'md', 'log', 'csv', 'html', 'htm', 'css', 'js', 'mjs',
			'json', 'xml', 'yml', 'yaml', 'svg'
		].indexOf(extension) > -1;
	}

}

// --- somebody else's folder, mounted ------------------------------------------------------
//
// The point of a mount rather than a window with a file list in it: once it is a
// filesystem, Explorer, the palette, the apps and the service worker all reach it without
// being told about peers at all.

var peerMounts = {};

function peerMountPoint (peerId, name) {
	// Named after the peer, not the folder: two peers may share folders with the same
	// name, and the question you are answering when you look at /mnt is whose it is.
	return '/mnt/' + (name || 'peer') + ' (' + peerId.replace(/^pixos-/, '').slice(0, 6) + ')';
}

async function mountPeerFolder (peerId) {
	if (peerMounts[peerId]) {
		return peerMounts[peerId];
	}
	var label = await peers.mountRequest(peerId);
	var backend = peerFs.create({
		name: label,
		Stats: window.fs.Stats || BrowserFS.BFSRequire('fs').Stats,
		call: function (op, filePath) {
			return peers.fsCall(peerId, op, filePath);
		}
	});
	var point = peerMountPoint(peerId, label);
	await new Promise(function (resolve, reject) {
		window.mountManager.mountPeer(backend, point, label, function (err) {
			if (err) {
				reject(err);
			}
			else {
				resolve();
			}
		});
	});
	peerMounts[peerId] = point;
	notifications.notify({
		level: 'info',
		title: 'Mounted ' + label,
		message: 'It is at ' + point + ', read-only, for as long as they keep sharing it.',
		source: 'PixOS',
		actions: [{label: 'Open it', run: function () { openPath(point); }}]
	});
	return point;
}

function unmountPeer (peerId) {
	var point = peerMounts[peerId];
	if (!point) {
		return;
	}
	delete peerMounts[peerId];
	try {
		window.mountManager.umount(point);
	}
	catch (err) {
		// Already gone, which is the same outcome.
	}
	notifications.notify({
		level: 'info',
		title: 'That shared folder is gone',
		message: point + ' is no longer mounted — they stopped sharing it, or the '
			+ 'connection ended.',
		source: 'PixOS'
	});
}

// What an app may do with the peer session, and deliberately no more: see who is
// connected and hand one of them a file. Connecting, disconnecting and the identity itself
// are the shell's, because they are decisions about who may reach this machine and an app
// is not the place those get made. Explorer is the first caller.
window.peers = {
	list: function () {
		return peers.snapshot().links.filter(function (link) {
			return link.state === 'open';
		}).map(function (link) {
			return {id: link.id, name: link.name, ping: link.ping};
		});
	},
	sendFile: function (peerId, filePath) {
		return peers.sendFile(peerId, filePath);
	},
	open: function () {
		peersPanel.open();
	},
	// Sharing is a decision about this machine's files, so the *asking* is an app's and
	// the answering is not: Explorer offers the folder, the shell holds which one it is.
	share: function (filePath) {
		return peers.setShare(filePath);
	},
	getShare: function () {
		return peers.getShare();
	}
};

window.openPath = openPath;
window.openFile = openFile;
window.openFiles = openFiles;
window.openApp = openApp;
// Installs first if it has to. The widgets are the callers; see openCatalogApp.
window.openCatalogApp = openCatalogApp;
window.openUrl = openUrl;
window.openInBrowserTab = openInBrowserTab;
// The file as the window, with no app around it -- the old silent fallback, now only ever
// reached by asking for it.
window.openRawFile = function (filePath) {
	return launch({appId: null, paths: [filePath]});
};
// Explorer's *Open with...* is this dialog too, so the two cannot drift apart.

// Adding a bookmark from outside the Bookmarks app -- Explorer's context menu is the
// first caller, and it works whether or not Bookmarks is installed or open.
//
// Deliberately *not* behind the tab-ownership gate, unlike session.json and the recents.
// This is a document the user edits, not a record of how this tab is arranged, and the
// Bookmarks app itself writes it from any tab. A follower keeps full access to files.
window.addBookmark = async function (entry) {
	var doc;
	try {
		doc = await readBookmarksDocument();
	}
	catch (err) {
		// Never write over a file we could not read. A bookmarks document that fails to
		// parse is a file with something in it, and replacing it with a fresh one holding
		// a single link would be the worst possible response to a typo.
		notifications.notify({
			level: 'error',
			title: 'Could not add the bookmark',
			message: 'Your bookmarks file (/settings/links.json) could not be read, so '
				+ 'nothing was changed. Open it in an editor to see what is wrong with it.',
			source: 'PixOS'
		});
		return null;
	}

	var result = bookmarks.addTo(doc, entry);
	if (!result.ok) {
		notifications.notify({
			level: 'warn',
			title: 'That is not an address PixOS can bookmark',
			message: 'A bookmark has to be a web address or a path inside PixOS.',
			source: 'PixOS'
		});
		return null;
	}
	if (result.duplicate) {
		notifications.notify({
			level: 'info',
			title: 'Already bookmarked',
			message: '"' + result.link.title + '" is already in ' + (result.group.name || 'your bookmarks') + '.',
			source: 'PixOS'
		});
		return result.link;
	}

	try {

			level: 'error',
			title: failed.title,
			message: failed.message,
			source: 'PixOS'

	}
	notifications.notify({
		level: 'info',
		title: 'Added to bookmarks',
		message: '"' + result.link.title + '" is in ' + result.group.name + '.',
		actions: [{
			label: 'Open Bookmarks',

			// will not see this; opening one now is what shows the change.
			run: function () {

// Missing is not a failure -- the first bookmark added from Explorer creates the file.
// Anything else is, and is passed on rather than flattened into an empty document.
function readBookmarksDocument () {
	return new Promise(function (resolve, reject) {
		window.fs.readFile('/settings/links.json', function (err, content) {
			if (err) {
				if (err.code === 'ENOENT') {
					resolve(null);
					return;
				}
				reject(err);
				return;
			}

window.listLaunchableApps = listLaunchableApps;

// Explorer and App Manager are preloaded before the registry exists, so the launcher

var SYSTEM_APPS = {
	explorer: {name: 'Explorer', entryPath: '/apps/explorer/index.html', icon: '/apps/explorer/favicon.svg'},
	'app-manager': {name: 'App Manager', entryPath: '/apps/app-manager/index.html', icon: '/apps/app-manager/favicon.svg'}
};

// Per-app launch quirks live in this table rather than as branches inside openFile().
// Each entry may provide:
//   url(descriptor, entryPath)         the iframe src, defaulting to the entry path
//   iframeAttrs                        extra attributes on the iframe element
//   multi                              app takes several files in one window
//   prepare(descriptor)                runs before the window opens; result goes to deliver
//   deliver(frame, descriptor, ready)  runs on iframe load, instead of the default
//                                      contentWindow.openFile(path, name)
// Not an app: the launcher for a window whose content is a web page rather than a file.
// `launch({url})` selects it, and it is the one launcher whose src is used verbatim
// instead of being resolved under /__browserfs__.
//
// Most interesting sites refuse to be framed, and there is no way to find out from here
// -- a blocked frame still fires `load`, and its document is cross-origin -- so instead
// of guessing, the window says up front where the escape hatch is.
//
// `credentialless` is not optional. sw.js stamps Cross-Origin-Embedder-Policy on every
// response, and COEP is inherited by nested frames: without it *every* cross-origin site
// is blocked before it loads, whether or not it would have allowed being framed. The
// attribute is the per-frame exemption, and it is why apps/photopea works. Its cost is
// that the frame gets no cookies -- a site you are signed in to renders signed out.
var WEB_VIEW = {
	content: function (frameId, src, descriptor) {
		return '<div class="PixWebView">'
			+ '<div class="PixWebView__bar">'
			+ '<span class="PixWebView__url"></span>'
			+ '<button data-action="tab">Open in a browser tab</button>'
			+ '</div>'
			+ '<iframe id="' + frameId + '" credentialless src="' + escapeAttribute(src) + '"></iframe>'
			+ '</div>';
	},
	decorate: function (frame, descriptor) {
		var element = frame.parentElement;
		var label = element.querySelector('.PixWebView__url');
		if (label) {
			label.textContent = descriptor.url;
			label.title = descriptor.url;
		}
		var button = element.querySelector('[data-action="tab"]');

			button.addEventListener('click', function () {

	},
	deliver: function () {}

// Only http(s) ever becomes a window: openUrl is reachable from any app in an iframe,
// and a javascript: or data: src would run in the shell's own origin.
function toWebViewUrl (raw) {
	var text = String(raw == null ? '' : raw).trim();
	if (!/^https?:\/\//i.test(text)) {

var APP_LAUNCHERS = {
	explorer: {

		// parent's load handler could hand it one -- so it has to be in the URL.
		url: function (descriptor, entryPath) {
			return descriptor.paths[0]
				? entryPath + '?cwd=' + encodeURIComponent(descriptor.paths[0])
				: entryPath;
		},
		deliver: function () {}
	},
	filmoskop: {
		// The only app that presents. Without this attribute requestFullscreen() inside
		// the iframe is refused outright, and *Present* would be a button that claims it
		// went fullscreen and did not.

		// empty one here — as explorer does, because it reads ?cwd instead — would mean
		// the deck never arrives.

	treemap: {

	transcriber: {

		deliver: function () {}
	},
	tic80: {

		prepare: async function (descriptor) {
			if (!descriptor.paths[0]) {

// Every window in the system is opened through here, including windows with no file at
// all. The descriptor is also what a session restore will replay, so anything a window
// needs in order to come back has to be expressible in it.
// `restore` is only passed by session.js: it pins the window's id and desktop and says
// the placeholder is already in the layout about to be rebuilt around it.
async function launch (descriptor, restore) {
	descriptor = Object.assign({paths: []}, descriptor);
	descriptor.paths = (descriptor.paths || []).filter(Boolean);

	// A url descriptor is a web page in a window, and takes precedence over everything
	// else: there is no app and no file, so none of the resolution below applies.
	descriptor.url = descriptor.url ? toWebViewUrl(descriptor.url) : null;
	var external = !!descriptor.url;

	var appId = external ? null : (descriptor.appId || null);
	var launcher = external ? WEB_VIEW : ((appId && APP_LAUNCHERS[appId]) || {});
	// Without an app the path is the window: that is how Explorer opens a bare html file.
	var entryPath = external ? descriptor.url : (appId ? getAppEntryPath(appId) : descriptor.paths[0]);

	if (appId && !entryPath) {
		throw new Error('App ' + appId + ' has no launch path');
	}
	if (!entryPath) {
		throw new Error('launch() needs an app, a path or a url');
	}

	// A failed prepare must not swallow the whole launch: an app that opens empty is at
	// least visible and closable, whereas a rejected launch looks like a dead click.
	var prepared = null;
	if (launcher.prepare) {
		try {
			prepared = await launcher.prepare(descriptor);
		}
		catch (err) {
			console.error('Preparing ' + appId + ' for ' + descriptor.paths[0] + ' failed', err);
		}
	}
	var url = launcher.url ? launcher.url(descriptor, entryPath) : entryPath;

	// palette, a bookmark, a widget -- rather than in each of them, so a route added later
	// feeds the list without being told to. A restore is not an opening: replaying the
	// last session would otherwise rewrite the list into itself on every boot.
	if (!restore) {
		noteRecentPaths(descriptor.paths);
	}

	var frameId = 'view' + window.viewCounter;
	var attributes = launcher.iframeAttrs ? ' ' + launcher.iframeAttrs : '';

		appId: appId,

	// cannot see it and the user has no idea what happened. Said plainly instead, once, at
	// the moment it stops being able to work.

				level: 'error',
				title: (getAppName(appId) || appId) + ' could not open the file',
				message: (navigator.onLine === false && appNeedsNetwork(appId))
					? 'It loads part of itself from the internet, and you are offline, so it '
						+ 'never finished starting. The window is open but empty.'
					: 'The app did not finish loading, so there was nothing to hand the file '
						+ 'to. Its own errors are in the browser console.',
				source: 'PixOS'

		}

// The App API: the shell hands the app a /__browserfs__ path plus the real basename,

function deliverFile (frame, descriptor) {

		return;

	frame.contentWindow.openFile('/__browserfs__' + descriptor.paths[0], window.path.basename(descriptor.paths[0]));

function defaultWindowTitle (descriptor) {
	if (descriptor.url) {
		return descriptor.url.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[/?#]/)[0];
	}
	if (descriptor.paths.length > 1) {
		return descriptor.paths.length + ' files';
	}
	if (descriptor.paths[0]) {
		return descriptor.paths[0];
	}
	return getAppName(descriptor.appId) || 'PixOS';
}

// Recording what was opened, for the launchers that offer it back. A directory reaches
// launch() in exactly the same field as a file -- Explorer opens a folder as its path --
// so which one it was is stored rather than guessed at click time, and corrected from the
// filesystem when the entry is actually opened.

	(paths || []).forEach(function (filePath) {

			return;

			});
		});

// Opening from a recent list, which is the one place a path is expected to have gone

// there and whether it is a folder, so a file that has become a directory -- or a stored
// flag that was wrong -- still opens correctly.

			if (err) {

				// every time a menu opens would cost more than being wrong once.

					window.notify({
						level: 'warn',
						title: 'That file is no longer there',
						message: target.path + ' could not be opened, so it has been removed from '
							+ 'Recent files.',

			}

// another desktop needs that desktop brought forward first, and any of these routes stays
// reachable during a peek -- so both steps live here rather than in each caller, where
// forgetting one reads as a dead click.
function revealWindow (id) {
	var win = winManager.getWindow(id);
	desktop.setPeek(false);
	if (win && win.workspace && win.workspace !== winManager.getActiveWorkspace()) {
		winManager.switchTo(win.workspace);
	}
	winManager.focusWindow(id);

	// Recorded here rather than in each launcher, so every route -- menu, start panel,
	// palette, Explorer -- feeds the same recents list.
	appsModel.noteLaunch(appId);
	return launch({appId: appId});

// Opening an app that may not be on disk yet. The desktop widgets are the callers: a
// widget is a shortcut to somewhere, and a shortcut whose destination happens to be an
// uninstalled catalog app must not be the difference between a door and a dead end --
// `launch` would throw "app treemap has no launch path" and the click would look dead.
//
// Installing is the same step the *Open with...* chooser takes when you pick an app it
// has marked as not installed yet, and for the same reason: it is what the person asking
// meant. It is not silent -- App Manager lists what it installed, and the app opens in
// front of you.

	var installed = (window.apps || []).some(function (app) {
		return app && app.id === appId;
	});
	if (!installed) {
		if (typeof window.installAppById !== 'function') {
			throw new Error('There is no way to install ' + appId + ' from here');
		}
		await window.installAppById(appId);
	}
	if (paths && paths.length) {
		appsModel.noteLaunch(appId);
		return launch({appId: appId, paths: paths.slice()});
	}
	return openApp(appId);

// The extensions where "the path is the window" is the right answer rather than the worst
// one available. A page is already a window: this is how a local app's own index.html
// opens, and how App Manager is reached. Everything else with no default gets asked about
// instead of silently landing in the browser's default rendering of it.
var SELF_OPENING_EXTENSIONS = ['html', 'htm'];

async function openFile (filePath, appId) {
	if (!appId) {
		appId = await getDefaultAppForPath(filePath);
	}
	if (!appId && shouldAskHowToOpen(filePath)) {
		// A folder handed to openFile is Explorer's, not a question -- the chooser would
		// be offering to open a directory in a text editor. Callers that know say so by
		// calling openPath; a bookmark, an app's `parent.openFile` or a path typed into
		// the palette may not, and only the filesystem actually knows.
		if (await isDirectoryPath(filePath)) {
			return openPath(filePath);
		}
		return chooseHowToOpen(filePath);
	}
	return launch({appId: appId, paths: [filePath]});
}

function isDirectoryPath (filePath) {
	return new Promise(function (resolve) {
		window.fs.stat(filePath, function (err, stats) {
			resolve(!err && !!stats && stats.isDirectory());
		});
	});
}

function shouldAskHowToOpen (filePath) {
	// Without the extension machinery there is no way to tell a page from a spreadsheet,
	// and the old behaviour -- the path is the window -- is the safer of the two answers
	// to a question that cannot be asked.
	if (!filePath || typeof window.getExtensionCandidates !== 'function') {
		return false;
	}
	return !window.getExtensionCandidates(filePath).some(function (ext) {
		return SELF_OPENING_EXTENSIONS.indexOf(ext) !== -1;
	});
}

// Resolves with whatever the choice led to, or null if the dialog was cancelled -- a
// caller that awaits openFile() has to be able to tell "nothing opened" from "a window
// opened", and a promise that never settles would hang every one of them on an Esc.
async function chooseHowToOpen (filePath) {
	var picked = await openWithChooser({paths: [filePath]});
	if (!picked) {
		return null;
	}
	if (picked.kind === openWith.BROWSER_TAB) {
		return openInBrowserTab(filePath);
	}
	if (picked.kind === openWith.RAW_WINDOW) {
		return launch({appId: null, paths: [filePath]});
	}
	return launch({appId: picked.appId, paths: [filePath]});
