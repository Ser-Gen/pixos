// The one chooser in the system, for both routes into it: a file the shell has no default
// for, and Explorer's own *Open with...*. Explorer used to draw its own, which meant two
// dialogs that came up in nearly the same situation and looked nothing alike -- and only
// one of them knew about the browser tab. Explorer still decides what to *do* with the
// answer (it can navigate in place, and it can open several files at once); what it no
// longer decides is what the question looks like.
//
// Installing and remembering happen here, because they are the same in both cases and
// getting their order wrong is the same mistake in both.
// request: {paths, apps, extension, title, subtitle, universal, extras}
// Resolves with {kind, appId} or null.
async function openWithChooser (request) {
	var cfg = request || {};
	var paths = (cfg.paths || []).filter(Boolean);
	var extension = cfg.extension !== undefined
		? String(cfg.extension || '')
		: firstExtension(paths.length === 1 ? paths[0] : '');
	var apps = cfg.apps || await compatibleAppsForFile(paths[0]);

	var picked = await openWith.open({
		title: cfg.title || null,
		subtitle: cfg.subtitle || (paths.length === 1 ? paths[0] : paths.length + ' files'),
		extension: extension,
		universal: cfg.universal !== false,
		apps: apps,
		extras: cfg.extras || []
	});
	if (!picked) {
		return null;
	}
	var choice = picked.choice || {};
	if (choice.kind !== 'app') {
		return {kind: choice.kind, appId: null};
	}

	// Installing comes first, and not only because it takes longer: an association can
	// only name an installed app, so setting the default before the install would throw
	// and lose the preference the user just asked for.
	if (choice.install && typeof window.installAppById === 'function') {
		try {
			await window.installAppById(choice.appId);
		}
		catch (err) {
			var described = window.describeError('Could not install ' + (choice.label || choice.appId), err);
			notifications.notify({
				level: 'error',
				title: described.title,
				message: described.message + ' Nothing was opened.',
				source: 'PixOS'
			});
			return null;
		}
	}
	if (picked.setDefault && typeof window.setDefaultAppForExtension === 'function') {
		try {
			await window.setDefaultAppForExtension(extension, choice.appId);
		}
		catch (err) {
			// Remembering the choice failed; opening the file was still what was asked
			// for, so it happens anyway and only the preference is reported lost.
			notifications.notify({
				level: 'warn',
				title: 'Could not remember that choice',
				message: '.' + extension + ' files will keep asking. '
					+ window.describeError('', err).message,
				source: 'PixOS'
			});
		}
	}
	return {kind: 'app', appId: choice.appId};
}

function firstExtension (filePath) {
	if (!filePath || typeof window.getExtensionCandidates !== 'function') {
		return '';
	}
	return window.getExtensionCandidates(filePath)[0] || '';
}

// The same list Explorer's own *Open with...* builds, from the same shell functions --
// installed apps that can handle the file, then catalog apps that could once installed.
async function compatibleAppsForFile (filePath) {
	if (typeof window.getFileCompatibilityProfile !== 'function'
		|| typeof window.isAppCompatibleWithProfile !== 'function') {
		return [];
	}
	var profile = await window.getFileCompatibilityProfile(filePath);
	var found = [];
	var seen = {};
	var installed = window.apps || [];
	for (var i = 0; i < installed.length; i++) {
		if (await window.isAppCompatibleWithProfile(installed[i].id, profile)) {
			seen[installed[i].id] = true;
			found.push({
				id: installed[i].id,
				label: getAppName(installed[i].id) || installed[i].id,
				installed: true
			});
		}
	}
	var catalog = typeof window.getInstallableApps === 'function' ? window.getInstallableApps() : [];
	for (var j = 0; j < catalog.length; j++) {
		if (seen[catalog[j].id]) {
			continue;
		}
		if (!await window.isAppCompatibleWithProfile(catalog[j].id, profile)) {
			continue;
		}
		found.push({
			id: catalog[j].id,
			label: catalog[j].label || catalog[j].name || catalog[j].id,
			installed: false
		});
	}
	return found;
}

// The file handed to the browser itself, outside PixOS. It is served by the service
// worker like everything else, so a pdf or a video gets the viewer the browser already
// has and PixOS does not. Reachable from any app, since Explorer offers it too.
function openInBrowserTab (filePath) {
	var address = new URL('/__browserfs__' + filePath, location.href).href;
	var tab = window.open(address, '_blank');
	if (!tab) {
		notifications.notify({
			level: 'warn',
			title: 'The browser blocked that tab',
			message: 'Allow pop-ups for this site, or open the address yourself: ' + address,
			source: 'PixOS'
		});
	}
	return null;
}

async function openFiles (paths, appId) {
	if (!Array.isArray(paths) || !paths.length) {
		return;
	}
	if (paths.length === 1) {
		return openFile(paths[0], appId);
	}
	if (!appId) {
		appId = 'media-player';
	}
	if ((APP_LAUNCHERS[appId] || {}).multi) {
		return launch({appId: appId, paths: paths});
	}
	for (var i = 0; i < paths.length; i++) {
		await openFile(paths[i], appId);
	}
}

// A web page in a PixOS window. Reachable from any app through `parent.openUrl` --
// Bookmarks uses it for links flagged "open inside PixOS" -- so the url is validated in
// launch() rather than trusted here.
function openUrl (url, title) {
	return launch({url: url, title: title || null});
}

// 'new explorer' is what Explorer's own menu still calls this.
async function openPath (dirPath, appId) {
	if (!appId || appId === 'new explorer') {
		appId = 'explorer';
	}
	return launch({appId: appId, paths: dirPath ? [dirPath] : []});
}

function buildDesktopMenu () {
	var groups = appsModel.ordered();
	var submenu = [];

	// Recents on top, separated -- the same ordering the start menu uses.
	if (groups.recent.length) {
		submenu = submenu.concat(groups.recent.map(appMenuItem), [{separator: true}]);
	}
	submenu = submenu.concat(groups.rest.map(appMenuItem));

	if (!submenu.length) {
		submenu = [{label: 'No applications installed', disabled: true}];
	}

	var files = appsModel.listRecentFiles(8).map(function (entry) {
		return {
			label: (entry.path.split('/').pop() || entry.path) + (entry.dir ? '/' : ''),
			hint: entry.path.replace(/\/[^/]*$/, '') || '/',
			action: function () { openRecentFile(entry); }
		};
	});

	return [
		{label: 'Applications', submenu: submenu},
		{
			label: 'Recent files',
			submenu: files.length ? files : [{label: 'Nothing opened yet', disabled: true}]
		},
		{label: 'Search...', hint: 'Ctrl+K', action: function () { palette.open(); }},
		{label: 'All windows', hint: 'Ctrl+Shift+K', action: function () { overview.open(); }},
		{label: 'Peers...', action: function () { peersPanel.open(); }},
		{separator: true},
		{label: 'New Explorer', action: function () { openApp('explorer'); }},
		{label: 'App Manager', action: function () { openApp('app-manager'); }},
		{separator: true},
		{label: 'Wallpaper...', action: function () { desktop.openWallpaperPicker(); }},
		{
			label: desktop.isPeeking() ? 'Show windows' : 'Show desktop',
			action: function () { desktop.togglePeek(); }
		}
	];
}

function appMenuItem (app) {
	return {
		label: app.name,
		icon: app,
		action: function () {
			openApp(app.id);
		}
	};
}

// Only apps whose files are actually in BrowserFS: the catalog also lists apps that are
// merely installable, and launching one of those opens a window onto nothing.
function listLaunchableApps () {
	var installed = {};
	(window.apps || []).forEach(function (entry) {
		installed[entry.id] = true;
	});

	var apps = (typeof window.getInstallableApps === 'function' ? window.getInstallableApps() : [])
		.filter(function (app) {
			return installed[app.id];
		})
		.map(function (app) {
			// App Manager's records call it `label`; the manifest calls it `name`.
			return {id: app.id, name: app.name || app.label || app.id, icon: app.icon || null};
		});

	Object.keys(SYSTEM_APPS).forEach(function (id) {
		if (!apps.some(function (app) { return app.id === id; })) {
			apps.push({id: id, name: SYSTEM_APPS[id].name, icon: SYSTEM_APPS[id].icon || null});
		}
	});

	return apps.sort(function (a, b) {
		return a.name.localeCompare(b.name);
	});
}

// Same resolution order as getAppEntryPath: the catalog alone would miss local apps,
// which are folders the user created under /apps/ and never appear there.
// One record per app for anything that has to draw it: id, name and icon path.
function getLaunchableApp (appId) {
	if (!appId) {
		return null;
	}
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	if (app) {
		return {id: app.id, name: app.name || app.label || app.id, icon: app.icon || null};
	}
	return SYSTEM_APPS[appId]
		? {id: appId, name: SYSTEM_APPS[appId].name, icon: SYSTEM_APPS[appId].icon || null}
		: null;
}

function getAppName (appId) {
	if (!appId) {
		return null;
	}
	if (SYSTEM_APPS[appId]) {
		return SYSTEM_APPS[appId].name;
	}
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	return (app && (app.name || app.label)) || appId;
}

function buildBrowserFsAbsoluteUrl (fsPath) {
	var normalized = String(fsPath || '');
	if (!normalized.startsWith('/')) {
		normalized = '/' + normalized;
	}
	return new URL('/__browserfs__' + normalized, location.href).href;
}

function guessMediaPlayerMimeType (ext) {
	var map = {
		mp4: 'video/mp4',
		m4v: 'video/mp4',
		mov: 'video/quicktime',
		webm: 'video/webm',
		mkv: 'video/x-matroska',
		avi: 'video/x-msvideo',
		mpg: 'video/mpeg',
		mpeg: 'video/mpeg',
		m2ts: 'video/mp2t',
		ts: 'video/mp2t',
		mp3: 'audio/mpeg',
		m4a: 'audio/mp4',
		aac: 'audio/aac',
		wav: 'audio/wav',
		flac: 'audio/flac',
		ogg: 'audio/ogg',
		oga: 'audio/ogg',
		opus: 'audio/ogg',
		m3u8: 'application/vnd.apple.mpegurl',
		m3u: 'audio/x-mpegurl'
	};
	return map[ext] || null;
}

function buildMediaPlayerPlaylistEntry (fsPath) {
	var fileUrl = buildBrowserFsAbsoluteUrl(fsPath);
	var name = window.path.basename(fsPath);
	var ext = window.path.extname(fsPath).replace(/^\./, '').toLowerCase();
	var entry = {
		url: fileUrl,
		name: name
	};
	var mimeType = guessMediaPlayerMimeType(ext);
	if (mimeType) {
		entry.mimeType = mimeType;
	}
	return entry;
}

function buildMediaPlayerEntryPath (fsPaths, appEntryPath) {
	var paths = Array.isArray(fsPaths) ? fsPaths : [fsPaths];
	var playlist = encodeURIComponent(JSON.stringify(
		paths.map(buildMediaPlayerPlaylistEntry)
	));
	var base = appEntryPath || '/apps/media-player/index.html';
	return base + '?initPlaylist=' + playlist;
}

function buildTranscriberEntryPath (fsPath, appEntryPath) {
	var audioUrl = buildBrowserFsAbsoluteUrl(fsPath);
	var base = appEntryPath || '/apps/transcriber/index.html';
	return base + '?audio=' + encodeURIComponent(audioUrl);
}

function scheduleMediaPlayerAutoplay (iframe) {
	var attempts = 0;
	function tryPlay () {
		attempts++;
		var doc = iframe.contentDocument;
		if (!doc) {
			return;
		}
		var playBtn = doc.querySelector('[data-playlist-play]')
			|| doc.querySelector('#viewer-center-button');
		if (playBtn && !playBtn.disabled) {
			playBtn.click();
			return;
		}
		if (attempts < 40) {
			setTimeout(tryPlay, 150);
		}
	}
	setTimeout(tryPlay, 200);
}

async function getDefaultAppForPath (path) {
	if (typeof window.getExtensionCandidates !== 'function' || typeof window.getDefaultAppForExtension !== 'function') {
		return null;
	}
	// Most specific first, so a 'fb2.zip' association beats a plain 'zip' one.
	var candidates = window.getExtensionCandidates(path);
	var appId = null;
	for (var i = 0; i < candidates.length && !appId; i++) {
		appId = window.getDefaultAppForExtension(candidates[i]);
	}
	if (!appId) {
		return null;
	}
	if (typeof window.getFileCompatibilityProfile === 'function' && typeof window.isAppCompatibleWithProfile === 'function') {
		var profile = await window.getFileCompatibilityProfile(path);
		return await window.isAppCompatibleWithProfile(appId, profile) ? appId : null;
	}
	return appId;
}

// Either record saying so is enough, deliberately. The installed record is a partial,
// derived view built by hand field by field in js/app-registry.js, and this exact field
// has been dropped from one of those lists twice -- which is what kept the warning from
// ever appearing. The catalog record is the manifest itself. Reading only the installed
// one meant a field missing from a single enumeration silenced the whole feature; reading
// both means it takes two omissions, not one.
function appNeedsNetwork (appId) {
	var installed = (window.apps || []).find(function (entry) {
		return entry.id === appId;
	});
	if (installed && installed.needsNetwork) {
		return true;
	}
	var catalog = typeof window.getCatalogApp === 'function' ? window.getCatalogApp(appId) : null;
	return !!(catalog && catalog.needsNetwork);
}

function getAppEntryPath (appId) {
	var app = typeof window.getInstallableApps === 'function'
		? window.getInstallableApps().find(function (entry) { return entry.id === appId; })
		: null;
	if (!app && typeof window.getCatalogApp === 'function') {
		app = window.getCatalogApp(appId);
	}
	if (app && app.entryPath) {
		return app.entryPath;
	}
	return SYSTEM_APPS[appId] ? SYSTEM_APPS[appId].entryPath : null;
}

function blobToBase64(blob) {
  return new Promise((resolve, _) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

</script>
