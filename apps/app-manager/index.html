<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>App Manager</title>
	<style>
		body {
			margin: 0;
			padding: 16px;
			background: #333;
			color: #fff;
			font-family: sans-serif;
		}

		#items {
			display: grid;
			gap: 8px;
		}

		.AppCard {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 10px 12px;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.12);
		}

		.AppCard__meta {
			display: grid;
			gap: 4px;
		}

		.AppCard__name {
			font-size: 14px;
		}

		.AppCard__exts {
			font-size: 12px;
			color: rgba(255, 255, 255, 0.65);
		}

		button {
			height: 28px;
			padding: 0 10px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			background: #4b4b4b;
			color: #fff;
			cursor: pointer;
		}

		button:disabled {
			cursor: default;
			opacity: 0.6;
		}
	</style>
</head>
<body>
<div id="items"></div>
<script>
var itemsNode = document.querySelector('#items');

render();

async function render () {
	var catalog = typeof parent.getInstallableApps === 'function' ? parent.getInstallableApps() : [];
	var installedSet = new Set((parent.apps || []).map(function (entry) {
		return entry[0];
	}));

	itemsNode.innerHTML = catalog.map(function (app) {
		var isInstalled = installedSet.has(app.id);
		var exts = app.supportedExtensions && app.supportedExtensions.length ? app.supportedExtensions.join(', ') : 'no file associations';
		return `
			<div class="AppCard" data-app-id="${escapeHtml(app.id)}">
				<div class="AppCard__meta">
					<div class="AppCard__name">${escapeHtml(app.label)}</div>
					<div class="AppCard__exts">${escapeHtml(exts)}</div>
				</div>
				<button data-type="install"${isInstalled ? ' disabled' : ''}>${isInstalled ? 'installed' : 'install'}</button>
			</div>
		`;
	}).join('');
}

document.addEventListener('click', async function (e) {
	var button = e.target.closest('[data-type="install"]');
	if (!button || button.disabled) return;
	var card = button.closest('[data-app-id]');
	if (!card) return;

	button.disabled = true;
	button.textContent = 'installing...';

	try {
		await parent.installAppById(card.dataset.appId);
		await render();
	}
	catch (err) {
		console.error(err);
		button.disabled = false;
		button.textContent = 'install';
	}
});

function escapeHtml (value) {
	return String(value)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;')
		.replace(/'/g, '&#39;');
}
</script>
</body>
</html>
