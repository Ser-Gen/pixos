<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filmoskop — presenter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
	:root {
		--bg: #14171c;
		--panel: #1b1f26;
		--line: rgba(255, 255, 255, .1);
		--text: #e6e9ee;
		--muted: #939caa;
		--accent: #6fb3ff;
	}
	* { box-sizing: border-box; }

	/* #waiting is positioned over the whole window, and an author rule that sets `display`
	   beats the browser's [hidden] rule -- so `ui.waiting.hidden = true` left the overlay
	   sitting on top of the deck and this window looked permanently empty. */
	[hidden] { display: none !important; }
	html, body { height: 100%; margin: 0; }
	body {
		display: flex;
		flex-direction: column;
		background: var(--bg);
		color: var(--text);
		font: 15px/1.5 -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
		overflow: hidden;
	}

	#bar {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 10px 14px;
		background: var(--panel);
		border-bottom: 1px solid var(--line);
		flex: 0 0 auto;
	}
	#clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
	#elapsed {
		font-size: 30px;
		font-variant-numeric: tabular-nums;
		line-height: 1;
		margin-right: auto;
	}
	#elapsed.running { color: var(--accent); }
	button {
		font: inherit;
		font-size: 13px;
		padding: 6px 12px;
		color: var(--text);
		background: rgba(255, 255, 255, .07);
		border: 1px solid var(--line);
		border-radius: 3px;
		cursor: pointer;
	}
	button:hover { background: rgba(255, 255, 255, .14); }

	#body { flex: 1 1 auto; display: flex; min-height: 0; }
	#left { flex: 1 1 62%; display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 12px; }
	#right { flex: 1 1 38%; display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--line); }

	.label {
		font-size: 11px;
		text-transform: uppercase;
		letter-spacing: .08em;
		color: var(--muted);
		margin-bottom: 6px;
	}

	/* Each preview is a frame the deck's own size, carrying the deck's own stylesheet and
	   scaled down to fit — so what is in it is the slide, not an impression of it. The
	   frame is what makes that work: the slide sheet is written in vw/vh, and in a plain
	   div those would resolve against *this* window and size everything wrongly. A frame
	   has its own viewport. */
	.preview {
		position: relative;
		background: #333;
		border: 1px solid var(--line);
		border-radius: 4px;
		overflow: hidden;
		flex: 1 1 auto;
		min-height: 0;
	}
	.preview .inner {
		position: absolute;
		top: 0;
		left: 0;
		border: 0;
		transform-origin: top left;
	}
	#nextBox { flex: 0 0 34%; opacity: .75; }

	#notes {
		flex: 1 1 auto;
		overflow: auto;
		padding: 14px 16px;
		white-space: pre-wrap;
		font-size: 17px;
		line-height: 1.55;
	}
	#notes:empty::after {
		content: "No notes on this slide. Add them with a ::notes block — they never appear on the slide itself.";
		color: var(--muted);
		font-size: 14px;
		white-space: normal;
	}

	#list { flex: 0 0 auto; max-height: 34%; overflow: auto; border-top: 1px solid var(--line); }
	#list button {
		display: block;
		width: 100%;
		text-align: left;
		border: none;
		border-bottom: 1px solid var(--line);
		border-radius: 0;
		background: none;
		padding: 7px 14px;
		font-size: 13px;
		color: var(--muted);
	}
	#list button.at { background: rgba(111, 179, 255, .14); color: var(--text); }
	#list b { display: inline-block; width: 2.2em; color: var(--muted); font-weight: 400; }

	#waiting {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		text-align: center;
		padding: 2em;
		color: var(--muted);
		background: var(--bg);
		font-size: 14px;
	}
	/* No slide rules here on purpose: colours, layouts and code highlighting all arrive
	   with the deck's own stylesheet. A second copy in this file would be a second thing
	   to keep in step, and it is what made these previews look like a different deck. */
</style>
</head>
<body>

<div id="bar">
	<div id="elapsed">00:00</div>
	<button id="startStop">Start</button>
	<button id="reset">Reset</button>
	<button id="prev">← Previous</button>
	<button id="next">Next →</button>
	<div id="counter"></div>
	<div id="clock"></div>
</div>

<div id="body">
	<div id="left">
		<div style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
			<div class="label">On screen now</div>
			<div class="preview" id="currentBox"><iframe class="inner" id="current" title="The slide on screen now"></iframe></div>
		</div>
		<div style="display:flex;flex-direction:column;flex:0 0 34%;min-height:0">
			<div class="label">Next</div>
			<div class="preview" id="nextBox"><iframe class="inner" id="upcoming" title="The next slide"></iframe></div>
		</div>
	</div>
	<div id="right">
		<div class="label" style="padding:14px 16px 0">Notes</div>
		<div id="notes"></div>
		<div id="list"></div>
	</div>
</div>

<div id="waiting">Waiting for a deck.<br>Keep the Filmoskop window open — this view follows it.</div>

<script>
// The presenter view. A real browser window rather than a PixOS one, because the whole
// point of it is the *other screen*, and nothing inside a page can be dragged onto a
// second monitor.
//
// It talks to the deck over a BroadcastChannel rather than through `opener`: either window
// can be reloaded, or opened first, and they still find each other. The original wrote
// this whole page into an about:blank window with document.write and reached back through
// `opener` for everything — which broke the moment either side reloaded.

var channel = typeof BroadcastChannel === 'function'
	? new BroadcastChannel('pixos-filmoskop')
	: null;

// The deck window, if this one was opened from it. Same origin, so this is a plain object
// with functions on it — asking it directly is instant and cannot race, which is what the
// channel handshake was doing wrong. The channel stays for everything after the first
// answer, and for the case where this window was reloaded on its own.
function bridge () {
	try {
		return (window.opener && window.opener.filmoskopBridge) || null;
	}
	catch (err) {
		// A window from somewhere else entirely. Nothing to talk to.
		return null;
	}
}

var ui = {
	current: document.getElementById('current'),
	upcoming: document.getElementById('upcoming'),
	notes: document.getElementById('notes'),
	list: document.getElementById('list'),
	counter: document.getElementById('counter'),
	clock: document.getElementById('clock'),
	elapsed: document.getElementById('elapsed'),
	startStop: document.getElementById('startStop'),
	reset: document.getElementById('reset'),
	prev: document.getElementById('prev'),
	next: document.getElementById('next'),
	waiting: document.getElementById('waiting')
};

var deck = {slides: [], at: 0, title: '', style: '', width: 0, height: 0, theme: null};

if (channel) {
	channel.onmessage = onMessage;
}

function onMessage (e) {
	var message = e.data || {};
	if (message.type === 'deck') {
		deck.slides = message.slides || [];
		deck.title = message.title || '';
		deck.style = message.style || '';
		deck.width = message.width || 0;
		deck.height = message.height || 0;
		deck.theme = message.theme || null;
		document.title = (deck.title || 'Filmoskop') + ' — presenter';
		if (typeof message.at === 'number') {
			deck.at = message.at;
		}
		ui.waiting.hidden = deck.slides.length > 0;
		draw();
	}
	else if (message.type === 'at') {
		deck.at = Number(message.at) || 0;
		draw();
	}
}

// Ask the deck window straight out. If this window was opened from it — the ordinary case
// — the answer is here before anything has been painted.
function pull () {
	var direct = bridge();
	if (direct) {
		onMessage({data: direct.getDeck()});
		return true;
	}
	if (channel) {
		channel.postMessage({type: 'hello'});
	}
	return false;
}

if (!channel && !bridge()) {
	ui.waiting.textContent = 'This browser has no BroadcastChannel, and this window was not '
		+ 'opened from a deck, so there is nothing for it to follow.';
}
else if (!pull()) {
	// Reloaded on its own, or opened before the deck finished loading: keep asking, and
	// say so if nobody ever answers rather than sitting on "waiting" for ever.
	var tries = 0;
	var asking = setInterval(function () {
		tries++;
		if (deck.slides.length || tries > 20) {
			clearInterval(asking);
			if (!deck.slides.length) {
				ui.waiting.textContent = 'No deck answered. Is the Filmoskop window still '
					+ 'open? Press Speaker there again.';
			}
			return;
		}
		pull();
	}, 400);
}

function go (index) {
	var at = Math.max(0, Math.min(deck.slides.length - 1, index));
	if (at === deck.at) {
		return;
	}
	deck.at = at;
	draw();
	var direct = bridge();
	if (direct) {
		direct.go(at);
	}
	else if (channel) {
		channel.postMessage({type: 'go', at: at});
	}
}

// One preview frame, built once and then written into. Rebuilding the document on every
// slide would re-fetch every picture in it, which is a flicker in the one window where a
// flicker is expensive.
function slideDocument (frame) {
	var doc = frame.contentDocument;
	if (doc && doc.getElementById('deckStyle')) {
		return doc;
	}
	doc = frame.contentDocument;
	doc.open();
	doc.write('<!doctype html><meta charset="utf-8">'
		// No font family here on purpose: the deck's own stylesheet carries one, and a
		// second declaration is a second thing to keep in step.
		+ '<style>html,body{margin:0;height:100%;overflow:hidden;'
		+ 'background:var(--slide-bg,#333);color:var(--slide-fg,#fff);'
		+ 'font-size:14px;line-height:1.5}</style>'
		+ '<style id="deckStyle"></style>'
		+ '<section class="Slide"><div class="Slide__content"></div></section>');
	doc.close();
	return doc;
}

// The deck window resolved every picture to an absolute /__browserfs__ path before it sent
// the markup, so it loads here too — this frame has no useful base URL of its own.
function paint (frame, slide, fallback) {
	var doc = slideDocument(frame);
	var style = doc.getElementById('deckStyle');
	if (style.textContent !== deck.style) {
		style.textContent = deck.style;
	}
	if (deck.theme) {
		doc.documentElement.style.setProperty('--slide-bg', deck.theme.bg);
		doc.documentElement.style.setProperty('--slide-fg', deck.theme.fg);
	}
	var section = doc.querySelector('.Slide');
	// The layout classes travel with the slide. Without them a side-image slide was a
	// picture above its text here and beside it on the screen, which is the sort of
	// difference you notice at the worst possible moment.
	section.className = 'Slide ' + ((slide && slide.className) || '');
	// The markup came from the deck window, which built those nodes itself and dropped
	// anything that could run — see `create` in index.html.
	doc.querySelector('.Slide__content').innerHTML = slide ? slide.html
		: '<p style="opacity:.6">' + fallback + '</p>';
}

function draw () {
	var current = deck.slides[deck.at];
	var upcoming = deck.slides[deck.at + 1];

	paint(ui.current, current, 'No deck yet.');
	paint(ui.upcoming, upcoming, 'End of the deck.');
	ui.notes.textContent = current ? current.notes : '';
	ui.counter.textContent = deck.slides.length
		? (deck.at + 1) + ' / ' + deck.slides.length
		: '';

	ui.list.innerHTML = '';
	deck.slides.forEach(function (slide, index) {
		var button = document.createElement('button');
		button.className = index === deck.at ? 'at' : '';
		var number = document.createElement('b');
		number.textContent = String(index + 1);
		button.append(number, document.createTextNode(slide.title || ''));
		button.onclick = function () {
			go(index);
		};
		ui.list.append(button);
	});
	fit();
}

// The slide is laid out at the deck's own size and then scaled, not reflowed — what the
// room sees, only smaller. Reflowing it would be a different slide: text that fits there
// and wraps here is exactly the thing this window is supposed to warn you about.
function fit () {
	// Before a deck arrives there is nothing to scale to; 16:9 is the shape a projector
	// is, and it stops the boxes looking broken while it waits.
	var width = deck.width || 1280;
	var height = deck.height || 720;

	[[ui.current, document.getElementById('currentBox')],
		[ui.upcoming, document.getElementById('nextBox')]].forEach(function (pair) {
		var frame = pair[0];
		var box = pair[1];
		frame.style.width = width + 'px';
		frame.style.height = height + 'px';
		var scale = Math.min(box.clientWidth / width, box.clientHeight / height);
		// transform-origin is the top left corner, so the centring is done here rather
		// than by the box: a scaled element still takes its unscaled room in the layout.
		frame.style.transform = 'translate('
			+ ((box.clientWidth - width * scale) / 2) + 'px,'
			+ ((box.clientHeight - height * scale) / 2) + 'px) scale(' + scale + ')';
	});
}

window.addEventListener('resize', fit);

ui.prev.onclick = function () { go(deck.at - 1); };
ui.next.onclick = function () { go(deck.at + 1); };

window.addEventListener('keydown', function (e) {
	if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
		e.preventDefault();
		go(deck.at + 1);
	}
	else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
		e.preventDefault();
		go(deck.at - 1);
	}
	else if (e.key === 'Home') { e.preventDefault(); go(0); }
	else if (e.key === 'End') { e.preventDefault(); go(deck.slides.length - 1); }
});

// --- the clock and the timer ------------------------------------------------------------

var timer = {startedAt: null, accrued: 0};

function pad (value) {
	return String(value).padStart(2, '0');
}

function tick () {
	var now = new Date();
	ui.clock.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

	var ms = timer.accrued + (timer.startedAt ? now - timer.startedAt : 0);
	var total = Math.floor(ms / 1000);
	var hours = Math.floor(total / 3600);
	var minutes = Math.floor((total % 3600) / 60);
	var seconds = total % 60;
	ui.elapsed.textContent = (hours ? pad(hours) + ':' : '') + pad(minutes) + ':' + pad(seconds);
	ui.elapsed.classList.toggle('running', !!timer.startedAt);
	requestAnimationFrame(tick);
}

ui.startStop.onclick = function () {
	if (timer.startedAt) {
		timer.accrued += new Date() - timer.startedAt;
		timer.startedAt = null;
		ui.startStop.textContent = 'Start';
	}
	else {
		timer.startedAt = new Date();
		ui.startStop.textContent = 'Pause';
	}
};

ui.reset.onclick = function () {
	// Deliberately does not stop it: the usual reason to reset is that the talk has
	// actually just started, not that it is over.
	timer.accrued = 0;
	timer.startedAt = timer.startedAt ? new Date() : null;
};

tick();
draw();
</script>

</body>
</html>
