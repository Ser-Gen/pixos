<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body {
			margin: 0;
		}
		#container {
			width: 100vw;
			height: 100vh;
		}
		#saveass {
			position: fixed;
			top: 0;
			right: 10px;
			z-index: 1000;
		}
	</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js" integrity="sha512-oz/97HdPI510jvvYzVqE2tzz+jWpvUeVkK5OT0S2kPZOxuR+9cE8zT1V6UgwtRG71ThICBEtkPEzN5tfP/YeYw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<style type="text/css" media="screen">
	#editor { 
		position: absolute;
		top: 0;
		right: 0;
		bottom: 0;
		left: 0;
	}
</style>

<div id="editor"></div>
<button id="saveass">Save As..</button>

<script>
	var handler;
	var path;
	var name;
	var type;
	var editor = ace.edit("editor");
	editor.setTheme("ace/theme/github_dark");
	editor.session.setMode("ace/mode/markdown");
	editor.setOptions({
		useWrapMode: true,   // wrap text to view
		indentedSoftWrap: true,
		wrap: "free",
		wrapMethod: 'auto',
	});
function openFile (src, fileName) {
	path = src;
	name = fileName || name;

	fetch(path).then(r=>r.text()).then(text => {
		loading = true;
		editor.setValue(text);
		editor.clearSelection();
		loading = false;
		markClean();
	});
}

// The save contract.
//
// ace used to save on Ctrl+S and nowhere else, while monaco -- the other editor for the
// same files -- saved on every keystroke. Which of your edits survived closing the tab
// depended on which editor you happened to open, and nothing on screen said which one you
// were in. Both autosave now, and both report whether there is anything outstanding, so
// the window shows a dot and the browser only argues about closing when there is a reason.
//
// Ctrl+S still works and still means "now, not in a moment". It is not the only thing
// standing between you and losing an hour any more.
var SAVE_DELAY = 700;
var saveTimer = null;
var loading = false;

function markDirtyState (dirty) {
	if (typeof markDirty === 'function') {
		markDirty(dirty);
	}
}

function markClean () {
	markDirtyState(false);
}

function saveNow () {
	clearTimeout(saveTimer);
	saveTimer = null;
	if (handler) {
		Promise.resolve(parent.saveFile(handler, editor.getValue())).then(markClean, function () {});
		return;
	}
	if (!path) {
		return;
	}
	Promise.resolve(parent.saveFileLocal(path, editor.getValue(), name, type))
		.then(markClean, function () {
			// The shell raises the card; the dot staying put is what says it is still
			// unsaved, which is the whole point of reporting it.
		});
}

editor.on('change', function () {
	// setValue() while opening a file is not an edit.
	if (loading) {
		return;
	}
	markDirtyState(true);
	clearTimeout(saveTimer);
	saveTimer = setTimeout(saveNow, SAVE_DELAY);
});

addEventListener('keydown', function (e) {
	if (
		(
			e.ctrlKey
			|| e.metaKey
		)
		&& e.keyCode === 83
	) {
		e.preventDefault();
		saveNow();
	}
});

saveass.onclick = function () {
	var name = prompt('kek?', 'kek.txt');
	var a = document.createElement('a');
	document.body.append(a);
	a.href = URL.createObjectURL(blobToFile(textToBlob(editor.getValue()), name));
	a.download = name;
	a.click();
	setTimeout(() => {
		a.remove();
		URL.revokeObjectURL(a.href);
	}, 1000);
}


function blobToFile(theBlob, fileName){
	return new File([theBlob], fileName, {
		lastModified: new Date().getTime(),
		type: theBlob.type
	});
}
function textToBlob (text) {
	return new Blob([text], {
		type: "text/plain;charset=utf-8"
	});
}
</script>
<script>
</script>
</body>
</html>
