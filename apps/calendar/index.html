<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
	:root {
		--bg: #14171c;
		--panel: #1b1f26;
		--card: #212630;
		--line: rgba(255, 255, 255, .09);
		--text: #dfe3ea;
		--muted: #939caa;
		--faint: #5d6675;
		--accent: #6fb3ff;
		--today: #2b5f9e;
	}

	* { box-sizing: border-box; }

	/* #year sets a `display`, and an author rule that does beats the browser's own
	   [hidden] rule -- cascade origin is decided before specificity -- so switching back
	   to the month view left the twelve mini months on screen underneath it. */
	[hidden] { display: none !important; }

	html, body { height: 100%; margin: 0; }

	body {
		display: flex;
		flex-direction: column;
		background: var(--bg);
		color: var(--text);
		font: 14px/1.5 -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
	}

	#bar {
		display: flex;
		align-items: center;
		gap: 8px;
		flex: 0 0 auto;
		padding: 9px 14px;
		border-bottom: 1px solid var(--line);
		background: var(--panel);
	}

	#title {
		font-size: 15px;
		font-weight: 600;
		margin-right: auto;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	button {
		font: inherit;
		font-size: 12px;
		padding: 5px 10px;
		color: var(--text);
		background: rgba(255, 255, 255, .06);
		border: 1px solid var(--line);
		border-radius: 3px;
		cursor: pointer;
		white-space: nowrap;
	}

	button:hover { background: rgba(255, 255, 255, .12); }
	button[aria-pressed="true"] { background: var(--today); border-color: #3476c4; }
	button.step { padding: 5px 9px; font-size: 13px; line-height: 1; }

	#views { flex: 1 1 auto; overflow: auto; padding: 14px; }

	/* --- month ------------------------------------------------------------------- */

	table.month {
		width: 100%;
		border-collapse: collapse;
		table-layout: fixed;
	}

	table.month th {
		padding: 4px 6px 9px;
		font-size: 11px;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: .07em;
		color: var(--muted);
		text-align: left;
	}

	table.month th.wk, table.month td.wk {
		width: 34px;
		color: var(--faint);
		font-size: 11px;
		text-align: right;
		padding-right: 10px;
		font-variant-numeric: tabular-nums;
	}

	table.month td {
		height: 74px;
		padding: 6px 8px;
		vertical-align: top;
		border: 1px solid var(--line);
		background: var(--card);
		font-variant-numeric: tabular-nums;
	}

	table.month td.out { background: rgba(33, 38, 48, .35); color: var(--faint); }
	table.month td.weekend .n { color: #c9a3a3; }
	table.month td.out.weekend .n { color: var(--faint); }
	table.month td.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
	table.month td.today .n { color: var(--accent); font-weight: 700; }
	table.month .n { font-size: 17px; }

	/* --- year -------------------------------------------------------------------- */

	/* Twelve months want to read as a year, which means whole rows: 4x3, then 3x4, 2x6 and
	   1x12 as the window narrows. `auto-fill` was giving whatever fitted -- five columns,
	   then seven -- and a year in rows of five is not a year, it is a list. The widths are
	   where a mini month stops being legible at each count, not round numbers. */
	#year {
		display: grid;
		grid-template-columns: repeat(4, minmax(0, 1fr));
		gap: 14px;
	}

	@media (max-width: 700px) { #year { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
	@media (max-width: 520px) { #year { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
	@media (max-width: 350px) { #year { grid-template-columns: minmax(0, 1fr); } }

	.mini {
		padding: 10px 11px 12px;
		background: var(--card);
		border: 1px solid var(--line);
		border-radius: 3px;
		cursor: pointer;
	}

	.mini:hover { border-color: rgba(255, 255, 255, .22); }
	.mini h3 {
		margin: 0 0 7px;
		font-size: 12px;
		font-weight: 600;
		letter-spacing: .04em;
		text-transform: uppercase;
		color: var(--muted);
	}

	/* The cells have to give way before the grid does, or a narrow four-column year is
	   twelve tables overflowing their boxes rather than twelve small months. */
	.mini table { width: 100%; border-collapse: collapse; table-layout: fixed; }
	.mini td, .mini th {
		padding: 2px 0;
		text-align: center;
		font-size: clamp(9px, 1.5vw, 11px);
		font-variant-numeric: tabular-nums;
	}
	.mini th { color: var(--faint); font-weight: 400; }
	.mini td.out { color: var(--faint); opacity: .45; }
	.mini td.today { background: var(--today); color: #fff; border-radius: 2px; }

	/* --- foot -------------------------------------------------------------------- */

	#foot {
		flex: 0 0 auto;
		padding: 10px 14px 12px;
		border-top: 1px solid var(--line);
		background: var(--panel);
		font-size: 12px;
		color: var(--muted);
	}

	#progressRow { display: flex; align-items: baseline; gap: 10px; }
	#progressText { white-space: nowrap; }

	#progress {
		position: relative;
		flex: 1 1 auto;
		height: 6px;
		min-width: 60px;
		background: rgba(255, 255, 255, .12);
		overflow: hidden;
	}

	#progressFill {
		position: absolute;
		inset: 0 auto 0 0;
		width: 0;
		background: var(--accent);
	}

	#note { margin-top: 8px; font-size: 11px; color: var(--faint); }
	kbd {
		font: inherit;
		font-size: 10px;
		padding: 1px 5px;
		border: 1px solid var(--line);
		border-radius: 3px;
		color: var(--muted);
	}
</style>
</head>
<body>

<div id="bar">
	<div id="title">Calendar</div>
	<button class="step" id="prev" title="Previous (Left arrow)">&#8249;</button>
	<button id="today" title="Today (T)">Today</button>
	<button class="step" id="next" title="Next (Right arrow)">&#8250;</button>
	<button id="monthView" aria-pressed="true" title="Month (M)">Month</button>
	<button id="yearView" aria-pressed="false" title="Year (Y)">Year</button>
</div>

<div id="views">
	<div id="month"></div>
	<div id="year" hidden></div>
</div>

<div id="foot">
	<div id="progressRow">
		<span id="progressText"></span>
		<span id="progress"><span id="progressFill"></span></span>
	</div>
	<div id="note"></div>
</div>

<script type="module">
import * as cal from './js/calendar.js';

// Read-only, and that is a decision rather than a gap: events mean storage, recurrence,
// time zones and reminders, which is a project rather than a widget target. It is written
// down in docs/backlog.md, and said in the app so nobody goes looking for the Add button.

var ui = {
	title: document.getElementById('title'),
	prev: document.getElementById('prev'),
	next: document.getElementById('next'),
	today: document.getElementById('today'),
	monthView: document.getElementById('monthView'),
	yearView: document.getElementById('yearView'),
	month: document.getElementById('month'),
	year: document.getElementById('year'),
	progressText: document.getElementById('progressText'),
	progressFill: document.getElementById('progressFill'),
	note: document.getElementById('note')
};

var locale = navigator.language || 'en';
var weekStart = cal.firstDayOfWeek(locale);
var now = new Date();
var state = {view: 'month', year: now.getFullYear(), month: now.getMonth()};

function today () {
	return new Date();
}

// The one thing in this app that ticks. A calendar left open overnight would otherwise
// keep the ring around yesterday and go on saying "day 241 of 365" -- and midnight is
// exactly when nobody is watching it closely enough to doubt it. A minute is fine: this
// redraws nothing unless the date itself changed.
var drawnDay = null;

setInterval(function () {
	if (drawnDay !== null && drawnDay !== cal.toISO(today())) {
		draw();
	}
}, 60000);

function draw () {
	drawnDay = cal.toISO(today());
	var isMonth = state.view === 'month';
	ui.month.hidden = !isMonth;
	ui.year.hidden = isMonth;
	ui.monthView.setAttribute('aria-pressed', String(isMonth));
	ui.yearView.setAttribute('aria-pressed', String(!isMonth));
	ui.title.textContent = isMonth
		? cal.monthLabel(state.year, state.month, locale)
		: String(state.year);

	if (isMonth) {
		drawMonth();
	}
	else {
		drawYear();
	}
	drawProgress();
}

function drawMonth () {
	var grid = cal.monthGrid(state.year, state.month, {weekStart: weekStart, today: today()});
	var names = cal.weekdayNames(locale, weekStart);

	var table = document.createElement('table');
	table.className = 'month';

	var head = document.createElement('tr');
	head.append(th('', 'wk'));
	names.forEach(function (name) {
		head.append(th(name));
	});
	table.append(head);

	grid.weeks.forEach(function (week) {
		var row = document.createElement('tr');
		var weekCell = document.createElement('td');
		weekCell.className = 'wk';
		weekCell.textContent = week.week;
		weekCell.title = 'ISO week ' + week.week;
		row.append(weekCell);

		week.days.forEach(function (day) {
			var cell = document.createElement('td');
			cell.className = (day.inMonth ? '' : 'out ')
				+ (day.weekend ? 'weekend ' : '')
				+ (day.today ? 'today' : '');
			var number = document.createElement('div');
			number.className = 'n';
			number.textContent = day.day;
			cell.append(number);
			cell.title = day.iso;
			row.append(cell);
		});
		table.append(row);
	});

	ui.month.innerHTML = '';
	ui.month.append(table);
}

function th (text, className) {
	var node = document.createElement('th');
	node.textContent = text;
	if (className) {
		node.className = className;
	}
	return node;
}

function drawYear () {
	var stamp = today();
	ui.year.innerHTML = '';
	for (var month = 0; month < 12; month++) {
		ui.year.append(miniMonth(month, stamp));
	}
}

function miniMonth (month, stamp) {
	var grid = cal.monthGrid(state.year, month, {weekStart: weekStart, today: stamp});
	var box = document.createElement('div');
	box.className = 'mini';
	box.title = 'Open ' + cal.monthName(month, locale);

	var heading = document.createElement('h3');
	heading.textContent = cal.monthName(month, locale);
	box.append(heading);

	var table = document.createElement('table');
	var head = document.createElement('tr');
	cal.weekdayNames(locale, weekStart, 'narrow').forEach(function (name) {
		head.append(th(name));
	});
	table.append(head);

	grid.weeks.forEach(function (week) {
		var row = document.createElement('tr');
		week.days.forEach(function (day) {
			var cell = document.createElement('td');
			cell.className = (day.inMonth ? '' : 'out ') + (day.today ? 'today' : '');
			cell.textContent = day.day;
			row.append(cell);
		});
		table.append(row);
	});
	box.append(table);

	// The year view is a way into a month, not a picture of one -- twelve dead ends
	// would be the same mistake the widgets made.
	box.onclick = function () {
		state.month = month;
		state.view = 'month';
		draw();
	};
	return box;
}

function drawProgress () {
	var progress = cal.yearProgress(today());
	var percent = Math.round(progress.ratio * 100);
	ui.progressText.textContent = 'Day ' + progress.day + ' of ' + progress.days
		+ ' · ' + percent + '% of ' + progress.year
		+ (progress.remaining ? ' · ' + progress.remaining + ' days left' : ' · last day');
	ui.progressFill.style.width = percent + '%';

	var zone = '';
	try {
		zone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
	}
	catch (err) {
		// Nothing to say about the time zone is better than a wrong one.
	}
	ui.note.innerHTML = '';
	ui.note.append(document.createTextNode(
		'Read-only — no events. Weeks start on ' + cal.weekdayNames(locale, weekStart)[0]
		+ (progress.leap ? ', ' + progress.year + ' is a leap year' : '')
		+ (zone ? ', ' + zone : '') + '. '));
	['←', '→', 'T', 'M', 'Y'].forEach(function (label, index) {
		var key = document.createElement('kbd');
		key.textContent = label;
		ui.note.append(key, document.createTextNode(index === 4 ? '' : ' '));
	});
}

function step (delta) {
	if (state.view === 'year') {
		state.year += delta;
	}
	else {
		var next = cal.addMonths(state.year, state.month, delta);
		state.year = next.year;
		state.month = next.month;
	}
	draw();
}

function goToday () {
	var stamp = today();
	state.year = stamp.getFullYear();
	state.month = stamp.getMonth();
	draw();
}

ui.prev.onclick = function () { step(-1); };
ui.next.onclick = function () { step(1); };
ui.today.onclick = goToday;
ui.monthView.onclick = function () { state.view = 'month'; draw(); };
ui.yearView.onclick = function () { state.view = 'year'; draw(); };

// Plain letters, not chords: every chord worth having is the shell's, and an app that
// takes one takes it away from the whole system. Nothing here has a text field to type
// into, so a bare key cannot be swallowed by one.
window.addEventListener('keydown', function (e) {
	if (e.ctrlKey || e.metaKey || e.altKey) {
		return;
	}
	var handled = true;
	if (e.key === 'ArrowLeft' || e.key === 'PageUp') { step(-1); }
	else if (e.key === 'ArrowRight' || e.key === 'PageDown') { step(1); }
	else if (e.key === 'ArrowUp') { state.year -= 1; draw(); }
	else if (e.key === 'ArrowDown') { state.year += 1; draw(); }
	else if (e.key === 't' || e.key === 'T') { goToday(); }
	else if (e.key === 'm' || e.key === 'M') { state.view = 'month'; draw(); }
	else if (e.key === 'y' || e.key === 'Y') { state.view = 'year'; draw(); }
	else { handled = false; }
	if (handled) {
		e.preventDefault();
	}
});

// The shell hands an app a file; there is no file this app can be handed. Declared anyway
// so opening one *with* the calendar does nothing rather than throwing inside the iframe
// where the shell cannot see it.
window.openFile = function () {};

draw();
</script>

</body>
</html>
