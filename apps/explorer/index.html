<!DOCTYPE html>

	<script>
		(function () {
			var FILES3_CONFIG_KEY = 'pixos_files3_config';
			var token = new URLSearchParams(location.search).get('token');
			if (!token) return;

			function resolveFiles3LocalStorageId () {
				var lsId = 'files3_token_storage';
				try {
					var raw = localStorage.getItem(FILES3_CONFIG_KEY);
					if (!raw) return lsId;
					var cfg = JSON.parse(raw);
					if (cfg && cfg.localStorageId) {
						return cfg.localStorageId;
					}
					if (cfg && cfg.baseUrl) {
						return 'files3_token_' + (new URL(cfg.baseUrl).hostname || 'storage');
					}
				} catch (e) { /* ignore */ }
				return lsId;
			}

			try {
				localStorage.setItem(resolveFiles3LocalStorageId(), token);
			} catch (e) { /* ignore */ }

			try {
				history.replaceState(null, '', location.pathname + location.hash);
			} catch (e) { /* ignore */ }

			if (window.opener) {
				try {
					window.opener.postMessage({ type: 'files3-token', token: token }, location.origin);
				} catch (e) { /* ignore */ }
				window.close();
			}
		})();
	</script>

		+ '<div style="max-width:520px;margin:14vh auto;padding:0 24px;'

async function openExplorer () {

		normalizePath: normalizePath,
		readFile: readFile,

			return;

		refreshCurrentDir(true);

				catch (err) {
					var kind = err && err.failure ? err.failure.kind : '';
					if (kind === 'password' || kind === 'password-needed') {
						locked.push(targets[i].name);
					}
					else {
						failed.push(targets[i].name + ' — '
							+ (err && err.failure ? err.failure.title : (err && err.message) || 'failed'));
					}
				}
			}
			await refreshCurrentDir(false);

			var lines = [];
			if (done.length) {
				lines.push(done.length + ' extracted.');
			}
			if (locked.length) {
				lines.push(locked.length + ' need a password: ' + locked.join(', ')
					+ '. Extract those one at a time — the dialog asks.');
			}
			if (failed.length) {
				lines.push(failed.join('; ') + '.');
			}
			report(done.length ? 'Extracted ' + done.length + ' of ' + targets.length
				: 'Nothing was extracted', lines.join(' '),
				(locked.length || failed.length) ? 'warn' : 'info');
		},

		ffmpeg: async function () {
			var defaultArgs = '-c:v libx264 -movflags faststart -crf 30 -preset superfast';
			openDialog({
				type: 'ffmpegOptions',
				defaultArgs: defaultArgs,
				onSubmit: async function (argsRaw) {
					state.dialog = null;
					renderOverlays();
					if (!await ensureFfmpegLoaded()) return;

					var targets = getSelectedItems().filter(function (item) { return !item.isDirectory; });
					var args = splitCommandLine(argsRaw || defaultArgs);

					for (var i = 0; i < targets.length; i++) {
						var src = targets[i];
						var file = await readFile(src.path);
						await window.ffmpeg.writeFile('input', new Uint8Array(file.buffer));
						await window.ffmpeg.exec(['-i', 'input'].concat(args, ['output.mp4']));
						var out = await window.ffmpeg.readFile('output.mp4');
						var fileType = await window.fileTypeFromBuffer(out);
						var name = path.basename(src.path) + '.' + (fileType && fileType.ext ? fileType.ext : 'mp4');
						await writeNewFile(state.cwd, name, Buffer.from(out));
					}
					await refreshCurrentDir(false);
				}
			});
		},

		mountArchive: mountArchive,
		mountNativeDir: mountNativeDir,
		mountFiles3: mountFiles3,
		umount: umount,

		copySelected: function () {
			var targets = getEffectiveSelectedPaths();
			if (!targets.length) return;
			state.clipboard = {
				mode: 'copy',
				paths: targets
			};
			renderToolbarState();
		},

		cutSelected: function () {
			var targets = getEffectiveSelectedPaths();
			if (!targets.length) return;
			state.clipboard = {
				mode: 'cut',
				paths: targets
			};
			renderToolbarState();
		},

		// One folder at a time, on purpose: every extra root is another boundary to get
		// right, and the panel can only honestly report a list it can show.
		shareWithPeers: function (dirPath) {
			try {
				parent.peers.share(dirPath);
				report('Sharing ' + getNameByPath(dirPath),
					'A connected peer can ask to open it, and you answer. They can read '
					+ 'everything in it and nothing outside it, and they cannot write.',
					'info', [{label: 'Show the Peers panel', run: function () { parent.peers.open(); }}]);
				refreshCurrentDir(false);
			}
			catch (err) {
				report('Could not share that folder', (err && err.message) || String(err));
			}
		},

		stopSharing: function () {
			parent.peers.share(null);
			report('Stopped sharing', 'Anyone who had it open has been told, and their '
				+ 'copy of the folder is gone.', 'info');
			refreshCurrentDir(false);
		},

		pasteClipboard: async function (targetFolderPath) {
			if (!hasInternalClipboard()) return;
			var destination = normalizePath(targetFolderPath || state.cwd);
			var clipboard = {
				mode: state.clipboard.mode,
				paths: state.clipboard.paths.slice()
			};
			try {
				if (clipboard.mode === 'copy') {
					await copyItemsToFolder(clipboard.paths, destination);
				}
				else {
					await moveItemsToFolder(clipboard.paths, destination, {source: 'clipboard-cut'});
					state.clipboard = null;
				}
			}
			finally {
				renderToolbarState();
			}
		}
	};

	// Wrapped once, here, rather than each action growing its own try/catch. Most of these
	// are async and most had no catch at all, so a failed write, a refused rename or a
	// download that never arrived resolved into nothing: no message, no change on screen,
	// and an unhandled rejection in a console nobody has open.
	//
	// An action that handles its own errors never reaches this. An action added later gets
	// the reporting whether or not its author thought about it, which is the whole point --
	// the failure mode being designed out is "someone forgot".
	Object.keys(actions).forEach(function (name) {
		if (typeof actions[name] === 'function') {
			actions[name] = guarded(actions[name], readableActionName(name));
		}
	});

	// What is in a menu, as opposed to js/context-menu.js, which draws one. Built *here*
	// rather than with the other modules at the top of this function, and that is the whole
	// reason it is the last line of this block: several entries read `actions.copySelected`
	// and the like at build time, so the table has to exist and to have been through the
	// guard loop above -- otherwise every menu would hold the unwrapped version and a failed
	// Copy would go back to being a console line.
	var {
		getRowMenuItems, getMultiMenuItems, getEmptyAreaMenuItems
	} = createMenuItems({
		state: state,
		ui: ui,
		shell: parent,
		win: window,
		mountManager: window.mountManager,
		actions: actions,
		archiveNames: archiveNames,
		getSelectedItems: getSelectedItems,
		getItemByPath: getItemByPath,
		getCurrentFolderItem: getCurrentFolderItem,
		hasInternalClipboard: hasInternalClipboard,
		refreshCurrentDir: refreshCurrentDir,
		report: report,
		getNameByPath: getNameByPath,
		getNormalizedExtension: getNormalizedExtension,
		isImageExtension: isImageExtension
	});

	// The sidebar, built here for the same reason menu-items is: every mount row carries an
	// unmount button and the two buttons under the list call `mountNativeDir` and
	// `mountFiles3`, all three read off `actions` as the list is drawn.
	var {renderSidebar} = createSidebar({
		state: state,
		ui: ui,
		doc: document,
		win: window,
		mountManager: window.mountManager,
		actions: actions,
		navigateTo: navigateTo,
		getParentPath: getParentPath
	});

	// Every module exists by this line, which is why the window starts on it rather than two
	// hundred lines up where the other constructions end. `renderSidebar` is the reason it
	// moved: the first `refreshCurrentDir` draws the sidebar, the sidebar is built after
	// `actions`, and a boot that ran before it got `undefined is not a function` on a window
	// that had looked fine for nine passes. Nothing between here and there is more than a
	// declaration, so this is a move of the starting line, not of any work.
	//
	// `renderLayout` first and on its own: it is what puts the nodes in `ui`, and everything
	// below reads one.
	renderLayout();
	bindEvents();
	watchForChanges();
	await refreshCurrentDir(false);

	async function ensureFfmpegLoaded () {
		if (!window.FFmpeg) {
			openInfoDialog('FFmpeg', 'FFmpeg is not installed');
			return false;
		}
		if (!window.ffmpeg) {
			window.ffmpeg = new FFmpeg();
			window.ffmpeg.on('log', function (ev) {
				console.log(ev.message);
			});
			window.ffmpeg.on('progress', function (ev) {
				console.log((ev.progress * 100) + ' %');
			});
			await window.ffmpeg.load({
				coreURL: location.href + '../ffmpeg.0.12.10/ffmpeg-core.js'
			});
		}
		return true;
	}

	function splitCommandLine (line) {
		if (!line) return [];
		var re = /[^\s"]+|"([^"]*)"/g;
		var out = [];
		var match;
		while ((match = re.exec(line)) !== null) {
			out.push(match[1] !== undefined ? match[1] : match[0]);
		}
		return out;
	}

	async function onDrop (e) {
		e.preventDefault();
		updateDragHoverFromPoint(e.clientX, e.clientY);

		// Resolved here, first thing, and synchronously: `e.dataTransfer.items` is emptied
		// as soon as this handler yields, so an `await` anywhere above this line leaves
		// nothing to read.
		var entryList = dropEntries(e);

		var internalDragPayload = e.dataTransfer ? (
			e.dataTransfer.getData('application/x-explorer-paths')
			|| e.dataTransfer.getData('text/plain')
		) : '';
		if (internalDragPayload || (state.dragPaths && state.dragPaths.length)) {
			// `updateDragHoverFromPoint` above has just answered whether the pointer is over a
			// folder right now. That is the only thing that may commit a move -- a release
			// anywhere else ends the drag and moves nothing.
			if (state.dragHoverFolderPath && state.dragPaths && state.dragPaths.length) {
				await commitPendingDragMove('body-fallback');
			}
			state.dragPaths = [];
			state.dragHoverFolderPath = null;
			state.dragDropHandled = false;
			return;
		}
		var files = e.dataTransfer ? e.dataTransfer.files : e.target.files;

		// Where the file is going. `updateDragHoverFromPoint` at the top of this handler has
		// just answered whether the pointer is over a folder row, and a file dropped onto one
		// belongs in it -- that is what dropping it there means. The row's own drop handler
		// cannot take this: only this side knows how to write a file, which is why it lets an
		// external drop fall through to here rather than claiming it.
		var destinationFolder = state.dragHoverFolderPath || state.cwd;

		// A dropped folder arrives in BOTH places: `dataTransfer.files` carries one entry
		// named after the folder, and `dataTransfer.items` carries a directory entry that
		// can actually be walked. The old test was `if (!files || !files.length)`, so the
		// walk never ran -- Chrome always fills `files` -- and the folder went down the
		// loose-file path instead, where `FileReader` was handed a directory and answered
		// `NotFoundError: A requested file or directory could not be found at the time an
		// operation was processed.` Dropping a folder had never worked.
		var hasDirectory = entryList.some(function (entry) {
			return entry && entry.isDirectory;
		});

		if (hasDirectory || !files || !files.length) {
			var entries = await getAllFileEntries(entryList);

			// The walk first, the question second: every file below a dropped folder comes back
			// with a path rooted at the drag, and the conflict question is asked once about each
			// of those roots rather than once per file. Cancelling one skips everything under it
			// and leaves the rest of the drop alone.
			var rootMapping = await resolveIncomingRoots(entryList.filter(function (entry) {
				return entry && entry.isDirectory;
			}).map(function (entry) {
				return entry.name;
			}), destinationFolder);

			for (var i = 0; i < entries.length; i++) {
				var incomingPath = rerootIncomingPath(entries[i].fullPath, rootMapping);
				if (!incomingPath) {
					continue;
				}
				var entryFile = await getFileFromFileEntry(entries[i]);
				await addIncomingFile(entryFile, incomingPath, destinationFolder);
			}
			await refreshCurrentDir(false);
			return;
		}

		// Sequential for the same reason as the upload button: one dialog at a time.
		var dropped = Array.from(files);
		for (var d = 0; d < dropped.length; d++) {
			await addIncomingFile(dropped[d], null, destinationFolder);
		}
		await refreshCurrentDir(false);
	}

	// Every entry the drag carries, or an empty list if this browser has no entries API --
	// in which case `dataTransfer.files` is all there is and a folder cannot be read at all.
	// Must be called before the drop handler awaits anything.
	function dropEntries (e) {
		var items = e.dataTransfer ? e.dataTransfer.items : null;
		if (!items || !items.length || typeof items[0].webkitGetAsEntry !== 'function') {
			return [];
		}
		var entries = [];
		for (var i = 0; i < items.length; i++) {
			var entry = items[i].webkitGetAsEntry();
			if (entry) {
				entries.push(entry);
			}
		}
		return entries;
	}

	// The shell opens a second Explorer with ?cwd=<path>. window.cwd stays supported for
	// anything that still assigns it, but it can only be read after the iframe has loaded,
	// by which time this state object has long been built -- hence the query string.
	function getInitialCwd () {
		try {
			var fromQuery = new URLSearchParams(location.search).get('cwd');
			if (fromQuery) {
				return fromQuery;
			}
		}
		catch (err) {
			// URLSearchParams is unavailable in nothing we support, but a bad URL should
			// not stop Explorer from opening at all.
		}
		return window.cwd || '/';
	}

	function hasInternalClipboard () {
		return !!(state.clipboard && state.clipboard.paths && state.clipboard.paths.length);
	}

	function isEditableTarget (node) {
		return !!(node && (node.closest('input, textarea, select') || node.isContentEditable));
	}

	function getEffectiveSelectedPaths () {
		return Array.from(state.selectedPaths)
			.map(normalizePath)
			.sort()
			.filter(function (candidate, index, list) {
				for (var i = 0; i < list.length; i++) {
					if (i === index) continue;
					if (candidate.indexOf(list[i] + '/') === 0) {
						return false;
					}
				}
				return true;
			});
	}
}
</script>
</body>
</html>
