	function wireSimpleDialog (panel, onSubmit) {
		var submitted = false;
		function submitOnce () {
			if (submitted) return;
			submitted = true;
			// `false` means the handler declined -- an empty filename, say -- and left the
			// dialog open. The latch has to release, or every later click and Enter is
			// swallowed and the dialog is dead with no way out but Cancel.
			if (onSubmit() === false) {
				submitted = false;
			}
		}
		var cancel = panel.querySelector('.Dialog__cancel');
		if (cancel) {
			cancel.onclick = function () {
				state.dialog = null;
				renderOverlays();
			};
		}
		var submit = panel.querySelector('.Dialog__submit');
		if (submit) {
			submit.onclick = submitOnce;
		}
		panel.onkeydown = function (e) {
			if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
				e.preventDefault();
				// preventDefault stops the default action, not the bubble. Without this the
				// event still reached the document handler above, which opened the path the
				// dialog had just renamed away from.
				e.stopPropagation();
				submitOnce();
			}
		};
	}

	// The first field of a dialog, focused with its value selected -- except on a filename
	// field, where the extension is left out of the selection: typing straight over
	// "report" should keep ".final.pdf", which is what makes the autofocus useful rather
	// than something to undo first.
	//
	// A dialog with no field at all focuses its default button instead, so Enter confirms
	// it rather than falling through to the window behind.
	function focusDialogInput (root) {
		// Never a checkbox: it cannot be typed into, and focusing the first one in a list
		// of them buries the field -- or the button -- that the dialog is actually asking
		// you to use. The archive dialog is a list of checkboxes and made this visible.
		var input = root.querySelector('input:not([type="checkbox"]), textarea, select');
		if (!input) {
			var submit = root.querySelector('.Dialog__submit');
			if (submit) {
				submit.focus();
			}
			return;
		}
		input.focus();
		if (input.tagName !== 'INPUT') {
			return;
		}
		try {
			if (input.dataset.selectBasename !== undefined) {
				input.setSelectionRange(0, basenameEnd(input.value));
			}
			else {
				input.select();
			}
		}
		catch (err) {
			// Some input types refuse setSelectionRange. Focused is still better than not.
		}
	}

	function basenameEnd (name) {
		var text = String(name == null ? '' : name);
		var dot = text.lastIndexOf('.');
		// A leading dot is the whole name of a dotfile, not an extension.
		return dot > 0 ? dot : text.length;
	}

	// Everything a dialog does happens after the action that opened it has already
	// returned, so the wrapper around `actions` is long gone by the time a submit handler
	// runs. A rejection in there escaped into nothing: a rename onto a file another window
	// had just deleted reported itself as "Uncaught (in promise)" in a console nobody has
	// open, and as absolutely nothing on screen. The callbacks are wrapped here for the
	// same reason the actions are -- so that a dialog added later gets it too.
	// Every on*-shaped function on the dialog, rather than a list of the ones that exist
	// today: a list is a thing to forget to add to, and forgetting is the failure this is
	// here to prevent.
	function isCallbackName (name) {
		return /^on[A-Z]/.test(name);
	}

	function openDialog (dialog) {
		if (dialog) {
			Object.keys(dialog).forEach(function (name) {
				if (isCallbackName(name) && typeof dialog[name] === 'function') {
					dialog[name] = guarded(dialog[name], readableActionName(dialog.type || 'dialog'));
				}
			});
		}
		state.dialog = dialog;
		renderOverlays();
	}

	function closeDialog (result) {
		if (!state.dialog) return;
		var dialog = state.dialog;
		state.dialog = null;
		renderOverlays();
		if (dialog.type === 'pasteConflict' && dialog.onSubmit) {
			dialog.onSubmit(result || 'cancel');
		}
	}

	function openInfoDialog (title, message) {
		openDialog({type: 'info', title: title, message: message});
	}

	async function buildDefaultAppsManagerDialog (prefillExtension) {
		return {
			type: 'defaultAppsManager',
			rows: await getDefaultAppRows(),
			addableApps: getInstalledAppsForPicker(),
			prefillExtension: prefillExtension || '',
			onSave: async function (extension, appId) {
				if (await saveDefaultAppAssociation(extension, appId)) {
					openDialog(await buildDefaultAppsManagerDialog(extension));
				}
			},
			onClear: async function (extension) {
				if (await clearDefaultAppAssociation(extension)) {
					openDialog(await buildDefaultAppsManagerDialog(''));
				}
			},
			onAdd: async function (extension, appId) {
				if (await saveDefaultAppAssociation(extension, appId)) {
					openDialog(await buildDefaultAppsManagerDialog(extension));
				}
			}
		};
	}

	async function saveDefaultAppAssociation (extension, appId) {
		var normalizedExt = normalizeExtensionInput(extension);
		if (!normalizedExt) {
			openInfoDialog('Default apps', 'Extension is required');
			return false;
		}
		if (!appId) {
			openInfoDialog('Default apps', 'Application is required');
			return false;
		}
		if (!await isAppCompatibleWithExtension(appId, normalizedExt)) {
			openInfoDialog('Default apps', 'Selected app does not support .' + normalizedExt);
			return false;
		}
		if (typeof parent.setDefaultAppForExtension !== 'function') {
			openInfoDialog('Default apps', 'Default app storage is unavailable');
			return false;
		}
		await parent.setDefaultAppForExtension(normalizedExt, appId);
		return true;
	}

	async function clearDefaultAppAssociation (extension) {
		var normalizedExt = normalizeExtensionInput(extension);
		if (!normalizedExt || typeof parent.clearDefaultAppForExtension !== 'function') {
			return false;
		}
		await parent.clearDefaultAppForExtension(normalizedExt);
		return true;
	}

	function getItemByPath (itemPath) {
		return state.items.find(function (item) {
			return item.path === itemPath;
		}) || null;
	}

	// The folder you are looking *at* is not one of the rows in it, so nothing in the
	// empty-area menu can look it up. This is where it is described instead.
	function getCurrentFolderItem () {
		return {
			path: state.cwd,
			name: state.cwd.split('/').filter(Boolean).pop() || '/',
			isDirectory: true
		};
	}

	function getSelectedItems () {
		return state.items.filter(function (item) {
			return state.selectedPaths.has(item.path);
		});
	}

	function applySelectionFromEvent (itemPath, e) {
		var visiblePaths = state.items.map(function (item) { return item.path; });
		if (e.shiftKey && state.lastSelectedPath && visiblePaths.indexOf(state.lastSelectedPath) > -1) {
			var from = visiblePaths.indexOf(state.lastSelectedPath);
			var to = visiblePaths.indexOf(itemPath);
			var start = Math.min(from, to);
			var end = Math.max(from, to);
			state.selectedPaths = new Set(visiblePaths.slice(start, end + 1));
		}
		else if (e.metaKey || e.ctrlKey) {
			if (state.selectedPaths.has(itemPath)) {
				state.selectedPaths.delete(itemPath);
			}
			else {
				state.selectedPaths.add(itemPath);
			}
			state.lastSelectedPath = itemPath;
		}
		else {
			state.selectedPaths = new Set([itemPath]);
			state.lastSelectedPath = itemPath;
		}
		syncSelectionUI();
	}

	function toggleSelection (itemPath, isSelected) {
		if (isSelected) {
			state.selectedPaths.add(itemPath);
			state.lastSelectedPath = itemPath;
		}
		else {
			state.selectedPaths.delete(itemPath);
			if (state.lastSelectedPath === itemPath) {
				state.lastSelectedPath = Array.from(state.selectedPaths).pop() || null;
			}
		}
		syncSelectionUI();
	}

	function setAllSelection (checked) {
		if (checked) {
			state.selectedPaths = new Set(state.items.map(function (item) { return item.path; }));
			state.lastSelectedPath = state.items.length ? state.items[state.items.length - 1].path : null;
		}
		else {
			state.selectedPaths = new Set();
			state.lastSelectedPath = null;
		}
		syncSelectionUI();
	}

	function syncSelectionUI () {
		rootElem.querySelectorAll('.Explorer__row[data-path]').forEach(function (node) {
			node.classList.toggle('Explorer__row--selected', state.selectedPaths.has(node.dataset.path));
		});
		rootElem.querySelectorAll('.Explorer__card[data-path]').forEach(function (node) {
			node.classList.toggle('Explorer__card--selected', state.selectedPaths.has(node.dataset.path));
		});
		rootElem.querySelectorAll('.Explorer__itemCheckbox[data-path]').forEach(function (node) {
			node.checked = state.selectedPaths.has(node.dataset.path);
		});
		syncSelectAllUI();
		renderStatus();
		renderToolbarState();
	}

	function syncSelectAllUI () {
		var allSelected = !!state.items.length && state.selectedPaths.size === state.items.length;
		var partiallySelected = state.selectedPaths.size > 0 && state.selectedPaths.size < state.items.length;
		[ui.selectAll, ui.selectAllToolbar].forEach(function (node) {
			if (!node) return;
			node.checked = allSelected;
			node.indeterminate = partiallySelected;
		});
	}

	function startSelectionBox (e) {
		closeContextMenu();
		var point = getSelectionPoint(e);
		state.selectionBox = {
			startX: point.x,
			startY: point.y,
			currentX: point.x,
			currentY: point.y,
			baseSelection: (e.ctrlKey || e.metaKey) ? new Set(state.selectedPaths) : new Set(),
			toggledPaths: new Set(),
			didDrag: false
		};
		ui.main.classList.add('Explorer__main--selecting');
		updateSelectionBoxVisual();
		document.addEventListener('mousemove', handleSelectionBoxMove);
		document.addEventListener('mouseup', handleSelectionBoxEnd);
	}

	function handleSelectionBoxMove (e) {
		if (!state.selectionBox) return;
		var point = getSelectionPoint(e);
		state.selectionBox.currentX = point.x;
		state.selectionBox.currentY = point.y;
		state.selectionBox.didDrag = state.selectionBox.didDrag || Math.abs(point.x - state.selectionBox.startX) > 3 || Math.abs(point.y - state.selectionBox.startY) > 3;
		updateSelectionBoxVisual();
		updateSelectionBoxSelection();
	}

	function handleSelectionBoxEnd () {
		if (!state.selectionBox) return;
		var didDrag = state.selectionBox.didDrag;
		if (!didDrag) {
			state.selectedPaths = new Set();
			state.lastSelectedPath = null;
			syncSelectionUI();
		}
		state.selectionBox = null;
		ui.main.classList.remove('Explorer__main--selecting');
		ui.selectionBox.style.display = 'none';
		document.removeEventListener('mousemove', handleSelectionBoxMove);
		document.removeEventListener('mouseup', handleSelectionBoxEnd);
	}

	function updateSelectionBoxVisual () {
		if (!state.selectionBox) return;
		var box = getSelectionBoxRect();
		ui.selectionBox.style.display = state.selectionBox.didDrag ? 'block' : 'none';
		ui.selectionBox.style.left = box.left + 'px';
		ui.selectionBox.style.top = box.top + 'px';
		ui.selectionBox.style.width = box.width + 'px';
		ui.selectionBox.style.height = box.height + 'px';
	}

	function updateSelectionBoxSelection () {
		if (!state.selectionBox || !state.selectionBox.didDrag) return;
		var box = getSelectionBoxRect();
		var nextSelection = new Set(state.selectionBox.baseSelection);
		var intersected = getSelectionIntersectedPaths(box);
		intersected.forEach(function (itemPath) {
			nextSelection.add(itemPath);
		});
		state.selectedPaths = nextSelection;
		state.lastSelectedPath = intersected.length ? intersected[intersected.length - 1] : (Array.from(nextSelection).pop() || null);
		syncSelectionUI();
	}

	function getSelectionBoxRect () {
		var selection = state.selectionBox;
		var left = Math.min(selection.startX, selection.currentX);
		var top = Math.min(selection.startY, selection.currentY);
		var right = Math.max(selection.startX, selection.currentX);
		var bottom = Math.max(selection.startY, selection.currentY);
		return {
			left: left,
			top: top,
			right: right,
			bottom: bottom,
			width: right - left,
			height: bottom - top
		};
	}

	function getSelectionPoint (e) {
		var mainRect = ui.main.getBoundingClientRect();
		return {
			x: e.clientX - mainRect.left + ui.main.scrollLeft,
			y: e.clientY - mainRect.top + ui.main.scrollTop
		};
	}

	function getSelectionIntersectedPaths (box) {
		var selector = state.viewMode === 'grid' ? '.Explorer__card[data-path]' : '.Explorer__row[data-path]';
		return Array.from(rootElem.querySelectorAll(selector)).map(function (node) {
			var rect = getNodeRectInMain(node);
			return intersectsSelectionBox(box, rect) ? node.dataset.path : null;
		}).filter(Boolean);
	}

	function getNodeRectInMain (node) {
		var rect = node.getBoundingClientRect();
		var mainRect = ui.main.getBoundingClientRect();
		return {
			left: rect.left - mainRect.left + ui.main.scrollLeft,
			top: rect.top - mainRect.top + ui.main.scrollTop,
			right: rect.right - mainRect.left + ui.main.scrollLeft,
			bottom: rect.bottom - mainRect.top + ui.main.scrollTop
		};
	}

	function intersectsSelectionBox (a, b) {
		return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
	}

	function handleItemDragStart (e) {
		var itemNode = e.target.closest('[data-path][data-type]');
		if (!itemNode) return;
		var dragPath = itemNode.dataset.path;
		var dragPaths = state.selectedPaths.has(dragPath) ? Array.from(state.selectedPaths) : [dragPath];
		state.dragPaths = dragPaths;
		state.dragDropHandled = false;
		if (state.dragOverCommitTimer) {
			clearTimeout(state.dragOverCommitTimer);
			state.dragOverCommitTimer = null;
		}
		if (e.dataTransfer) {
			var payload = JSON.stringify(dragPaths);
			e.dataTransfer.setData('application/x-explorer-paths', payload);
			e.dataTransfer.setData('text/plain', payload);
			e.dataTransfer.effectAllowed = 'move';
		}
	}

	function handleItemDragOver (e) {
		var folderNode = e.target.closest('[data-path][data-type=\"dir\"]');
		if (!folderNode) return;
		e.preventDefault();
		clearDropTargets();
		folderNode.classList.add('Explorer__dropTarget');
		state.dragHoverFolderPath = folderNode.dataset.path;
		state.lastDragHoverFolderPath = folderNode.dataset.path;
		scheduleDragoverIdleCommit();
		if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
	}

	function handleItemDragLeave (e) {
		var folderNode = e.target.closest('[data-path][data-type=\"dir\"]');
		if (!folderNode) return;
		if (folderNode.contains(e.relatedTarget)) return;
		folderNode.classList.remove('Explorer__dropTarget');
		// Keep last known folder target during drag; some browsers emit dragleave before dragend/drop.
		if (!state.dragPaths.length && state.dragHoverFolderPath === folderNode.dataset.path) {
			state.dragHoverFolderPath = null;
		}
	}

	async function handleItemDrop (e) {
		var folderNode = e.target.closest('[data-path][data-type=\"dir\"]');
		if (!folderNode) return;
		var dragRaw = e.dataTransfer ? (
			e.dataTransfer.getData('application/x-explorer-paths')
			|| e.dataTransfer.getData('text/plain')
		) : '';
		e.preventDefault();
		e.stopPropagation();
		clearDropTargets();
		var dragPaths = state.dragPaths && state.dragPaths.length ? state.dragPaths.slice() : [];
		try {
			if (dragRaw) {
				dragPaths = JSON.parse(dragRaw);
			}
		}
		catch (err) {
			console.error(err);
		}
		if (!dragPaths.length) return;
		state.dragDropHandled = true;
		await moveItemsToFolder(dragPaths, folderNode.dataset.path, {source: 'direct-drop'});
		state.dragPaths = [];
		state.dragHoverFolderPath = null;
		state.lastDragHoverFolderPath = null;
	}

	function handleItemDragEnd () {
		// Some browsers fire dragend before drop bubbling completes.
		setTimeout(function () {
			commitPendingDragMove('dragend-fallback');
			state.dragPaths = [];
			state.dragHoverFolderPath = null;
			state.lastDragHoverFolderPath = null;
			state.dragDropHandled = false;
			if (state.dragOverCommitTimer) {
				clearTimeout(state.dragOverCommitTimer);
				state.dragOverCommitTimer = null;
			}
			clearDropTargets();
		}, 0);
	}

	async function commitPendingDragMove (source) {
		if (state.dragCommitInProgress) return;
		if (state.dragDropHandled) return;
		var targetFolder = state.dragHoverFolderPath || state.lastDragHoverFolderPath;
		if (!targetFolder) return;
		if (!state.dragPaths || !state.dragPaths.length) return;

		state.dragCommitInProgress = true;
		try {
			state.dragDropHandled = true;
			await moveItemsToFolder(state.dragPaths.slice(), targetFolder, {source: source});
		}
		finally {
			state.dragCommitInProgress = false;
			if (state.dragOverCommitTimer) {
				clearTimeout(state.dragOverCommitTimer);
				state.dragOverCommitTimer = null;
			}
		}
	}

	function clearDropTargets () {
		rootElem.querySelectorAll('.Explorer__dropTarget').forEach(function (node) {
			node.classList.remove('Explorer__dropTarget');
		});
	}

	function scheduleDragoverIdleCommit () {
		if (state.dragOverCommitTimer) {
			clearTimeout(state.dragOverCommitTimer);
		}
		state.dragOverCommitTimer = setTimeout(function () {
			commitPendingDragMove('dragover-idle-fallback');
		}, 220);
	}

	function updateDragHoverFromPoint (x, y) {
		var node = document.elementFromPoint(x, y);
		var folderNode = node && node.closest ? node.closest('[data-path][data-type=\"dir\"]') : null;
		clearDropTargets();
		if (folderNode) {
			state.dragHoverFolderPath = folderNode.dataset.path;
			state.lastDragHoverFolderPath = folderNode.dataset.path;
			folderNode.classList.add('Explorer__dropTarget');
		}
		else {
			// During active drag keep last valid hover folder for fallback commit.
			if (!state.dragPaths.length) {
				state.dragHoverFolderPath = null;
				state.lastDragHoverFolderPath = null;
			}
		}
	}

	// --- archives -------------------------------------------------------------------
	//
	// The engine is 1.4 MB of WebAssembly and most sessions never open an archive, so it
	// arrives on the first press of *Extract* rather than with Explorer. The rules it
	// needs (../7z/js/parse.js) are imported at the top, because deciding whether a file
	// is an archive at all must not cost a download.

	var archiveEngine = null;

	function loadArchiveEngine () {
		if (!archiveEngine) {
			archiveEngine = import('../7z/js/archive.js');
			// A failed load is not the answer for the rest of the session: the next press
			// tries again rather than replaying it.
			archiveEngine.catch(function () {
				archiveEngine = null;
			});
		}
		return archiveEngine;
	}

	// The engine describes its own failures -- a wrong password and a truncated file are
	// the same exit code, and only the text tells them apart -- so its sentence is used
	// where there is one, and only an unexpected exception falls back to the generic
	// reporter.
	function reportArchiveFailure (label, err) {
		if (err && err.failure) {
			report(err.failure.title, err.failure.message, 'warn');
			return;
		}
		reportFailure(label, err);
	}

	async function openArchiveDialog (item) {
		var dialog = {
			type: 'archive',
			name: item.name,
			path: item.path,
			phase: 'reading',
			entries: [],
			selected: null,
			password: '',
			error: '',
			destination: '',
			unwrapped: false,
			bytes: null,
			onUnlock: function (password) {
				readArchive(dialog, password);
			},
			onExtract: function (paths) {
				runExtract(dialog, paths);
			},
			onToggle: function (entryPath, on) {
				if (on) {
					dialog.selected.add(entryPath);
				}
				else {
					dialog.selected.delete(entryPath);
				}
			},
			onPassword: function (value) {
				dialog.password = value;
			}
		};
		openDialog(dialog);
		await readArchive(dialog, '');
	}

	// Listing first, always. Reading an archive to see inside it writes nothing anywhere,
	// which is what makes it safe to do before asking anything.
	async function readArchive (dialog, password) {
		dialog.phase = 'reading';
		dialog.error = '';
		dialog.password = password || '';
		refreshArchiveDialog(dialog);

		var engine = null;
		var listing;
		try {
			engine = await loadArchiveEngine();
			if (!dialog.bytes) {
				dialog.bytes = await readFile(dialog.path);
			}
			listing = await engine.inspect(dialog.bytes, {
				name: dialog.name,
				password: dialog.password
			});
		}
		catch (err) {
			closeArchiveDialog(dialog);
			reportArchiveFailure('Could not read ' + dialog.name, err);
			return;
		}

		// Closed while the engine was working. Its answer is no longer wanted, and
		// reopening the dialog over whatever is on screen now would be worse than useless.
		if (state.dialog !== dialog) {
			return;
		}

		if (listing.needsPassword) {
			dialog.phase = 'password';
			dialog.error = listing.failure ? listing.failure.title : '';
			refreshArchiveDialog(dialog);
			return;
		}
		if (listing.failure) {
			closeArchiveDialog(dialog);
			report(listing.failure.title, listing.failure.message, 'warn');
			return;
		}

		dialog.entries = listing.entries;
		dialog.unwrapped = !!listing.unwrapped;
		dialog.selected = new Set(listing.entries.filter(function (entry) {
			return !entry.isDirectory;
		}).map(function (entry) {
			return entry.path;
		}));
		dialog.destination = engine.destinationFor(dialog.name, function (name) {
			return state.items.some(function (entry) {
				return entry.name === name;
			});
		});
		dialog.phase = 'ready';
		refreshArchiveDialog(dialog);
	}

	async function runExtract (dialog, paths) {
		dialog.phase = 'working';
		dialog.error = '';
		refreshArchiveDialog(dialog);

		var result;
		try {
			var engine = await loadArchiveEngine();
			result = await engine.extract(dialog.bytes, {
				name: dialog.name,
				password: dialog.password,
				// Everything selected is not a selection: without a list 7-Zip keeps the
				// empty folders too, and there is nothing to get wrong.
				paths: paths
			});
		}
		catch (err) {
			var kind = err && err.failure ? err.failure.kind : '';
			// A password is a question, not a failure: the dialog stays open and asks
			// again, with what went wrong above the field.
			if (kind === 'password' || kind === 'password-needed') {
				dialog.phase = 'password';
				dialog.error = err.failure.title;
				refreshArchiveDialog(dialog);
				return;
			}
			closeArchiveDialog(dialog);
			reportArchiveFailure('Could not extract ' + dialog.name, err);
			return;
		}

		closeArchiveDialog(dialog);
		await writeExtracted(dialog.name, result, dialog.destination);
		await refreshCurrentDir(false);
	}

	// Nothing here needs the engine: the names, formats and presets are all in the rules
	// module Explorer already has. The 1.4 MB arrives when Compress is pressed, and not
	// for somebody who opened the dialog to look at it.
	function openCompressDialog (items) {
		var folderName = state.cwd.split('/').filter(Boolean).pop() || 'archive';
		var dialog = {
			type: 'compress',
			items: items,
			folderName: folderName,
			format: '7z',
			preset: 'normal',
			password: '',
			encryptNames: false,
			phase: 'ready',
			progress: '',
			name: ''
		};
		dialog.name = freeArchiveName(items, dialog.format, folderName);

		dialog.onFormat = function (formatId) {
			// The name follows the format rather than being left saying .zip on a 7z.
			var stem = archiveNames.stripExtension(dialog.name, dialog.format);
			dialog.format = formatId;
			dialog.name = freeArchiveName(items, formatId, folderName, stem);
			refreshArchiveDialog(dialog);
		};
		dialog.onPreset = function (presetId) {
			dialog.preset = presetId;
			refreshArchiveDialog(dialog);
		};
		dialog.onName = function (value) {
			dialog.name = value;
		};
		dialog.onPassword = function (value) {
			dialog.password = value;
		};
		dialog.onEncryptNames = function (on) {
			dialog.encryptNames = on;
		};
		dialog.onCompress = function () {
			runCompress(dialog);
		};

		openDialog(dialog);
	}

	function freeArchiveName (items, formatId, folderName, stem) {
		var suggested = stem
			? stem + '.' + archiveNames.formatFor(formatId).extension
			: archiveNames.archiveNameFor(items, formatId, folderName);
		var base = archiveNames.stripExtension(suggested, formatId);
		return archiveNames.uniqueName(base, archiveNames.formatFor(formatId).extension, function (name) {
			return state.items.some(function (entry) {
				return entry.name === name;
			});
		});
	}

	async function runCompress (dialog) {
		dialog.phase = 'working';
		dialog.progress = 'Reading the files…';
		refreshArchiveDialog(dialog);

		var made;
		try {
			var engine = await loadArchiveEngine();
			var source = await collectForArchive(dialog.items);
			dialog.progress = 'Compressing ' + source.files.length
				+ (source.files.length === 1 ? ' file…' : ' files…');
			refreshArchiveDialog(dialog);
			made = await engine.compress({
				name: dialog.name,
				format: dialog.format,
				preset: dialog.preset,
				password: dialog.password,
				encryptNames: dialog.encryptNames,
				files: source.files,
				dirs: source.dirs
			});
		}
		catch (err) {
			closeArchiveDialog(dialog);
			reportArchiveFailure('Could not make ' + dialog.name, err);
			return;
		}

		closeArchiveDialog(dialog);
		try {
			// Through the same funnel every other route that produces a file uses, so a
			// name that has appeared since the dialog opened is asked about rather than
			// written over. The suggested name is already a free one; this is the race.
			var written = await writeNewFile(state.cwd, made.name, Buffer.from(made.data), 'compress');
			if (!written) {
				return;
			}
		}
		catch (err) {
			reportFailure('Writing ' + made.name, err);
			return;
		}
		await refreshCurrentDir(false);
		report('Made ' + made.name, formatSize(made.data.length) + ' from '
			+ dialog.items.length + (dialog.items.length === 1 ? ' item' : ' items') + '.',
			'info');
	}

	// Every file under everything that was selected, with paths relative to this folder --
	// so the archive holds `notes/a.txt` and not the whole path from the root of PixOS.
	// Empty folders are collected separately, because they are part of the shape and
	// nothing else would record them.
	async function collectForArchive (items) {
		var files = [];
		var dirs = [];

		async function walk (item, relative) {
			if (!item.isDirectory) {
				files.push({path: relative, data: await readFile(item.path)});
				return;
			}
			dirs.push(relative);
			var children = await listDirectory(item.path);
			for (var i = 0; i < children.length; i++) {
				await walk(children[i], relative + '/' + children[i].name);
			}
		}

		for (var i = 0; i < items.length; i++) {
			await walk(items[i], items[i].name);
		}
		return {files: files, dirs: dirs};
	}

	// The first render of a dialog goes through openDialog, which wraps its callbacks so a
	// throw inside one is reported rather than lost. Every render after that must not:
	// openDialog wraps again each time it is called, and a dialog with four states would
	// end up several layers deep in its own error handling.
	function refreshArchiveDialog (dialog) {
		if (state.dialog === dialog) {
			renderOverlays();
			return;
		}
		openDialog(dialog);
	}

	function closeArchiveDialog (dialog) {
		if (state.dialog === dialog) {
			state.dialog = null;
			renderOverlays();
		}
	}

	// Straight into a folder beside the archive -- the whole point of the phase. The name
	// is never one that is already taken: extracting the same archive twice is ordinary,
	// and merging into a folder somebody has since put their own files in cannot be undone.
	async function writeExtracted (archiveName, result, destination) {
		var engine = await loadArchiveEngine();
		var folder = destination || engine.destinationFor(archiveName, function (name) {
			return state.items.some(function (entry) {
				return entry.name === name;
			});
		});
		var destPath = path.join(state.cwd, folder);

		try {
			await ensureDir(destPath);
			for (var i = 0; i < result.files.length; i++) {
				await writeFile(path.join(destPath, result.files[i].path),
					Buffer.from(result.files[i].data));
			}
			// An empty folder is part of the archive's shape, and writeFile only makes the
			// ones with something in them.
			for (var d = 0; d < (result.dirs || []).length; d++) {
				await ensureDir(path.join(destPath, result.dirs[d]));
			}
		}
		catch (err) {
			reportFailure('Writing the contents of ' + archiveName, err);
			return;
		}

		var partial = result.failure && result.failure.kind === 'partial';
		report(partial ? 'Extracted part of ' + archiveName : 'Extracted ' + archiveName,
			result.files.length + (result.files.length === 1 ? ' file' : ' files')
				+ ' into ' + folder + '/'
				+ (result.unwrapped ? ' — both layers of it, so there is no .tar left over.' : '')
				+ (partial ? ' ' + result.failure.message : ''),
			partial ? 'warn' : 'info',
			[{label: 'Open ' + folder, run: function () { navigateTo(destPath); }}]);
	}

	// The shell owns the connection; this only asks who is on it. A submenu rather than a
	// dialog because the answer is a short list of names, and disabled with the reason
	// when it is empty -- an entry that opens an empty picker is the dead end this whole
	// pattern keeps having to undo.
	function sendToPeerMenu (filePath) {
		var connected = (parent !== window && parent.peers && parent.peers.list)
			? parent.peers.list()
			: null;
		if (!connected) {
			return {label: 'Send to peer', disabled: true};
		}
		if (!connected.length) {
			return {
				label: 'Send to peer — nobody connected',
				action: function () { parent.peers.open(); }
			};
		}
		return {
			label: 'Send to peer',
			submenu: connected.map(function (peer) {
				return {
					label: peer.name,
					action: function () {
						Promise.resolve(parent.peers.sendFile(peer.id, filePath)).then(function () {
							report('Offered ' + getNameByPath(filePath) + ' to ' + peer.name,
								'They have to accept it before anything is sent.', 'info');
						}, function (err) {
							report('Could not send ' + getNameByPath(filePath),
								(err && err.message) || String(err));
						});
					}
				};
			})
		};
	}

	function getRowMenuItems (path) {
		var selected = getSelectedItems();
		if (selected.length > 1) {
			return getMultiMenuItems();
		}
		var item = getItemByPath(path);
		if (!item) return getEmptyAreaMenuItems();

		if (item.isDirectory) {
			var dirIsMountPoint = mountManager && mountManager.isMountPoint(item.path);
			var dirMenuItems = [
				{label: 'Open', action: function () { actions.open(item.path); }},
				{label: 'Open in New Explorer', action: function () { actions.open(item.path, 'new explorer'); }},
				{label: 'Open with...', action: function () { actions.openWith(item.path); }},
				{separator: true},
				{label: 'Copy', action: actions.copySelected},
				{label: 'Cut', action: actions.cutSelected},
				{label: 'Copy path', action: function () { actions.copyPath(item.path); }},
				{label: 'Compress…', action: function () { actions.compress(item.path); }},
				{label: 'Paste into Folder', action: function () { actions.pasteClipboard(item.path); }, disabled: !hasInternalClipboard()},
				{separator: true},
				{label: 'Rename', action: function () { actions.rename(item.path); }},
				{label: 'Delete', action: function () { actions.deleteSelected(); }},
				{separator: true},
				{label: 'New', submenu: [
					{label: 'New File', action: actions.createFile},
					{label: 'New Folder', action: actions.createFolder},
					{label: 'Add Online File', action: actions.addOnlineFile}
				]}
			];
			// The shell holds which folder is shared, because it is the shell that answers
			// when somebody asks to open it. Explorer only offers the folder.
			if (parent !== window && parent.peers && parent.peers.share) {
				var shared = parent.peers.getShare();
				dirMenuItems.push({separator: true});
				dirMenuItems.push(shared === item.path
					? {label: 'Stop sharing with peers', action: function () { actions.stopSharing(); }}
					: {label: 'Share with peers…', action: function () { actions.shareWithPeers(item.path); }});
			}
			// Only under the shell: it is the shell that owns the bookmarks document.
			if (typeof parent.addBookmark === 'function') {
				dirMenuItems.push({separator: true});
				dirMenuItems.push({label: 'Add to bookmarks', action: function () { actions.addToBookmarks(item.path); }});
			}
			if (dirIsMountPoint) {
				dirMenuItems.push({separator: true});
				dirMenuItems.push({label: 'Unmount', action: function () { actions.umount(item.path); }});
			}
			return dirMenuItems;
		}

		var ext = getNormalizedExtension(item.path);
		var mountableExts = ['zip', 'iso'];
		var isMountable = mountableExts.indexOf(ext) !== -1;
		var isMountPoint = mountManager && mountManager.isMountPoint(item.path);

		var fileMenuItems = [
			{label: 'Open', action: function () { actions.open(item.path); }},
			{label: 'Open with...', action: function () { actions.openWith(item.path); }},
			{separator: true},
			{label: 'Copy', action: actions.copySelected},
			{label: 'Cut', action: actions.cutSelected},
			{label: 'Copy path', action: function () { actions.copyPath(item.path); }},
			// Top level rather than in Tools, unlike *Extract…*: compressing applies to
			// anything, extracting only to an archive.
			{label: 'Compress…', action: function () { actions.compress(item.path); }},
			sendToPeerMenu(item.path),
			{label: 'Rename', action: function () { actions.rename(item.path); }},
			{label: 'Download', action: actions.downloadSelected},
			{label: 'Delete', action: actions.deleteSelected},
			{separator: true},
			{label: 'Tools', submenu: [
				{label: 'Get SHA1', action: actions.getHashSHA1},
				// One entry for every format 7-Zip reads, and disabled when the name is
				// not one of them -- an *Extract* that opens a dialog to say "this is not
				// an archive" is a worse answer than an entry you can see is not for this
				// file. The name is a hint, not the truth, so the engine still checks.
				{label: 'Extract…', action: function () { actions.extract(item.path); },
					disabled: !archiveNames.isArchiveName(item.name)},
				{label: 'Mount as filesystem', action: function () { actions.mountArchive(item.path); }, disabled: !isMountable},
				{label: 'FFmpeg', action: actions.ffmpeg},
				{label: state.recording ? 'Stop Screen Recording' : 'Screen Recording', action: state.recording ? actions.stopScreenRecording : actions.startScreenRecording}
			]}
		];

		// Both of these only exist under the shell -- it owns the desktop and it owns the
		// bookmarks document -- and they share one separator so a standalone Explorer does
		// not end its menu with a rule and nothing after it.
		var shellExtras = [];
		if (typeof parent.addBookmark === 'function') {
			shellExtras.push({label: 'Add to bookmarks', action: function () {
				actions.addToBookmarks(item.path);
			}});
		}
		// The images are already here, so this is the natural place to set one as the
		// wallpaper.
		if (isImageExtension(item.path) && typeof parent.setWallpaperImage === 'function') {
			shellExtras.push({label: 'Set as wallpaper', action: function () {
				parent.setWallpaperImage(item.path);
			}});
		}
		if (shellExtras.length) {
			fileMenuItems.push({separator: true});
			fileMenuItems = fileMenuItems.concat(shellExtras);
		}

		return fileMenuItems;
	}

	function getMultiMenuItems () {
		var selected = getSelectedItems();
		var allFiles = selected.length > 0 && selected.every(function (item) {
			return !item.isDirectory;
		});
		var items = [];
		if (allFiles) {
			items.push(
				{label: 'Open with...', action: function () { actions.openWith(); }},
				{separator: true}
			);
		}
		items.push(
			{label: 'Copy selected', action: actions.copySelected},
			{label: 'Cut selected', action: actions.cutSelected},
			{label: 'Copy paths', action: function () { actions.copyPath(); }},
			{label: 'Compress…', action: function () { actions.compress(); }},
			{separator: true},
			{label: 'Delete selected', action: actions.deleteSelected},
			{label: 'Download selected', action: actions.downloadSelected},
			{separator: true},
			{label: 'Tools for selected', submenu: [
				{label: 'Get SHA1', action: actions.getHashSHA1},
				{label: 'Extract all', action: actions.extractSelected},
				{label: 'FFmpeg', action: actions.ffmpeg},
				{label: state.recording ? 'Stop Screen Recording' : 'Screen Recording', action: state.recording ? actions.stopScreenRecording : actions.startScreenRecording}
			]}
		);
		return items;
	}

	function getEmptyAreaMenuItems () {
		return [
			// No row under the pointer, so this entry has to name what it acts on. It is
			// also the only way to reach *Open with...* for the folder you are inside --
			// otherwise you have to go up a level to right-click it.
			{label: 'Open this folder with...', action: function () { actions.openWith(getCurrentFolderItem()); }},
			{separator: true},
			{label: 'New File', action: actions.createFile},
			{label: 'New Folder', action: actions.createFolder},
			{label: 'Add Online File', action: actions.addOnlineFile},
			{separator: true},
			{label: 'Upload', action: function () { ui.fileInput.click(); }},
			{label: 'Paste', action: actions.pasteClipboard, disabled: !hasInternalClipboard()},
			{label: 'Refresh', action: function () { refreshCurrentDir(false); }},
			{separator: true},
			{label: 'Tools', submenu: [
				{label: 'Share', action: actions.shareFiles},
				{label: state.recording ? 'Stop Screen Recording' : 'Screen Recording', action: state.recording ? actions.stopScreenRecording : actions.startScreenRecording}
			]}
		];
	}

	function updateRecordingTimer () {
		if (!state.recording) return;
		var elapsed = Date.now() - state.recording.startTime;
		var totalSec = Math.floor(elapsed / 1000);
		var h = Math.floor(totalSec / 3600);
		var m = Math.floor((totalSec % 3600) / 60);
		var s = totalSec % 60;
		var pad = function (n) { return String(n).padStart(2, '0'); };
		ui.recordingTime.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
	}

	var resolutionMap = {
		'1080': {width: 1920, height: 1080},
		'720':  {width: 1280, height: 720},
		'480':  {width: 854,  height: 480}
	};

	async function doStartScreenRecording (settings) {
		state.dialog = null;
		renderOverlays();

		var videoConstraint;
		if (!settings.recordVideo) {
			videoConstraint = false;
		} else if (settings.resolution && resolutionMap[settings.resolution]) {
			var res = resolutionMap[settings.resolution];
			videoConstraint = {width: {ideal: res.width}, height: {ideal: res.height}};
		} else {
			videoConstraint = true;
		}

		var sysAudioConstraint = settings.recordSysAudio
			? {echoCancellation: false, noiseSuppression: false, autoGainControl: false}
			: false;

		var screenStream;
		try {
			screenStream = await navigator.mediaDevices.getDisplayMedia({
				video: videoConstraint,
				audio: sysAudioConstraint,
				selfBrowserSurface: 'include'
			});
		}
		catch (err) {
			reportFailure('Could not start screen capture', err);
			return;
		}

		var micStream = null;
		if (settings.recordMic) {
			try {
				micStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
			}
			catch (err) {
				// Mic is optional — continue without it
			}
		}

		var composedStream = new MediaStream();
		screenStream.getVideoTracks().forEach(function (track) {
			composedStream.addTrack(track);
		});

		var audioContext, audioDestination, mediaRecorder;
		try {
			var hasAudio = (settings.recordSysAudio && screenStream.getAudioTracks().length > 0) ||
				(micStream && micStream.getAudioTracks().length > 0);

			if (hasAudio) {
				audioContext = new AudioContext();
				await audioContext.resume();
				audioDestination = audioContext.createMediaStreamDestination();

				if (settings.recordSysAudio && screenStream.getAudioTracks().length > 0) {
					var systemSource = audioContext.createMediaStreamSource(screenStream);
					var systemGain = audioContext.createGain();
					systemGain.gain.value = 1.0;
					systemSource.connect(systemGain).connect(audioDestination);
				}

				if (micStream && micStream.getAudioTracks().length > 0) {
					var micSource = audioContext.createMediaStreamSource(micStream);
					var micGain = audioContext.createGain();
					micGain.gain.value = 1.0;
					micSource.connect(micGain).connect(audioDestination);
				}

				audioDestination.stream.getAudioTracks().forEach(function (track) {
					composedStream.addTrack(track);
				});
			}

			var recorderOptions = {mimeType: settings.mimeType};
			if (settings.videoBitrate) recorderOptions.videoBitsPerSecond = parseInt(settings.videoBitrate, 10);
			mediaRecorder = new MediaRecorder(composedStream, recorderOptions);
		}
		catch (err) {
			screenStream.getTracks().forEach(function (t) { t.stop(); });
			if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
			reportFailure('Could not start the recording', err);
			return;
		}

		var isWebm = settings.mimeType.startsWith('video/webm');
		var ext = isWebm ? '.webm' : '.mp4';
		var chunks = [];

		mediaRecorder.ondataavailable = function (e) {
			if (e.data && e.data.size > 0) chunks.push(e.data);
		};

		mediaRecorder.onstop = async function () {
			var blob = new Blob(chunks, {type: chunks[0] ? chunks[0].type : settings.mimeType});
			var duration = state.recording ? Date.now() - state.recording.startTime : 0;
			if (isWebm && duration > 0 && typeof window.ysFixWebmDuration === 'function') {
				try { blob = await window.ysFixWebmDuration(blob, duration); } catch (e) { /* use original blob */ }
			}
			var now = new Date();
			var pad = function (n) { return String(n).padStart(2, '0'); };
			var name = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '-' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + ext;
			// Awaited: onFileHandler can prompt, and stopScreenRecording re-renders the
			// overlays -- which would tear the prompt down before it was answered.
			await onFileHandler(blobToFile(blob, name));
			actions.stopScreenRecording(true);
		};

		// Auto-stop when user closes browser's "Stop sharing" dialog
		screenStream.getVideoTracks().forEach(function (track) {
			track.onended = function () {
				if (state.recording && state.recording.mediaRecorder.state !== 'inactive') {
					state.recording.mediaRecorder.stop();
				}
			};
		});

		try {
			mediaRecorder.start(1000);
		}
		catch (err) {
			screenStream.getTracks().forEach(function (t) { t.stop(); });
			if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
			reportFailure('Could not start the recorder', err);
			return;
		}

		state.recording = {
			mediaRecorder: mediaRecorder,
			chunks: chunks,
			startTime: Date.now(),
			timerInterval: setInterval(updateRecordingTimer, 1000),
			screenStream: screenStream,
			micStream: micStream,
			micMuted: false,
			sysMuted: false
		};

		ui.recordingTime.textContent = '00:00:00';
		ui.recordingMicBtn.classList.remove('Explorer__recordingBtn--muted');
		ui.recordingMicBtn.title = 'Mute microphone';
		ui.recordingSysBtn.classList.remove('Explorer__recordingBtn--muted');
		ui.recordingSysBtn.title = 'Mute system audio';
		ui.recordingIndicator.hidden = false;
	}

	var actions = {
		startScreenRecording: function () {
			if (state.recording) {
				openInfoDialog('Screen Recording', 'Recording is already in progress.');
				return;
			}
			openDialog({type: 'screenRecordingOptions', onSubmit: doStartScreenRecording});
		},

		stopScreenRecording: function (fromOnstop) {
			if (!state.recording) return;
			if (!fromOnstop && state.recording.mediaRecorder.state !== 'inactive') {
				state.recording.mediaRecorder.stop();
				// onstop will call stopScreenRecording(true) to finish cleanup
				return;
			}
			clearInterval(state.recording.timerInterval);
			if (state.recording.screenStream) {
				state.recording.screenStream.getTracks().forEach(function (t) { t.stop(); });
			}
			if (state.recording.micStream) {
				state.recording.micStream.getTracks().forEach(function (t) { t.stop(); });
			}
			ui.recordingIndicator.hidden = true;
			state.recording = null;
		},

		toggleMicMute: function () {
			if (!state.recording) return;
			state.recording.micMuted = !state.recording.micMuted;
			if (state.recording.micStream) {
				state.recording.micStream.getAudioTracks().forEach(function (t) {
					t.enabled = !state.recording.micMuted;
				});
			}
			ui.recordingMicBtn.classList.toggle('Explorer__recordingBtn--muted', state.recording.micMuted);
			ui.recordingMicBtn.title = state.recording.micMuted ? 'Unmute microphone' : 'Mute microphone';
		},

		toggleSysMute: function () {
			if (!state.recording) return;
			state.recording.sysMuted = !state.recording.sysMuted;
			if (state.recording.screenStream) {
				state.recording.screenStream.getAudioTracks().forEach(function (t) {
					t.enabled = !state.recording.sysMuted;
				});
			}
			ui.recordingSysBtn.classList.toggle('Explorer__recordingBtn--muted', state.recording.sysMuted);
			ui.recordingSysBtn.title = state.recording.sysMuted ? 'Unmute system audio' : 'Mute system audio';
		},

		open: function (itemPath, forcedApp) {
			var item = getItemByPath(itemPath);
			if (!item) return;

			if (item.isDirectory) {
				if (forcedApp && forcedApp !== 'explorer') {
					parent.openPath(item.path, forcedApp);
					return;
				}
				navigateTo(item.path);
				return;
			}
			parent.openFile(item.path, forcedApp);
		},

		// The clipboard from inside an iframe is the trap here: it needs a secure context,
		// it needs a gesture, and it can simply be refused. A copy that silently did
		// nothing is worse than no menu entry at all, so a refusal falls back to showing
		// the text already selected -- a copy you can finish by hand.
		copyPath: async function (itemPath) {
			var paths = itemPath
				? [itemPath]
				: getSelectedItems().map(function (entry) { return entry.path; });
			if (!paths.length) {
				return;
			}
			var text = paths.join('\n');
			if (await copyTextToClipboard(text)) {
				return;
			}
			openDialog({
				type: 'copyText',
				title: paths.length > 1 ? 'Copy paths' : 'Copy path',
				text: text
			});
		},

		addToBookmarks: async function (itemPath) {
			var item = getItemByPath(itemPath || Array.from(state.selectedPaths)[0]);
			if (!item || typeof parent.addBookmark !== 'function') {
				return;
			}
			// The shell reports what happened, including "already bookmarked", so there
			// is one surface for it rather than two that can disagree.
			await parent.addBookmark({
				title: item.name,
				url: item.path,
				// A trailing slash is what tells Bookmarks to open it with Explorer
				// rather than as a file. Explorer is the one that knows which it is.
				directory: item.isDirectory
			});
		},

		// The dialog itself is the shell's (js/shell/open-with.js), the same one a file
		// with no default app raises. Explorer used to draw its own, and the two came up
		// in nearly the same situation looking nothing alike -- only one of them knew
		// about the browser tab, and only one of them had keyboard picking. What stays
		// here is what only Explorer knows: that a folder can be navigated to in place,
		// and that several files can be opened at once.
		// `target` is a path when a row menu opened this, and the selection may still
		// override it -- several files at once are opened together. It is an *item* when
		// the caller already knows what it means and the selection is not it: the
		// empty-area menu acts on the folder you are looking at, and a file left
		// highlighted inside that folder must not quietly take its place.
		openWith: async function (target) {
			var subject = (target && typeof target === 'object') ? target : null;
			var selectedFiles = subject ? [] : getSelectedItems().filter(function (entry) {
				return !entry.isDirectory;
			});
			var items;
			if (selectedFiles.length > 1) {
				items = selectedFiles;
			}
			else {
				var item = subject || getItemByPath(target || Array.from(state.selectedPaths)[0]);
				if (!item) {
					return;
				}
				items = [item];
			}

			if (typeof parent.openWithChooser !== 'function') {
				report('Open with needs PixOS', 'This window is not running inside the '
					+ 'PixOS shell, so there is nothing to list the apps.', 'warn');
				return;
			}

			var apps = await getOpenWithAppsForItems(items);
			var fileItems = items.filter(function (entry) { return !entry.isDirectory; });
			var extensions = fileItems.map(function (entry) {
				return getSpecificExtension(entry.path);
			}).filter(Boolean);
			var uniqueExtensions = extensions.filter(function (ext, index) {
				return extensions.indexOf(ext) === index;
			});
			// Only ever offered for one file: an association is one extension to one app,
			// and "remember this for all five of these" is not a thing it can express.
			var extension = (fileItems.length === 1 && uniqueExtensions.length === 1)
				? uniqueExtensions[0]
				: '';

			// The chooser promises never to be empty, and for one file it keeps that
			// promise itself — the browser tab and the plain window are always there.
			// For a folder, or for several files with nothing in common, there is
			// nothing universal to fall back on, so the empty case is answered here
			// instead of being shown as a dialog with no rows in it.
			var universal = items.length === 1 && !items[0].isDirectory;
			if (!apps.length && !universal) {
				report('Nothing can open all of these',
					items.length > 1
						? 'No installed app takes every one of the ' + items.length + ' files selected. '
							+ 'Try them one at a time.'
						: 'No installed app can open a folder.',
					'warn');
				return;
			}

			state.dialog = null;
			renderOverlays();

			var picked = await parent.openWithChooser({
				paths: items.map(function (entry) { return entry.path; }),
				apps: apps,
				extension: extension,
				title: items.length > 1
					? 'Open ' + items.length + ' files with...'
					: 'Open with...',
				subtitle: items.length === 1 ? items[0].path : items.length + ' files',
				// Neither route means anything for a folder, and for several files at
				// once they would each need a tab or a window of their own.
				universal: universal,
				extras: [
					{
						label: 'App Manager',
						run: function () {
							// An installed app, opened as one.
							if (typeof parent.openApp === 'function') {
								parent.openApp('app-manager');
							}
							else {
								parent.openFile('/apps/app-manager/index.html');
							}
						}
					},
					{
						label: 'Manage Defaults',
						run: function () {
							actions.manageDefaultApps(extension);
						}
					}
				]
			});
			if (!picked) {
				return;
			}
			// Installing the app and remembering the choice already happened in the
			// shell; what is left is the opening, which is the part Explorer knows how
			// to do differently.
			if (picked.kind === parent.OPEN_WITH_BROWSER_TAB) {
				parent.openInBrowserTab(items[0].path);
				return;
			}
			if (picked.kind === parent.OPEN_WITH_RAW_WINDOW) {
				parent.openRawFile(items[0].path);
				return;
			}
			if (items[0].isDirectory && items.length === 1) {
				if (picked.appId === 'explorer') {
					// Navigating to the folder this window is already showing does
					// nothing, and a chooser entry that does nothing reads as broken.
					// Asked from inside it, *Explorer* means another one.
					if (items[0].path === state.cwd) {
						parent.openPath(items[0].path, 'new explorer');
					}
					else {
						navigateTo(items[0].path);
					}
				}
				else {
					parent.openPath(items[0].path, picked.appId);
				}
				return;
			}
			if (fileItems.length > 1 && typeof parent.openFiles === 'function') {
				parent.openFiles(fileItems.map(function (entry) {
					return entry.path;
				}), picked.appId);
				return;
			}
			if (fileItems.length === 1) {
				parent.openFile(fileItems[0].path, picked.appId);
			}
		},

		manageDefaultApps: async function (prefillExtension) {
			openDialog(await buildDefaultAppsManagerDialog(prefillExtension));
		},

		createFile: function () {
			openDialog({
				type: 'newFile',
				onSubmit: async function (payload) {
					state.dialog = null;
					renderOverlays();
					var ab = await new File([payload.content || ''], payload.name).arrayBuffer();
					await writeNewFile(state.cwd, payload.name, Buffer.from(ab));
					await refreshCurrentDir(false);
				}
			});
		},

		createFolder: function () {
			openDialog({
				type: 'newFolder',
				onSubmit: async function (name) {
					state.dialog = null;
					renderOverlays();
					var target = path.join(state.cwd, name);
					// mkdir on an existing name is an error rather than a silent no-op, and
					// an unhandled one looked like the button doing nothing.
					if (await stat(target)) {
						report('Create folder', '"' + name + '" already exists in ' + state.cwd + '.', 'warn');
						return;
					}
					await mkdir(target);
					await refreshCurrentDir(false);
				}
			});
		},

		addOnlineFile: function () {
			openDialog({
				type: 'onlineFile',
				onSubmit: async function (payload) {
					state.dialog = null;
					renderOverlays();

					// The original had no catch and never checked response.ok, so a 404 or a
					// CORS block closed the dialog and did nothing whatsoever. Both are the
					// ordinary outcomes of typing a URL, not exceptional ones.
					var response;
					try {
						response = await fetch(payload.url);
					}
					catch (err) {
						reportFetchFailure(payload.url, {error: err});
						return;
					}
					if (!response.ok) {
						reportFetchFailure(payload.url, {response: response});
						return;
					}

					var ab = await response.arrayBuffer();
					var name = payload.name || getNameByPath(decodeURIComponent(payload.url));
					await writeNewFile(state.cwd, name, Buffer.from(ab));
					await refreshCurrentDir(false);
				}
			});
		},

		rename: function (itemPath) {
			var item = getItemByPath(itemPath || Array.from(state.selectedPaths)[0]);
			if (!item) return;
			openDialog({
				type: 'rename',
				oldName: item.name,
				onSubmit: async function (newName) {
					// The same name is a no-op, not an error -- close, exactly as Cancel
					// would. Leaving the dialog up made it look like the button was dead.
					if (!newName || newName === item.name) {
						state.dialog = null;
						renderOverlays();
						return;
					}
					state.dialog = null;
					renderOverlays();
					try {
						// fsRename does not fail on an occupied name, it replaces what is
						// there -- so renaming onto an existing file used to destroy it
						// silently. There is no error to catch; the question has to be
						// asked first, the same one a paste asks.
						var resolved = await resolveIncomingDestination(
							newName, path.dirname(item.path), 'rename', item.isDirectory);
						if (!resolved) {
							return;
						}
						if (resolved.replaceExisting) {
							await unlink(resolved.destPath);
						}
						await fsRename(item.path, resolved.destPath);
					}
					catch (err) {
						// Thrown straight to the action wrapper, which translates the errno
						// and raises a notification. Catching it here to build a dialog by
						// hand is what put a raw "ENOENT: No such file or directory." on
						// screen -- the errno translation lives one level up.
						throw err;
					}
					await refreshCurrentDir(false);
				}
			});
		},

		deleteSelected: function () {
			var targets = getSelectedItems();
			if (!targets.length) return;
			openDialog({
				type: 'confirmDelete',
				items: targets,
				onSubmit: async function () {
					state.dialog = null;
					renderOverlays();
					try {
						await Promise.all(targets.map(function (item) {
							return unlink(item.path);
						}));
					}
					catch (err) {
						// Same reasoning as rename: the wrapper translates and reports.
						throw err;
					}
					state.selectedPaths = new Set();
					await refreshCurrentDir(false);
				}
			});
		},

		downloadSelected: async function () {
			var targets = getSelectedItems().filter(function (item) { return !item.isDirectory; });
			await Promise.all(targets.map(async function (item) {
				var contents = await readFile(item.path);
				downloadBlob(new Blob([contents]), item.name);
			}));
		},

		getHashSHA1: async function () {
			var targets = getSelectedItems().filter(function (item) { return !item.isDirectory; });
			if (!targets.length) return;
			var lines = [];
			for (var i = 0; i < targets.length; i++) {
				var contents = await readFile(targets[i].path);
				var hashBuffer = await crypto.subtle.digest('SHA-1', contents);
				var hashArray = Array.from(new Uint8Array(hashBuffer));
				var hashHex = hashArray.map(function (b) {
					return b.toString(16).padStart(2, '0');
				}).join('');
				lines.push(targets[i].name + ': ' + hashHex);
			}
			openInfoDialog('SHA1', lines.join('\n'));
		},

		// One entry, one dialog, for every format 7-Zip reads. There were two before --
		// *Extract*, which only ever understood zip, and *Extract 7z*, which did not
		// extract at all: it unpacked the archive and re-packed the contents as a zip
		// beside it, leaving you a second job to do by hand.
		extract: async function (itemPath) {
			var item = getItemByPath(itemPath || Array.from(state.selectedPaths)[0]);
			if (!item || item.isDirectory) {
				return;
			}
			await openArchiveDialog(item);
		},

		// The other half of the engine. Acts on the selection, or on the row it was
		// opened from -- a folder, a file, or a dozen of both.
		compress: function (itemPath) {
			var items = getSelectedItems();
			if (!items.length || (itemPath && !state.selectedPaths.has(itemPath))) {
				var single = getItemByPath(itemPath);
				items = single ? [single] : [];
			}
			if (!items.length) {
				return;
			}
			openCompressDialog(items);
		},

		// Several at once: no listing and no subset, because a dialog per archive is not
		// an answer to "extract these five". A locked one is reported rather than
		// silently skipped, and says how to deal with it.
		extractSelected: async function () {
			var targets = getSelectedItems().filter(function (item) {
				return !item.isDirectory;
			});
			if (!targets.length) {
				return;
			}
			if (targets.length === 1) {
				await openArchiveDialog(targets[0]);
				return;
			}

			var engine;
			try {
				engine = await loadArchiveEngine();
			}
			catch (err) {
				reportArchiveFailure('The archive engine could not be loaded', err);
				return;
			}

			var done = [];
			var locked = [];
			var failed = [];
			for (var i = 0; i < targets.length; i++) {
				try {
					var bytes = await readFile(targets[i].path);
					var result = await engine.extract(bytes, {name: targets[i].name});
					await writeExtracted(targets[i].name, result);
					done.push(targets[i].name);

			if (typeof Peer === 'undefined') {
				// It ships with PixOS now, so this is a broken install rather than a

				// message you can act on and one you cannot.

			if (state.shares[sharePath]) {

				openDialog({type: 'share', sharePath: sharePath, peerId: existing.peerId, dataUrl: existing.dataUrl});
				return;
			}

				var share = state.shares[sharePath];
				if (!share) return;
				share.connections.push(conn);
				updateShareConnCount();

				conn.on('open', function () {
					updateShareConnCount();
				});

					if (!msg || typeof msg !== 'object') return;

					if (msg.type === 'hello') {
						var clientUI = buildClientUI();
						conn.send({type: 'ui', html: clientUI.html, js: clientUI.js});
						var files = await getShareFileList(sharePath);
						conn.send({type: 'fileList', files: files});
						if (msg.name) conn._peerName = msg.name;
					}
					else if (msg.type === 'refreshFileList') {
						var freshFiles = await getShareFileList(sharePath);
						conn.send({type: 'fileList', files: freshFiles});
					}
					else if (msg.type === 'requestFile') {
						var fileName = String(msg.name || '');
						var filePath = path.join(sharePath, fileName);
						if (path.dirname(filePath) !== normalizePath(sharePath)) return;

							var content = await readFile(filePath);

								var ab = content.buffer ? content.buffer.slice(content.byteOffset, content.byteOffset + content.byteLength) : content;

								conn.send(new Blob([ab]));

							console.error('Share file read error:', err);
							conn.send({type: 'error', message: 'Failed to read file: ' + fileName});
						}
					}

						var chatText = String(msg.text || '').substring(0, 2000);
						var chatName = String(msg.name || 'Guest').substring(0, 50);
						var chatPeerId = String(msg.peerId || conn.peer);
						var share = state.shares[sharePath];
						if (!share) return;
						if (!share.chatLog) share.chatLog = [];
						var entry = {name: chatName, text: chatText, color: peerIdToColor(chatPeerId)};
						share.chatLog.push(entry);
						var broadcast = {type: 'chat', text: chatText, name: chatName, peerId: chatPeerId};
						share.connections.forEach(function (c) { if (c !== conn) try { c.send(broadcast); } catch (e) {} });

					if (share) share.connections = share.connections.filter(function (c) { return c !== conn; });
					updateShareConnCount();
				});
			});

			peer.on('error', function (err) {
				console.error('PeerJS error:', err);
			});

	// Wrapped once, here, rather than each action growing its own try/catch. Most of these
	// are async and most had no catch at all, so a failed write, a refused rename or a
	// download that never arrived resolved into nothing: no message, no change on screen,
	// and an unhandled rejection in a console nobody has open.
	//
	// An action that handles its own errors never reaches this. An action added later gets
	// the reporting whether or not its author thought about it, which is the whole point --
	// the failure mode being designed out is "someone forgot".
	Object.keys(actions).forEach(function (name) {
		if (typeof actions[name] === 'function') {
			actions[name] = guarded(actions[name], readableActionName(name));
		}
	});

	// Runs `fn` and reports whatever it throws -- synchronously or as a rejected promise --
	// under `label`, rather than letting it disappear.
	function guarded (fn, label) {
		return function () {
			var result;
			try {
				result = fn.apply(this, arguments);
			}
			catch (err) {
				reportFailure(label, err);
				return;
			}
			if (result && typeof result.then === 'function') {
				return result.catch(function (err) {
					reportFailure(label, err);
				});
			}
			return result;
		};
	}

	// The last resort, for what neither wrapper covers: a listener, a timer, a promise
	// nobody awaited. The shell's own handlers cannot see any of it -- a rejection inside
	// an app fires on that app's window, not on the shell's -- so Explorer has to catch
	// its own or it stays a console line, which is the thing this phase exists to end.
	window.addEventListener('unhandledrejection', function (e) {
		reportFailure('Something went wrong in Explorer', e.reason);
	});

	window.addEventListener('error', function (e) {
		// A missing image in a folder listing fires this too, with no error object. Not
		// worth interrupting anyone for.
		if (!e.error) {
			return;
		}
		reportFailure('Something went wrong in Explorer', e.error);
	});

	// Prefers the shell's notification layer, which does not steal the focus and stacks
	// when several things fail. Standalone -- Explorer opened directly in a tab -- there is
	// no shell, so it falls back to its own dialog rather than to silence.
	//
	// Everything Explorer reports goes through here. A call site that reaches for
	// openInfoDialog directly gets a modal where the rest of the system gets a card, and
	// skips the errno translation with it -- which is how a raw ENOENT reached the screen.
	function report (title, message, level, actions) {
		try {
			if (parent !== window && typeof parent.notify === 'function') {
				parent.notify({
					level: level || 'error',
					title: title,
					message: message,
					source: 'Explorer',
					actions: actions || []
				});
				return;
			}
		}
		catch (crossOrigin) {
			// Not our parent. Fall through to the dialog.
		}
		openInfoDialog(title, message);
	}

	// Two attempts and then an honest surrender. The async API is the right one and is
	// what a modern browser grants; execCommand still works in places it does not --
	// notably an iframe without clipboard permission, which is exactly what Explorer is.
	async function copyTextToClipboard (text) {
		try {
			if (navigator.clipboard && navigator.clipboard.writeText) {
				await navigator.clipboard.writeText(text);
				return true;
			}
		}
		catch (err) {
			console.warn('Explorer: the clipboard refused a write', err);
		}
		try {
			var area = document.createElement('textarea');
			area.value = text;
			area.setAttribute('readonly', '');
			area.style.position = 'fixed';
			area.style.top = '-1000px';
			document.body.appendChild(area);
			area.select();
			var copied = document.execCommand('copy');
			area.remove();
			return !!copied;
		}
		catch (fallbackErr) {
			return false;
		}
	}

	// What to tell someone to press. Not a capability check -- purely which keyboard is
	// under their hands.
	function copyChordLabel () {
		return /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || '')
			? 'Cmd+C'
			: 'Ctrl+C';
	}

	function reportFailure (label, err) {
		console.error('Explorer: ' + label, err);
		var described = describeFailure(label, err);
		report(described.title, described.message);
	}

	// A download that did not happen, explained. The classification lives in the shell
	// (js/shell/failure.js) because an app cannot import shell modules -- so this asks the
	// parent, and degrades to the raw message when there is no parent to ask.
	function reportFetchFailure (url, outcome) {
		var described;
		try {
			if (parent !== window && typeof parent.describeFetchFailure === 'function') {
				described = parent.describeFetchFailure(Object.assign({
					url: url,
					context: 'Could not download that file'
				}, outcome));
			}
		}
		catch (crossOrigin) {
			described = null;
		}
		if (!described) {
			described = {
				title: 'Could not download that file',
				message: outcome.response
					? 'The server answered with ' + outcome.response.status + '.'
					: String(outcome.error && outcome.error.message ? outcome.error.message : outcome.error)
			};
		}

		var actions = [{
			label: 'Open in a browser tab',
			run: function () {
				window.open(url, '_blank', 'noopener');
			}
		}];

		try {
			if (parent !== window && typeof parent.notify === 'function') {
				parent.notify({
					level: 'error',
					title: described.title,
					message: described.message + '\n\n' + url,
					source: 'Explorer',
					actions: actions
				});
				return;
			}
		}
		catch (crossOrigin) {
			// Fall through to the dialog.
		}
		openInfoDialog(described.title, described.message + '\n\n' + url);
	}

	function describeFailure (context, err) {
		try {
			if (parent !== window && typeof parent.describeError === 'function') {
				return parent.describeError(context, err);
			}
		}
		catch (crossOrigin) {
			// Fall through.
		}
		return {title: context, message: String(err && err.message ? err.message : err)};
	}

	// 'downloadSelected' -> 'Download selected failed'. Better than the raw key, and it
	// costs nothing to be readable about which thing went wrong.
	function readableActionName (name) {
		var words = String(name).replace(/([A-Z])/g, ' $1').toLowerCase().trim();
		return words.charAt(0).toUpperCase() + words.slice(1) + ' failed';
	}

	function peerIdToColor (id) {
		var hash = 0;
		for (var i = 0; i < id.length; i++) { hash = id.charCodeAt(i) + ((hash << 5) - hash); }
		var hue = ((hash % 360) + 360) % 360;
		return 'hsl(' + hue + ', 70%, 65%)';
	}

	function isTextExtension (fileName) {
		var textExts = ['txt', 'md', 'json', 'js', 'mjs', 'ts', 'css', 'html', 'htm', 'xml', 'csv', 'log', 'yaml', 'yml', 'ini', 'cfg', 'conf', 'sh', 'bat', 'cmd', 'py', 'rb', 'java', 'c', 'h', 'cpp', 'hpp', 'rs', 'go', 'toml', 'env', 'svg', 'sql', 'php', 'pl', 'lua', 'r', 'jsx', 'tsx', 'vue', 'svelte', 'less', 'scss', 'sass', 'styl', 'coffee', 'diff', 'patch', 'gitignore', 'editorconfig', 'htaccess', 'properties', 'gradle', 'makefile', 'dockerfile'];
		var ext = (fileName.split('.').pop() || '').toLowerCase();
		return textExts.indexOf(ext) !== -1;
	}

	function isImageExtension (fileName) {
		var imgExts = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp', 'ico', 'svg', 'avif', 'tiff', 'tif'];
		var ext = (fileName.split('.').pop() || '').toLowerCase();
		return imgExts.indexOf(ext) !== -1;
