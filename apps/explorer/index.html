<html lang="en">
<head>
	<script>
		(function () {
			var FILES3_CONFIG_KEY = 'pixos_files3_config';
			var token = new URLSearchParams(location.search).get('token');
			if (!token) return;

			function resolveFiles3LocalStorageId () {
				var lsId = 'files3_token_storage';
				try {
					var raw = localStorage.getItem(FILES3_CONFIG_KEY);
					if (!raw) return lsId;
					var cfg = JSON.parse(raw);
					if (cfg && cfg.localStorageId) {
						return cfg.localStorageId;
					}
					if (cfg && cfg.baseUrl) {
						return 'files3_token_' + (new URL(cfg.baseUrl).hostname || 'storage');
					}
				} catch (e) { /* ignore */ }
				return lsId;
			}

			try {
				localStorage.setItem(resolveFiles3LocalStorageId(), token);
			} catch (e) { /* ignore */ }

			try {
				history.replaceState(null, '', location.pathname + location.hash);
			} catch (e) { /* ignore */ }

			if (window.opener) {
				try {
					window.opener.postMessage({ type: 'files3-token', token: token }, location.origin);
				} catch (e) { /* ignore */ }
				window.close();
			}
		})();
	</script>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Explorer</title>
	<style>
		:root {
			--bg: #101319;
			--panel: #1a1c1f;
			--panel-2: #202327;
			--line: #34383f;
			--text: #e4e4e4;
			--muted: #adadad;
			--accent: #8d9664;
			--danger: #f25f5c;
			--hover: #2d3238;
			--selected: #30353b;
			--shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
		}

		body {
			margin: 0;
			background: radial-gradient(circle at 0% 0%, #242526 0%, #101319 38%);
			color: var(--text);
			font-family: "Segoe UI", "Noto Sans", sans-serif;
			overflow: hidden;
		}

		#explorer {
			height: 100%;
		}

		.Explorer {
			height: 100%;
			display: grid;
			grid-template-rows: auto auto 1fr auto;
			background: rgba(16, 19, 25, 0.85);
		}

		.Explorer__toolbar {
			display: flex;
			gap: 4px;
			align-items: center;
			padding: 4px 6px;
			border-bottom: 1px solid var(--line);
			background: var(--panel);
		}

		.Explorer__toolbarGroup {
			display: flex;
			align-items: center;
			gap: 4px;
		}

		.Explorer__toolbarLabel {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 12px;
			color: var(--text);
			user-select: none;
		}

		.Explorer__toolbarGroup--grow {
			flex: 1;
			min-width: 0;
		}

		button,
		select,
		input,
		textarea {
			background: #24272c;
			border: 1px solid #3e424a;
			color: var(--text);
			border-radius: 0;
			font: inherit;
			font-size: 12px;
		}

		button,
		select,
		input {
			height: 24px;
			padding: 0 6px;
		}

		button {
			cursor: pointer;
		}

		button:hover:not(:disabled) {
			background: #2f3339;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.Explorer__danger {
			border-color: #6d3a3d;
			background: #4d2a2c;
		}

		.Explorer__breadcrumbs {
			display: flex;
			align-items: center;
			gap: 4px;
			overflow: auto hidden;
			white-space: nowrap;
			padding: 4px 6px;
			border-bottom: 1px solid var(--line);
			background: var(--panel-2);
		}

		.Explorer__crumb {
			padding: 2px 6px;
			border-radius: 0;
			cursor: pointer;
			color: #d0d0d0;
			font-size: 12px;
		}

		.Explorer__crumb:hover {
			background: var(--hover);
		}

		.Explorer__crumb--current {
			background: #2f333a;
			cursor: default;
		}

		.Explorer__body {
			display: grid;
			grid-template-columns: 160px 1fr;
			min-height: 0;
		}

		.Explorer__sidebar {
			border-right: 1px solid var(--line);
			padding: 4px;
			overflow: auto;
			background: #16181c;
		}

		.Explorer__sidebarTitle {
			font-size: 10px;
			text-transform: uppercase;
			color: var(--muted);
			margin: 4px;
		}

		.Explorer__sidebarItem {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 4px 6px;
			border-radius: 0;
			cursor: pointer;
			color: #d5d5d5;
			font-size: 12px;
		}

		.Explorer__sidebarItem:hover {
			background: var(--hover);
		}

		.Explorer__sidebarItem--active {
			background: #2f3339;
		}

		.Explorer__main {
			position: relative;
			overflow: auto;
			padding: 4px;
		}

		.Explorer__main--selecting {
			user-select: none;
		}

		.Explorer__table {
			width: 100%;
			border-collapse: collapse;
		}

		.Explorer__table thead {
			position: sticky;
			top: 0;
			z-index: 1;
		}

		.Explorer__table th {
			text-align: left;
			background: #1f2228;
			padding: 5px 6px;
			font-size: 12px;
			font-weight: 600;
			border-bottom: 1px solid var(--line);
			cursor: pointer;
			user-select: none;
		}

		.Explorer__table td {
			padding: 4px 6px;
			border-bottom: 1px solid rgba(82, 87, 96, 0.35);
			font-size: 12px;
		}

		.Explorer__selectCol {
			width: 32px;
			text-align: center;
		}

		.Explorer__row {
			cursor: default;
		}

		.Explorer__row:hover {
			background: rgba(52, 58, 66, 0.5);
		}

		.Explorer__row--selected {
			background: var(--selected);
		}

		.Explorer__nameCell {
			display: flex;
			align-items: center;
			gap: 4px;
			min-width: 0;
		}

		.Explorer__check {
			width: 14px;
			height: 14px;
			padding: 0;
			margin: 0;
			accent-color: var(--accent);
			cursor: pointer;
		}

		.Explorer__grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
			gap: 8px;
			padding-top: 4px;
		}

		.Explorer__card {
			border: 1px solid transparent;
			background: transparent;
			padding: 8px 6px;
			cursor: default;
			display: grid;
			justify-items: center;
			gap: 6px;
			min-height: 120px;
			position: relative;
		}

		.Explorer__card:hover {
			border-color: #4d525b;
			background: rgba(52, 58, 66, 0.45);
		}

		.Explorer__card--selected {
			background: var(--selected);
		}

		.Explorer__cardIcon {
			font-size: 36px;
			line-height: 1;
		}

		.Explorer__cardCheck {
			position: absolute;
			top: 6px;
			left: 6px;
			z-index: 1;
		}

		.Explorer__cardName {
			font-size: 12px;
			text-align: center;
			word-break: break-word;
		}

		.Explorer__dropTarget {
			outline: 1px solid var(--accent);
			outline-offset: -1px;
		}

		.Explorer__nameText {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.Explorer__muted {
			color: var(--muted);
		}

		.Explorer__empty {
			padding: 10px;
			color: var(--muted);
			font-size: 12px;
		}

		.Explorer__selectionBox {
			position: absolute;
			display: none;
			border: 1px solid rgba(141, 150, 100, 0.95);
			background: rgba(141, 150, 100, 0.18);
			pointer-events: none;
			z-index: 20;
		}

		.Explorer__status {
			border-top: 1px solid var(--line);
			background: var(--panel);
			padding: 4px 6px;
			font-size: 12px;
			color: #d2d2d2;
		}

		.Explorer__recordingIndicator {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			margin-left: 6px;
			color: #ff4d4d;
			font-size: 13px;
		}

		.Explorer__recordingDot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: #ff4d4d;
			animation: Explorer__recordingPulse 1s infinite;
			flex-shrink: 0;
		}

		@keyframes Explorer__recordingPulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.3; }
		}

		.Explorer__recordingBtn {
			background: none;
			border: none;
			cursor: pointer;
			color: #ff4d4d;
			padding: 2px 4px;
			border-radius: 3px;
			line-height: 1;
			display: inline-flex;
			align-items: center;
			transition: color 0.15s, background 0.15s;
		}

		.Explorer__recordingBtn:hover {
			background: rgba(255, 255, 255, 0.1);
		}

		.Explorer__recordingBtn--muted {
			color: #666;
		}

		.ContextMenu {
			position: fixed;
			z-index: 1000;
			min-width: 220px;
			background: #23262b;
			border: 1px solid #434850;
			border-radius: 0;
			box-shadow: var(--shadow);
			padding: 6px;
		}

		.ContextMenu__list {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		.ContextMenu__item {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 5px 8px;
			border-radius: 0;
			font-size: 12px;
			cursor: pointer;
			color: #e4e4e4;
		}

		.ContextMenu__item:hover {
			background: #333840;
		}

		.ContextMenu__item--disabled,
		.ContextMenu__item--disabled:hover {
			opacity: 0.45;
			cursor: not-allowed;
			background: transparent;
		}

		.ContextMenu__separator {
			height: 1px;
			background: #424750;
			margin: 6px 4px;
		}

		.ContextMenu__submenu {
			display: none;
			position: absolute;
			left: calc(100% - 6px);
			top: -6px;
			min-width: 220px;
			background: #23262b;
			border: 1px solid #434850;
			border-radius: 0;
			box-shadow: var(--shadow);
			padding: 6px;
		}

		.ContextMenu__item:hover > .ContextMenu__submenu {
			display: block;
		}

		.Modal {
			position: fixed;
			inset: 0;
			background: rgba(2, 6, 12, 0.64);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1200;
		}

		.Modal__panel {
			width: min(560px, calc(100vw - 24px));
			background: #23262c;
			border: 1px solid #484d55;
			border-radius: 0;
			box-shadow: var(--shadow);
			display: grid;
			gap: 8px;
			padding: 10px;
		}

		.Modal__title {
			font-size: 14px;
			font-weight: 600;
		}

		.Modal__field {
			display: grid;
			gap: 4px;
		}

		.Modal__field label {
			font-size: 11px;
			color: #bdbdbd;
		}

		.Modal textarea {
			min-height: 120px;
			padding: 4px 6px;
			resize: vertical;
		}

		.Modal__buttons {
			display: flex;
			justify-content: flex-end;
			gap: 4px;
		}

		.Modal__list {
			max-height: 200px;
			overflow: auto;
			padding: 4px 6px;
			border: 1px solid #444a53;
			border-radius: 0;
			background: #1a1d22;
			font-size: 12px;
		}

		.Explorer__table[hidden],
		.Explorer__grid[hidden],
		.Explorer__empty[hidden],
		.Explorer__recordingIndicator[hidden] {
			display: none !important;
		}

		@media (max-width: 900px) {
			.Explorer__body {
				grid-template-columns: 1fr;
			}

			.Explorer__sidebar {
				display: none;
			}
		}
	</style>
</head>

<div id="explorer"></div>

<script src="../jszip.3.10.1.min.js"></script>
<script src="../file-type.19.0.0.js"></script>
<!-- Served by PixOS itself rather than by unpkg: this app is an iframe on the shell's own
     origin, so an absolute path reaches the same file index.html loads. Sharing used to be
     dead on an offline boot because of this one tag. The *guest* half below is still on a
     CDN, because the page it sends runs from a data: URL with no origin of its own to
     resolve against -- that whole design is replaced by the peer mount in a later phase. -->
<script src="/js/peerjs/peerjs.min.js"></script>
<script type="module">
// Only the rules -- which files are archives, what 7-Zip's output means. The engine
// itself is 1.4 MB of WebAssembly and is loaded on the first extraction, not here.
import * as archiveNames from "../7z/js/parse.js";

window.BrowserFS = parent.BrowserFS;

window.fs = parent.fs;
window.path = parent.path;
var Buffer = parent.Buffer;
window.mountManager = parent.mountManager;

// Explorer is not a standalone app and cannot become one: the filesystem it browses lives
// in the shell's window, not in BrowserFS where its own files are. Opened in a bare tab it
// used to boot anyway and die on the first readdir with "Cannot read properties of
// undefined" -- a stack trace where a sentence belongs.
if (!window.fs || !window.path) {
	document.body.innerHTML = ''
		+ '<div style="max-width:520px;margin:14vh auto;padding:0 24px;'
		+ 'font:14px/1.6 -apple-system,Arial,sans-serif;color:#dfe3ea;text-align:center">'
		+ '<h1 style="font-size:18px;margin:0 0 10px">Explorer needs the PixOS shell</h1>'
		+ '<p style="color:#939caa;margin:0 0 18px">It browses the filesystem that lives in '
		+ 'the shell&rsquo;s window, so there is nothing for it to show on its own.</p>'
		+ '<p><a style="color:#6fb3ff" href="/">Open PixOS</a></p></div>';
	document.body.style.background = '#14171c';
}
else {
	openExplorer();
}

(function () {
	var s = document.createElement('script');
	s.type = 'text/javascript';
	s.src = '../fix-webm-duration.js';
	document.body.append(s);
})();

fs.stat('/apps/ffmpeg.0.12.10/ffmpeg.js', function (err, stats) {
	if (stats) {
		var s = document.createElement('script');
		s.type = 'text/javascript';
		s.src = '../ffmpeg.0.12.10/ffmpeg.js';
		s.onload = function () {
			window.FFmpeg = FFmpegWASM.FFmpeg;
		};
		document.body.append(s);
	}
});

async function openExplorer () {
	var rootElem = document.querySelector('#explorer');
		var state = {
		cwd: getInitialCwd(),
		items: [],
		selectedPaths: new Set(),
		clipboard: null,
		lastSelectedPath: null,
		sort: {
			key: 'name',
			dir: 'asc'
		},
			viewMode: 'details',
		contextMenu: null,
		dialog: null,
		busy: false,
			pendingRefresh: null,
			historyBack: [],
			historyForward: [],
			dragPaths: [],
			dragHoverFolderPath: null,
			lastDragHoverFolderPath: null,
			dragDropHandled: false,
			dragCommitInProgress: false,
			dragOverCommitTimer: null,
			selectionBox: null,
			shares: {},
			hostName: 'Host',
			recording: null
		};

	var ui = {};

	renderLayout();
	bindEvents();
	await refreshCurrentDir(false);

	function renderLayout () {
		rootElem.innerHTML = `
		<div class="Explorer">
			<div class="Explorer__toolbar">
				<div class="Explorer__toolbarGroup">
					<button class="Explorer__back" title="Back">←</button>
					<button class="Explorer__forward" title="Forward">→</button>
					<button class="Explorer__up" title="Up">↑ Up</button>
				</div>
				<div class="Explorer__toolbarGroup">
					<button class="Explorer__new">New</button>
					<button class="Explorer__upload">Upload</button>
					<button class="Explorer__copy">Copy</button>
					<button class="Explorer__cut">Cut</button>
					<button class="Explorer__paste">Paste</button>
					<button class="Explorer__defaults">Default Apps</button>
					<button class="Explorer__share">Share</button>
					<label class="Explorer__toolbarLabel" title="Select all items in current folder">
						<input class="Explorer__selectAllToolbar Explorer__check" type="checkbox">
						<span>All</span>
					</label>
				</div>
				<div class="Explorer__toolbarGroup Explorer__toolbarGroup--grow">
					<select class="Explorer__viewMode">
						<option value="details">Details</option>
						<option value="grid">Grid</option>
					</select>
					<select class="Explorer__sortKey">
						<option value="name">Sort: Name</option>
						<option value="type">Sort: Type</option>
						<option value="mtime">Sort: Date</option>
						<option value="size">Sort: Size</option>
					</select>
					<button class="Explorer__refresh">Refresh</button>
					<span class="Explorer__recordingIndicator" hidden>
						<span class="Explorer__recordingDot"></span>
						<span class="Explorer__recordingTime">00:00:00</span>
						<button class="Explorer__recordingBtn Explorer__recordingMicBtn" title="Mute microphone"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V20H9v2h6v-2h-2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
						<button class="Explorer__recordingBtn Explorer__recordingSysBtn" title="Mute system audio"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
						<button class="Explorer__recordingBtn Explorer__recordingStop" title="Stop recording"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg></button>
					</span>
				</div>
				<input class="Explorer__fileInput" type="file" multiple hidden>
			</div>
			<div class="Explorer__breadcrumbs"></div>
			<div class="Explorer__body">
				<aside class="Explorer__sidebar"></aside>
				<main class="Explorer__main">
					<table class="Explorer__table">
						<thead>
							<tr>
								<th class="Explorer__selectCol"><input class="Explorer__selectAll Explorer__check" type="checkbox" aria-label="Select all"></th>
								<th data-sort-key="name">Name</th>
								<th data-sort-key="type">Type</th>
								<th data-sort-key="mtime">Modified</th>
								<th data-sort-key="size">Size</th>
							</tr>
						</thead>
						<tbody class="Explorer__rows"></tbody>
					</table>
					<div class="Explorer__grid" hidden></div>
					<div class="Explorer__empty" hidden>No items in this folder</div>
					<div class="Explorer__selectionBox"></div>
				</main>
			</div>
			<div class="Explorer__status"></div>
		</div>
		<div class="Explorer__overlays"></div>
		`;

		ui.back = rootElem.querySelector('.Explorer__back');
		ui.forward = rootElem.querySelector('.Explorer__forward');
		ui.up = rootElem.querySelector('.Explorer__up');
		ui.newBtn = rootElem.querySelector('.Explorer__new');
		ui.upload = rootElem.querySelector('.Explorer__upload');
		ui.copy = rootElem.querySelector('.Explorer__copy');
		ui.cut = rootElem.querySelector('.Explorer__cut');
		ui.paste = rootElem.querySelector('.Explorer__paste');
		ui.defaults = rootElem.querySelector('.Explorer__defaults');
		ui.selectAll = rootElem.querySelector('.Explorer__selectAll');
		ui.selectAllToolbar = rootElem.querySelector('.Explorer__selectAllToolbar');
		ui.fileInput = rootElem.querySelector('.Explorer__fileInput');
		ui.viewMode = rootElem.querySelector('.Explorer__viewMode');
		ui.sortKey = rootElem.querySelector('.Explorer__sortKey');
		ui.refresh = rootElem.querySelector('.Explorer__refresh');
		ui.recordingIndicator = rootElem.querySelector('.Explorer__recordingIndicator');
		ui.recordingTime = rootElem.querySelector('.Explorer__recordingTime');
		ui.recordingMicBtn = rootElem.querySelector('.Explorer__recordingMicBtn');
		ui.recordingSysBtn = rootElem.querySelector('.Explorer__recordingSysBtn');
		ui.recordingStop = rootElem.querySelector('.Explorer__recordingStop');
		ui.breadcrumbs = rootElem.querySelector('.Explorer__breadcrumbs');
		ui.sidebar = rootElem.querySelector('.Explorer__sidebar');
		ui.main = rootElem.querySelector('.Explorer__main');
		ui.rows = rootElem.querySelector('.Explorer__rows');
		ui.grid = rootElem.querySelector('.Explorer__grid');
		ui.table = rootElem.querySelector('.Explorer__table');
		ui.empty = rootElem.querySelector('.Explorer__empty');
		ui.selectionBox = rootElem.querySelector('.Explorer__selectionBox');
		ui.share = rootElem.querySelector('.Explorer__share');
		ui.status = rootElem.querySelector('.Explorer__status');
		ui.overlays = rootElem.querySelector('.Explorer__overlays');
	}

	function bindEvents () {
		ui.back.onclick = function () {
			if (!state.historyBack.length) return;
			state.historyForward.push(state.cwd);
			state.cwd = state.historyBack.pop();
			refreshCurrentDir(false);
		};

		ui.forward.onclick = function () {

		ui.main.addEventListener('mousedown', function (e) {

		ui.rows.addEventListener('dragstart', handleItemDragStart);
		ui.grid.addEventListener('dragstart', handleItemDragStart);
		ui.main.addEventListener('dragstart', handleItemDragStart);
		ui.rows.addEventListener('dragover', handleItemDragOver);
		ui.grid.addEventListener('dragover', handleItemDragOver);
		ui.main.addEventListener('dragover', handleItemDragOver);
		ui.rows.addEventListener('dragleave', handleItemDragLeave);
		ui.grid.addEventListener('dragleave', handleItemDragLeave);
		ui.main.addEventListener('dragleave', handleItemDragLeave);
		ui.rows.addEventListener('drop', handleItemDrop);
		ui.grid.addEventListener('drop', handleItemDrop);
		ui.main.addEventListener('drop', handleItemDrop);
		ui.rows.addEventListener('dragend', handleItemDragEnd);
		ui.grid.addEventListener('dragend', handleItemDragEnd);
		ui.main.addEventListener('dragend', handleItemDragEnd);

		document.addEventListener('click', function () {
			closeContextMenu();
		});

		// Every branch below acts on the current *selection*, so two things have to be true
		// before any of them may run: no dialog is open, and the keystroke was not meant
		// for a field. Both guards sit here rather than on each branch -- they used to be
		// repeated per branch and were missing from Delete and Enter, which meant deleting
		// a character while renaming deleted the file, and Enter both renamed and reopened
		// the old path. One guard cannot be forgotten on the next handler added below.
		document.addEventListener('keydown', function (e) {
			// Escape is the exception: closing whatever is open is exactly what it should
			// do while a dialog has the focus.
			if (e.key === 'Escape') {
				closeDialog(state.dialog && state.dialog.type === 'pasteConflict' ? 'cancel' : null);
				closeContextMenu();
				renderOverlays();
				return;
			}
			if (state.dialog || isEditableTarget(e.target)) {
				return;
			}

			if (e.key === 'Delete' && state.selectedPaths.size) {
				e.preventDefault();
				actions.deleteSelected();
			}
			if (e.key === 'Enter' && state.selectedPaths.size === 1) {
				e.preventDefault();
				var path = Array.from(state.selectedPaths)[0];
				actions.open(path);
			}
			if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
				e.preventDefault();
				setAllSelection(true);
			}
			if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
				e.preventDefault();
				actions.copySelected();
			}
			if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
				e.preventDefault();
				actions.cutSelected();
			}
			if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && hasInternalClipboard()) {
				e.preventDefault();
				actions.pasteClipboard();
			}
		});

		document.addEventListener('paste', async function (e) {
			if (isEditableTarget(e.target)) {
				return;
			}

			if (hasInternalClipboard() && !isEditableTarget(e.target)) {
				e.preventDefault();
				await actions.pasteClipboard();
				return;
			}

			e.preventDefault();

			var pastedText = e.clipboardData.getData('Text');
			if (pastedText.trim()) {
				var pastedTextBlob = new Blob([pastedText], {type: 'text/plain'});
				await onFileHandler(blobToFile(pastedTextBlob, 'pastedText.txt'));
			}

			if (e.clipboardData.files.length) {
				// Sequential for the same reason as the upload button above: one dialog.
				var pasted = Array.from(e.clipboardData.files);
				for (var i = 0; i < pasted.length; i++) {
					await onFileHandler(pasted[i]);
				}
			}

			await refreshCurrentDir(false);
		});

		document.addEventListener('dragover', function (e) {
			updateDragHoverFromPoint(e.clientX, e.clientY);
		});
		document.addEventListener('mouseup', function () {
			setTimeout(function () {
				commitPendingDragMove('mouseup-fallback');
			}, 0);
		});

		document.body.addEventListener('drop', function (e) {
			onDrop(e);
			document.body.classList.remove('Page--onDragOver');
			clearDropTargets();
		});

		document.body.addEventListener('dragover', function (e) {
			e.stopPropagation();
			e.preventDefault();
			e.dataTransfer.dropEffect = 'copy';
			document.body.classList.add('Page--onDragOver');
		});

		rootElem.querySelectorAll('th[data-sort-key]').forEach(function (th) {
			th.onclick = function () {
				var key = th.dataset.sortKey;
				if (state.sort.key === key) {
					state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
				}
				else {
					state.sort.key = key;
					state.sort.dir = 'asc';
				}
				ui.sortKey.value = state.sort.key;
				sortItems();
				renderRows();
			};
		});
	}

	function navigateTo (path, keepForwardHistory) {
		if (!path || path === state.cwd) return;
		state.historyBack.push(state.cwd);
		if (!keepForwardHistory) {
			state.historyForward = [];
		}
		state.cwd = normalizePath(path);
		refreshCurrentDir(false);
	}

	function withFsTimeout (promise, ms, label) {
		return Promise.race([
			promise,
			new Promise(function (_, reject) {
				setTimeout(function () {
					reject(new Error((label || 'Filesystem operation') + ' timed out after ' + ms + 'ms'));
				}, ms);
			})
		]);
	}

	async function refreshCurrentDir (keepSelection) {
		if (state.busy) {
			state.pendingRefresh = keepSelection;
			return;
		}
		state.busy = true;
		try {
			var previousSelection = keepSelection ? new Set(state.selectedPaths) : new Set();
			state.items = await withFsTimeout(listDirectory(state.cwd), 20000, 'Directory listing');
			sortItems();
			state.selectedPaths = new Set();
			state.lastSelectedPath = null;

			if (keepSelection) {
				state.items.forEach(function (item) {
					if (previousSelection.has(item.path)) {
						state.selectedPaths.add(item.path);
						state.lastSelectedPath = item.path;
					}
				});
			}

			renderBreadcrumbs();
			renderSidebar();
			renderRows();
			renderStatus();
			renderToolbarState();
		}
		catch (err) {
			reportFailure('Could not open that folder', err);
		}
		finally {
			state.busy = false;
			if (state.pendingRefresh !== null) {
				var pending = state.pendingRefresh;
				state.pendingRefresh = null;
				refreshCurrentDir(pending);
			}
		}
	}

	function sortItems () {
		var dirMul = state.sort.dir === 'asc' ? 1 : -1;
		state.items.sort(function (a, b) {
			if (a.isDirectory !== b.isDirectory) {
				return a.isDirectory ? -1 : 1;
			}

			if (state.sort.key === 'type') {
				var at = a.isDirectory ? 'dir' : getExt(a.name);
				var bt = b.isDirectory ? 'dir' : getExt(b.name);
				var tcmp = at.localeCompare(bt);
				if (tcmp) return tcmp * dirMul;
			}
			if (state.sort.key === 'mtime') {
				var mcmp = (a.mtimeTs - b.mtimeTs);
				if (mcmp) return mcmp * dirMul;
			}
			if (state.sort.key === 'size') {
				var scmp = (a.size - b.size);
				if (scmp) return scmp * dirMul;
			}

			return a.name.localeCompare(b.name) * dirMul;
		});
	}

	function renderToolbarState () {
		ui.back.disabled = !state.historyBack.length;
		ui.forward.disabled = !state.historyForward.length;
		ui.up.disabled = state.cwd === '/';
		ui.copy.disabled = !state.selectedPaths.size;
		ui.cut.disabled = !state.selectedPaths.size;
		ui.paste.disabled = !hasInternalClipboard();
		ui.sortKey.value = state.sort.key;
		ui.viewMode.value = state.viewMode;
		syncSelectAllUI();
	}

	function renderBreadcrumbs () {
		var segments = state.cwd.split('/').filter(Boolean);
		var crumbs = [{label: 'rootfs', path: '/'}];
		segments.forEach(function (segment, index) {
			crumbs.push({
				label: segment,
				path: '/' + segments.slice(0, index + 1).join('/')
			});
		});

		ui.breadcrumbs.innerHTML = '';
		crumbs.forEach(function (crumb, index) {
			var span = document.createElement('span');
			span.className = 'Explorer__crumb' + (index === crumbs.length - 1 ? ' Explorer__crumb--current' : '');
			span.dataset.path = crumb.path;
			span.textContent = crumb.label;
			ui.breadcrumbs.append(span);
			if (index < crumbs.length - 1) {
				var sep = document.createElement('span');
				sep.className = 'Explorer__muted';
				sep.textContent = '/';
				ui.breadcrumbs.append(sep);
			}
		});
	}

	function renderSidebar () {
		var quickItems = [
			{label: 'Root', path: '/'},
			{label: 'Apps', path: '/apps'},
			{label: 'Current', path: state.cwd},

		ui.sidebar.innerHTML = '<div class="Explorer__sidebarTitle">Quick access</div>';

		var sharedPaths = Object.keys(state.shares);
		if (sharedPaths.length) {

			shareTitle.textContent = 'Shared';

				row.className = 'Explorer__sidebarItem';

				row.append(label);
				row.append(stopBtn);
				ui.sidebar.append(row);
			});

		// Mounts section
		if (mountManager) {
			var mounts = mountManager.listMounts();
			if (mounts.length > 0) {

				mountTitle.textContent = 'Mounts';
				ui.sidebar.append(mountTitle);

				mounts.forEach(function (m) {

					var roLabel = m.readOnly ? ' [ro]' : '';
					var row = document.createElement('div');
					row.className = 'Explorer__sidebarItem' + (m.mountPoint === state.cwd ? ' Explorer__sidebarItem--active' : '');
					row.style.display = 'flex';
					row.style.justifyContent = 'space-between';
					row.style.alignItems = 'center';

					var label = document.createElement('span');
					label.dataset.path = m.mountPoint;
					label.style.cursor = 'pointer';
					label.textContent = typeIcon + ' ' + m.name + ' (' + m.mountPoint + ')' + roLabel;
					label.style.flex = '1';

			// Mount local folder button
			if (typeof window.showDirectoryPicker === 'function') {

			mountFiles3Btn.className = 'Explorer__sidebarItem';

			ui.sidebar.append(mountFiles3Btn);

	function renderRows () {
		ui.rows.innerHTML = '';
		ui.grid.innerHTML = '';
		ui.empty.hidden = !!state.items.length;

		ui.table.hidden = state.viewMode === 'grid';
		ui.grid.hidden = state.viewMode !== 'grid';

		state.items.forEach(function (item) {
			var tr = document.createElement('tr');
			tr.className = 'Explorer__row' + (state.selectedPaths.has(item.path) ? ' Explorer__row--selected' : '');
			tr.dataset.path = item.path;
			tr.dataset.type = item.isDirectory ? 'dir' : 'file';
			tr.draggable = true;
			tr.title = getItemTitle(item);

			var selectTd = document.createElement('td');
			selectTd.className = 'Explorer__selectCol';
			selectTd.innerHTML = '<input class="Explorer__itemCheckbox Explorer__check" type="checkbox" data-path="' + escapeAttr(item.path) + '"' + (state.selectedPaths.has(item.path) ? ' checked' : '') + ' aria-label="Select ' + escapeAttr(item.name) + '">';
			tr.append(selectTd);

			var nameTd = document.createElement('td');
			nameTd.innerHTML = `<div class="Explorer__nameCell"><span>${item.isDirectory ? '📁' : '📄'}</span><span class="Explorer__nameText">${escapeHtml(item.name)}</span></div>`;
			tr.append(nameTd);

			var typeTd = document.createElement('td');
			typeTd.textContent = item.isDirectory ? 'Folder' : (getExt(item.name) || 'File');
			tr.append(typeTd);

			var dateTd = document.createElement('td');
			dateTd.textContent = item.mtime;
			tr.append(dateTd);

			var sizeTd = document.createElement('td');
			sizeTd.textContent = item.isDirectory ? '' : formatSize(item.size);
			tr.append(sizeTd);

			ui.rows.append(tr);

			var card = document.createElement('div');
			card.className = 'Explorer__card' + (state.selectedPaths.has(item.path) ? ' Explorer__card--selected' : '');
			card.dataset.path = item.path;
			card.dataset.type = item.isDirectory ? 'dir' : 'file';
			card.draggable = true;
			card.title = getItemTitle(item);
			card.innerHTML = `
				<input class="Explorer__itemCheckbox Explorer__check Explorer__cardCheck" type="checkbox" data-path="${escapeAttr(item.path)}"${state.selectedPaths.has(item.path) ? ' checked' : ''} aria-label="Select ${escapeAttr(item.name)}">
				<div class="Explorer__cardIcon">${item.isDirectory ? '📁' : '📄'}</div>
				<div class="Explorer__cardName">${escapeHtml(item.name)}</div>
			`;
			ui.grid.append(card);
		});

		renderStatus();
		syncSelectAllUI();

	function renderStatus () {
		var selectedItems = getSelectedItems();
		var totalSize = selectedItems.reduce(function (acc, item) {
			return acc + (item.isDirectory ? 0 : item.size);
		}, 0);

		ui.status.textContent = state.items.length + ' items' +
			' | selected: ' + selectedItems.length +
			' | selected size: ' + formatSize(totalSize);
	}

	function renderOverlays () {
		ui.overlays.innerHTML = '';
		if (state.contextMenu) {
			var menuNode = buildContextMenuNode(state.contextMenu.items, state.contextMenu.x, state.contextMenu.y);
			ui.overlays.append(menuNode);
			positionContextMenuNode(menuNode, state.contextMenu.x, state.contextMenu.y);
		}
		if (state.dialog) {
			var dialogNode = buildDialogNode(state.dialog);
			ui.overlays.append(dialogNode);
			// After the append, never before: buildDialogNode() returns a detached node and
			// focus() on one of those is silently a no-op, which is why no dialog in this
			// app had a focused field.
			focusDialogInput(dialogNode);
		}
	}

	function openContextMenu (payload) {
		state.contextMenu = payload;
		renderOverlays();
	}

	function closeContextMenu () {
		if (!state.contextMenu) return;
		state.contextMenu = null;
		renderOverlays();
	}

	function buildContextMenuNode (items, x, y) {
		var menu = document.createElement('div');
		menu.className = 'ContextMenu';
		menu.style.left = x + 'px';
		menu.style.top = y + 'px';
		menu.onclick = function (e) {
			e.stopPropagation();
		};
		menu.oncontextmenu = function (e) {
			e.preventDefault();
		};

		menu.append(buildContextMenuList(items));
		return menu;
	}

	function positionContextMenuNode (menu, x, y) {
		requestAnimationFrame(function () {
			var margin = 6;
			var rect = menu.getBoundingClientRect();
			var left = Math.min(x, Math.max(margin, window.innerWidth - rect.width - margin));
			var top = Math.min(y, Math.max(margin, window.innerHeight - rect.height - margin));
			menu.style.left = left + 'px';
			menu.style.top = top + 'px';
		});
	}

	function buildContextMenuList (items) {
		var ul = document.createElement('ul');
		ul.className = 'ContextMenu__list';
		items.forEach(function (item) {
			if (item.separator) {
				var sep = document.createElement('li');
				sep.className = 'ContextMenu__separator';
				ul.append(sep);
				return;
			}

			var li = document.createElement('li');
			li.className = 'ContextMenu__item' + (item.disabled ? ' ContextMenu__item--disabled' : '');
			li.textContent = item.label;

			if (item.submenu && item.submenu.length) {
				var marker = document.createElement('span');
				marker.textContent = '›';
				li.append(marker);
				var sub = document.createElement('div');
				sub.className = 'ContextMenu__submenu';
				sub.append(buildContextMenuList(item.submenu));
				li.onmouseenter = function () {
					positionSubmenuNode(sub, li);
				};
				li.append(sub);
			}

			if (!item.disabled && item.action) {
				li.onclick = function (e) {
					e.stopPropagation();
					closeContextMenu();
					item.action();
				};
			}

			ul.append(li);
		});
		return ul;
	}

	function positionSubmenuNode (submenu, parentItem) {
		var margin = 6;
		var previousDisplay = submenu.style.display;
		var previousVisibility = submenu.style.visibility;
		submenu.style.visibility = 'hidden';
		submenu.style.display = 'block';

		var submenuRect = submenu.getBoundingClientRect();
		var itemRect = parentItem.getBoundingClientRect();
		var opensLeft = itemRect.right + submenuRect.width - 6 > window.innerWidth - margin;
		var desiredTop = -6;
		var minTop = margin - itemRect.top;
		var maxTop = window.innerHeight - margin - itemRect.top - submenuRect.height;
		var top = Math.max(minTop, Math.min(desiredTop, maxTop));

		submenu.style.left = opensLeft ? (-(submenuRect.width - 6)) + 'px' : (parentItem.offsetWidth - 6) + 'px';
		submenu.style.top = top + 'px';
		submenu.style.right = 'auto';
		submenu.style.display = previousDisplay;
		submenu.style.visibility = previousVisibility;
	}

	// The archive dialog has four states and they are one dialog on purpose: reading it,
	// asking for a password, showing what is inside, and working. Each of the first three
	// is a question you can answer without leaving, and a password that turns out to be
	// wrong comes back here rather than as a note over a dialog that has closed.
	function buildArchiveDialog (dialog) {
		var box = document.createElement('div');
		var busy = dialog.phase === 'reading' || dialog.phase === 'working';

		var title = document.createElement('div');
		title.className = 'Modal__title';
		title.textContent = dialog.phase === 'working'
			? 'Extracting ' + dialog.name
			: 'Extract ' + dialog.name;
		box.append(title);

		if (busy) {
			var waiting = document.createElement('div');
			waiting.className = 'Modal__list';
			// Said plainly because this build of 7-Zip runs on this thread: the window is
			// not going to redraw again until it is done, and a big archive can take a
			// while. Better to say so than to look frozen.
			waiting.textContent = dialog.phase === 'reading'
				? 'Reading the archive…'
				: 'Extracting. A large archive holds everything up while it works.';
			box.append(waiting);
			box.append(archiveButtons([{label: 'Cancel', className: 'Dialog__cancel', disabled: true}]));
			return box;
		}

		if (dialog.phase === 'password') {
			var ask = document.createElement('div');
			ask.className = 'Modal__list';
			ask.textContent = dialog.error || 'This archive needs a password.';
			box.append(ask);

			var field = document.createElement('div');
			field.className = 'Modal__field';
			var label = document.createElement('label');
			label.textContent = 'Password';
			var input = document.createElement('input');
			input.type = 'password';
			input.className = 'Dialog__input';
			input.style.width = '100%';
			input.value = dialog.password || '';
			input.oninput = function () {
				dialog.onPassword(input.value);
			};
			input.onkeydown = function (e) {
				if (e.key === 'Enter') {
					e.preventDefault();
					e.stopPropagation();
					dialog.onUnlock(input.value);
				}
			};
			field.append(label, input);
			box.append(field);

			var note = document.createElement('div');
			note.className = 'Modal__list';
			note.style.fontSize = '12px';
			note.style.color = '#888';
			// The distinction the whole classifier exists for, in one line.
			note.textContent = 'Nothing has been written. If the password is right and it '
				+ 'still fails, the archive itself is damaged rather than locked.';
			box.append(note);

			box.append(archiveButtons([
				{label: 'Cancel', className: 'Dialog__cancel'},
				{label: 'Unlock', primary: true, run: function () { dialog.onUnlock(input.value); }}
			]));
			// The field is the only thing here worth typing into.
			setTimeout(function () { input.focus(); }, 0);
			return box;
		}

		var files = dialog.entries.filter(function (entry) {
			return !entry.isDirectory;
		});
		var total = files.reduce(function (sum, entry) {
			return sum + (entry.size || 0);
		}, 0);

		var summary = document.createElement('div');
		summary.className = 'Modal__list';
		summary.textContent = files.length + (files.length === 1 ? ' file' : ' files')
			+ ', ' + formatSize(total) + ' unpacked'
			+ (dialog.unwrapped ? ' — a tar inside a wrapper, and both come off at once.' : '.');
		box.append(summary);

		var list = document.createElement('div');
		list.className = 'Modal__list';
		list.style.maxHeight = '260px';
		list.style.overflow = 'auto';
		list.style.border = '1px solid #444';
		list.style.padding = '6px 8px';

		if (!files.length) {
			list.textContent = 'This archive is empty.';
		}
		files.forEach(function (entry) {
			var row = document.createElement('label');
			row.style.display = 'flex';
			row.style.gap = '8px';
			row.style.alignItems = 'baseline';
			row.style.padding = '2px 0';

			var box2 = document.createElement('input');
			box2.type = 'checkbox';
			box2.checked = dialog.selected.has(entry.path);
			box2.onchange = function () {
				dialog.onToggle(entry.path, box2.checked);
				updateExtractButton();
			};

			var name = document.createElement('span');
			name.textContent = entry.path;
			name.style.flex = '1 1 auto';
			name.style.overflowWrap = 'anywhere';

			var size = document.createElement('span');
			size.style.color = '#888';
			size.style.fontSize = '12px';
			size.style.whiteSpace = 'nowrap';
			size.textContent = formatSize(entry.size || 0) + (entry.encrypted ? ' · locked' : '');

			row.append(box2, name, size);
			list.append(row);
		});
		box.append(list);

		var where = document.createElement('div');
		where.className = 'Modal__list';
		where.style.fontSize = '12px';
		where.textContent = 'Into ' + dialog.destination + '/ — a new folder here. Nothing '
			+ 'already in this folder is written over.';
		box.append(where);

		// Contents can be encrypted while the listing is not, so the field is offered
		// before the attempt rather than after it fails.
		var passwordInput = null;
		if (dialog.entries.some(function (entry) { return entry.encrypted; }) || dialog.password) {
			var pfield = document.createElement('div');
			pfield.className = 'Modal__field';
			var plabel = document.createElement('label');
			plabel.textContent = 'Password';
			passwordInput = document.createElement('input');
			passwordInput.type = 'password';
			passwordInput.style.width = '100%';
			passwordInput.value = dialog.password || '';
			passwordInput.oninput = function () {
				dialog.onPassword(passwordInput.value);
			};
			pfield.append(plabel, passwordInput);
			box.append(pfield);
		}

		var buttons = archiveButtons([
			{label: 'Cancel', className: 'Dialog__cancel'},
			{label: 'Extract', primary: true, className: 'Dialog__extract', run: function () {
				if (passwordInput) {
					dialog.onPassword(passwordInput.value);
				}
				var chosen = files.filter(function (entry) {
					return dialog.selected.has(entry.path);
				}).map(function (entry) {
					return entry.path;
				});
				// All of them is not a selection: handing 7-Zip no list lets it keep the
				// empty folders too, and there is nothing to spell wrong.
				dialog.onExtract(chosen.length === files.length ? null : chosen);
			}}
		]);
		box.append(buttons);

		function updateExtractButton () {
			var button = buttons.querySelector('.Dialog__extract');
			var chosen = dialog.selected.size;
			button.disabled = chosen === 0;
			button.textContent = (chosen === files.length || !files.length)
				? 'Extract'
				: 'Extract ' + chosen;
		}
		updateExtractButton();

		return box;
	}

	// Format and preset, and a password when the format can hold one. Everything else
	// 7-Zip can be told -- dictionary size, solid blocks, threads, volumes -- is left out
	// deliberately: it is a dialog that has to teach you what a dictionary is, in front of
	// somebody who wanted to email a folder.
	function buildCompressDialog (dialog) {
		var box = document.createElement('div');
		var format = archiveNames.formatFor(dialog.format);

		var title = document.createElement('div');
		title.className = 'Modal__title';
		title.textContent = dialog.items.length === 1
			? 'Compress ' + dialog.items[0].name
			: 'Compress ' + dialog.items.length + ' items';
		box.append(title);

		if (dialog.phase === 'working') {
			var waiting = document.createElement('div');
			waiting.className = 'Modal__list';
			// The engine runs on this thread, and compressing is where that is felt:
			// there is far more work in `Best` on a folder than in extracting one.
			waiting.textContent = (dialog.progress || 'Working…')
				+ ' The window waits for this.';
			box.append(waiting);
			box.append(archiveButtons([{label: 'Cancel', className: 'Dialog__cancel', disabled: true}]));
			return box;
		}

		var nameField = document.createElement('div');
		nameField.className = 'Modal__field';
		var nameLabel = document.createElement('label');
		nameLabel.textContent = 'Archive name';
		var nameInput = document.createElement('input');
		nameInput.className = 'Dialog__input';
		nameInput.style.width = '100%';
		nameInput.value = dialog.name;
		nameInput.oninput = function () {
			dialog.onName(nameInput.value);
		};
		nameField.append(nameLabel, nameInput);
		box.append(nameField);

		box.append(choiceRow('Format', archiveNames.FORMATS, dialog.format, function (id) {
			dialog.onFormat(id);
		}));
		box.append(hint(format.note));

		box.append(choiceRow('Compression', archiveNames.PRESETS, dialog.preset, function (id) {
			dialog.onPreset(id);
		}));
		box.append(hint(archiveNames.presetFor(dialog.preset).note));

		var passwordField = document.createElement('div');
		passwordField.className = 'Modal__field';
		var passwordLabel = document.createElement('label');
		passwordLabel.textContent = 'Password';
		var passwordInput = document.createElement('input');
		passwordInput.type = 'password';
		passwordInput.style.width = '100%';
		passwordInput.value = dialog.password || '';
		// Not hidden when the format cannot hold one: a field that vanishes looks like a
		// bug, and a disabled one with a reason beside it is the answer to "why can I not
		// put a password on this".
		passwordInput.disabled = !format.password;
		passwordInput.placeholder = format.password ? '' : 'tar.gz cannot hold one';
		passwordInput.oninput = function () {
			dialog.onPassword(passwordInput.value);
		};
		passwordField.append(passwordLabel, passwordInput);
		box.append(passwordField);

		if (format.encryptNames) {
			var namesRow = document.createElement('label');
			namesRow.className = 'Modal__list';
			namesRow.style.display = 'flex';
			namesRow.style.gap = '8px';
			namesRow.style.alignItems = 'baseline';
			var namesBox = document.createElement('input');
			namesBox.type = 'checkbox';
			namesBox.checked = dialog.encryptNames === true;
			namesBox.onchange = function () {
				dialog.onEncryptNames(namesBox.checked);
			};
			var namesText = document.createElement('span');
			// Worth spelling out: in a zip the list of what is inside is readable by
			// anyone holding the file, password or not.
			namesText.textContent = 'Hide the file names too — without this, anyone with '
				+ 'the archive can see what is in it.';
			namesRow.append(namesBox, namesText);
			box.append(namesRow);
		}

		box.append(archiveButtons([
			{label: 'Cancel', className: 'Dialog__cancel'},
			{label: 'Compress', primary: true, run: function () {
				dialog.onName(nameInput.value);
				if (format.password) {
					dialog.onPassword(passwordInput.value);
				}
				dialog.onCompress();
			}}
		]));
		return box;
	}

	function choiceRow (label, options, current, onPick) {
		var row = document.createElement('div');
		row.className = 'Modal__field';
		var caption = document.createElement('label');
		caption.textContent = label;
		row.append(caption);

		var buttons = document.createElement('div');
		buttons.style.display = 'flex';
		buttons.style.gap = '6px';
		buttons.style.flexWrap = 'wrap';
		options.forEach(function (option) {
			var button = document.createElement('button');
			button.type = 'button';
			button.textContent = option.label;
			button.setAttribute('aria-pressed', String(option.id === current));
			if (option.id === current) {
				button.classList.add('Dialog__submit');
			}
			button.onclick = function () {
				onPick(option.id);
			};
			buttons.append(button);
		});
		row.append(buttons);
		return row;
	}

	function hint (text) {
		var node = document.createElement('div');
		node.className = 'Modal__list';
		node.style.fontSize = '12px';
		node.style.color = '#888';
		node.style.marginTop = '-4px';
		node.textContent = text;
		return node;
	}

	function archiveButtons (specs) {
		var row = document.createElement('div');
		row.className = 'Modal__buttons';
		specs.forEach(function (spec) {
			var button = document.createElement('button');
			button.textContent = spec.label;
			if (spec.className) {
				button.className = spec.className;
			}
			if (spec.primary) {
				button.classList.add('Dialog__submit');
			}
			button.disabled = !!spec.disabled;
			button.onclick = spec.run || function () {
				state.dialog = null;
				renderOverlays();
			};
			row.append(button);
		});
		return row;
	}

	function buildDialogNode (dialog) {
		var modal = document.createElement('div');
		modal.className = 'Modal';

		var panel = document.createElement('div');
		panel.className = 'Modal__panel';
		modal.append(panel);

		if (dialog.type === 'rename') {
			panel.innerHTML = `
				<div class="Modal__title">Rename</div>
				<div class="Modal__field"><label>New name</label><input class="Dialog__input" data-select-basename value="${escapeAttr(dialog.oldName)}"></div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Rename</button></div>
			`;
			wireSimpleDialog(panel, function () {
				var input = panel.querySelector('.Dialog__input');
				var value = input.value.trim();
				if (!value) {
					// Declined, not submitted: keep the dialog and the focus rather than
					// closing on a name that cannot be used.
					input.focus();
					return false;
				}
				dialog.onSubmit(value);
			});
		}
		else if (dialog.type === 'newFile') {
			panel.innerHTML = `
				<div class="Modal__title">Create file</div>
				<div class="Modal__field"><label>File name</label><input class="Dialog__name" data-select-basename value="new.txt"></div>
				<div class="Modal__field"><label>Content</label><textarea class="Dialog__content">a,b,c,d</textarea></div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Create</button></div>
			`;
			wireSimpleDialog(panel, function () {
				var nameInput = panel.querySelector('.Dialog__name');
				if (!nameInput.value.trim()) {
					nameInput.focus();
					return false;
				}
				dialog.onSubmit({
					name: nameInput.value.trim(),
					content: panel.querySelector('.Dialog__content').value
				});
			});
		}
		else if (dialog.type === 'newFolder') {
			panel.innerHTML = `
				<div class="Modal__title">Create folder</div>
				<div class="Modal__field"><label>Folder name</label><input class="Dialog__input" value="new-folder"></div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Create</button></div>
			`;
			wireSimpleDialog(panel, function () {
				var folderInput = panel.querySelector('.Dialog__input');
				if (!folderInput.value.trim()) {
					folderInput.focus();
					return false;
				}
				dialog.onSubmit(folderInput.value.trim());
			});
		}
		else if (dialog.type === 'onlineFile') {
			panel.innerHTML = `
				<div class="Modal__title">Add online file</div>
				<div class="Modal__field"><label>URL</label><input class="Dialog__url" placeholder="https://..."></div>
				<div class="Modal__field"><label>Optional file name override</label><input class="Dialog__name" placeholder="leave empty"></div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Add</button></div>
			`;
			wireSimpleDialog(panel, function () {
				var urlInput = panel.querySelector('.Dialog__url');
				if (!urlInput.value.trim()) {
					urlInput.focus();
					return false;
				}
				dialog.onSubmit({
					url: urlInput.value.trim(),
					name: panel.querySelector('.Dialog__name').value.trim()
				});
			});
		}
		else if (dialog.type === 'confirmDelete') {
			var names = dialog.items.map(function (item) {
				return '<div>' + escapeHtml(item.name) + '</div>';
			}).join('');

			panel.innerHTML = `
				<div class="Modal__title">Delete ${dialog.items.length} item(s)?</div>
				<div class="Modal__list">${names}</div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit Explorer__danger">Delete</button></div>
			`;
			wireSimpleDialog(panel, dialog.onSubmit);
		}
		else if (dialog.type === 'defaultAppsManager') {
			var associationRows = dialog.rows.length ? dialog.rows.map(function (row) {
				var options = row.apps.map(function (app) {
					return '<option value="' + escapeAttr(app.id) + '"' + (app.id === row.appId ? ' selected' : '') + '>' + escapeHtml(app.label) + '</option>';
				}).join('');
				return `
					<div class="Modal__field" data-ext-row="${escapeAttr(row.extension)}">
						<label>.${escapeHtml(row.extension)}</label>
						<select class="Dialog__defaultRowApp">${options}</select>
						<button class="Dialog__rowSave" data-extension="${escapeAttr(row.extension)}">Save</button>
						<button class="Dialog__rowClear" data-extension="${escapeAttr(row.extension)}">Clear</button>
					</div>
				`;
			}).join('') : '<div class="Modal__list">No default apps configured</div>';

			var addOptions = dialog.addableApps.map(function (app) {
				return '<option value="' + escapeAttr(app.id) + '">' + escapeHtml(app.label) + '</option>';
			}).join('');

			panel.innerHTML = `
				<div class="Modal__title">Default Apps</div>
				${associationRows}
				<div class="Modal__field">
					<label>Add association</label>
					<input class="Dialog__defaultExt" placeholder="png" value="${escapeAttr(dialog.prefillExtension || '')}">
					<select class="Dialog__defaultApp"${dialog.addableApps.length ? '' : ' disabled'}>
						${addOptions || '<option value="">No installed apps</option>'}
					</select>
					<button class="Dialog__defaultAdd"${dialog.addableApps.length ? '' : ' disabled'}>Add</button>
				</div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Close</button></div>
			`;

			panel.querySelectorAll('.Dialog__rowSave').forEach(function (node) {
				node.onclick = function () {
					var row = node.closest('[data-ext-row]');
					dialog.onSave(row.dataset.extRow, row.querySelector('.Dialog__defaultRowApp').value);
				};
			});
			panel.querySelectorAll('.Dialog__rowClear').forEach(function (node) {
				node.onclick = function () {
					dialog.onClear(node.dataset.extension);
				};
			});
			var addBtn = panel.querySelector('.Dialog__defaultAdd');
			if (addBtn) {
				addBtn.onclick = function () {
					dialog.onAdd(
						panel.querySelector('.Dialog__defaultExt').value.trim(),
						panel.querySelector('.Dialog__defaultApp').value
					);
				};
			}
			var cancelBtn = panel.querySelector('.Dialog__cancel');
			if (cancelBtn) {
				cancelBtn.onclick = function () {
					state.dialog = null;
					renderOverlays();
				};
			}
		}
		else if (dialog.type === 'archive') {
			panel.append(buildArchiveDialog(dialog));
		}
		else if (dialog.type === 'compress') {
			panel.append(buildCompressDialog(dialog));
		}
		else if (dialog.type === 'ffmpegOptions') {
			panel.innerHTML = `
				<div class="Modal__title">FFmpeg options</div>
				<div class="Modal__field">
					<label>Arguments between input and output file</label>
					<input class="Dialog__args" value="${escapeAttr(dialog.defaultArgs)}">
				</div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Run</button></div>
			`;
			wireSimpleDialog(panel, function () {
				dialog.onSubmit(panel.querySelector('.Dialog__args').value.trim());
			});
		}
		else if (dialog.type === 'files3Mount') {
			panel.innerHTML = `
				<div class="Modal__title">Mount Files3 Storage</div>
				<div class="Modal__list">If no token is saved, an authorization window will open on the storage server.</div>
				<div class="Modal__field">
					<label>Base URL API</label>
					<input class="Dialog__files3BaseUrl" type="url" value="${escapeAttr(dialog.baseUrl || '')}" placeholder="https://storage.example.com/api" style="width:100%">
				</div>
				<div class="Modal__field">
					<label>Root Folder ID</label>
					<input class="Dialog__files3RootFolderId" type="number" min="1" value="${escapeAttr(String(dialog.rootFolderId || ''))}" placeholder="42" style="width:100%">
				</div>
				<div class="Modal__field">
					<label>localStorage ID (token key)</label>
					<input class="Dialog__files3LocalStorageId" type="text" value="${escapeAttr(dialog.localStorageId || '')}" placeholder="files3_token_demo" style="width:100%">
				</div>
				<div class="Modal__field">
					<label>Mount point</label>
					<input class="Dialog__files3MountPoint" type="text" value="${escapeAttr(dialog.mountPoint || '')}" placeholder="/mnt/files3" style="width:100%">
				</div>
				<div class="Modal__buttons"><button class="Dialog__cancel">Cancel</button><button class="Dialog__submit">Connect</button></div>
			`;
			wireSimpleDialog(panel, function () {
				dialog.onSubmit({

			panel.querySelector('.Dialog__rename').onclick = function () {
