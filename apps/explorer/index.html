<!DOCTYPE html>
<html lang="en">
<head>
	<script>
		(function () {
			var FILES3_CONFIG_KEY = 'pixos_files3_config';
			var token = new URLSearchParams(location.search).get('token');
			if (!token) return;

			function resolveFiles3LocalStorageId () {
				var lsId = 'files3_token_storage';
				try {
					var raw = localStorage.getItem(FILES3_CONFIG_KEY);
					if (!raw) return lsId;
					var cfg = JSON.parse(raw);
					if (cfg && cfg.localStorageId) {
						return cfg.localStorageId;
					}
					if (cfg && cfg.baseUrl) {
						return 'files3_token_' + (new URL(cfg.baseUrl).hostname || 'storage');
					}
				} catch (e) { /* ignore */ }
				return lsId;
			}

			try {
				localStorage.setItem(resolveFiles3LocalStorageId(), token);
			} catch (e) { /* ignore */ }

			try {
				history.replaceState(null, '', location.pathname + location.hash);
			} catch (e) { /* ignore */ }

			if (window.opener) {
				try {
					window.opener.postMessage({ type: 'files3-token', token: token }, location.origin);
				} catch (e) { /* ignore */ }
				window.close();
			}
		})();
	</script>

<!-- No peer library here any more. Explorer once ran a PeerJS connection of its own, to
     send a guest a page of HTML and JavaScript that their browser then evaluated; that is
     what `js/shell/peers.js` and the peer mount replaced. Explorer now asks the shell
     (`parent.peers`) which folder is shared and who is connected, and nothing this app
     puts on the wire is executable. -->
<script type="module">
// Only the rules -- which files are archives, what 7-Zip's output means. The engine
// itself is 1.4 MB of WebAssembly and is loaded on the first extraction, not here.

// Phase 21 begins here. These two hold what `openExplorer` used to declare inline: the
// pure string and path functions, and every promise wrapper around BrowserFS. They are
// destructured into this module's scope below, so the roughly two hundred call sites
// inside `openExplorer` still read exactly as they did -- what changed is that the
// definitions are now somewhere a reader can find, and one of them is testable.
//
// Any module added beside these has to be named in four places, and none of them will
// complain if it is not: `apps/explorer/pixos.app.json`, `settings/preinstall.json`,
// `PRECACHE` in `sw.js`, and `FALLBACK_PREINSTALL` in the shell's `index.html`.
// `tests/explorer-modules.test.mjs` is what actually enforces that.
import { createFormat } from "./js/format.js";
import { createFsHelpers } from "./js/fs-helpers.js";
import { createDragAndDrop } from "./js/dnd.js";
import { createContextMenu } from "./js/context-menu.js";
import { createSelection } from "./js/selection.js";
import { createFailure } from "./js/failure.js";

import { createRecording } from "./js/recording.js";
import { createArchiveUi } from "./js/archive-ui.js";
import { createDialogs } from "./js/dialogs.js";
import { createFileOps } from "./js/file-ops.js";
import { createMenuItems } from "./js/menu-items.js";
import { createView } from "./js/view.js";
import { createSidebar } from "./js/sidebar.js";
import { createPlaces, FILE as LINKS_FILE } from "./js/places.js";
import { createMounts } from "./js/mounts.js";
import { createClipboard } from "./js/clipboard.js";
import { createItemActions } from "./js/item-actions.js";
import { createShellActions } from "./js/shell-actions.js";
import { createConvert } from "./js/convert.js";

window.BrowserFS = parent.BrowserFS;

window.fs = parent.fs;
window.path = parent.path;
var Buffer = parent.Buffer;
window.mountManager = parent.mountManager;

const {
	normalizePath, getParentPath, formatSize, getItemTitle,
	escapeHtml, escapeAttr, getExt, getNameByPath,
	splitNameAndExtension, basenameEnd, isImageExtension
} = createFormat(window.path);

const {
	listDirectory, readFile, writeFile, ensureDir, mkdir, stat, readdir,
	fsRename, unlink, unlinkFile, rmdir, deleteFolderRecursive,
	downloadBlob, blobToFile, fileToAB,
	getFileFromFileEntry, getAllFileEntries, readAllDirectoryEntries, readEntriesPromise
} = createFsHelpers({
	fs: window.fs,
	path: window.path,
	mountManager: window.mountManager,
	normalizePath: normalizePath
});

// No `state`, no `ui`, no DOM -- every answer in here comes from the shell or from the
// extension, which is why this one could move in the same pass as js/failure.js.
const {
	getOpenWithApps, getOpenWithAppsForItems, getCatalogLabel, getDefaultAppRows,
	getInstalledAppsForPicker, getInstalledCompatibleAppsForExtension,
	getDefaultAppIdForExtension, normalizeExtensionInput, getNormalizedExtension,

	getCompatibilityProfileForExtension, isAppCompatibleWithProfile
} = createOpenWith({ shell: parent, path: window.path });

// Explorer is not a standalone app and cannot become one: the filesystem it browses lives
// in the shell's window, not in BrowserFS where its own files are. Opened in a bare tab it
// used to boot anyway and die on the first readdir with "Cannot read properties of
// undefined" -- a stack trace where a sentence belongs.
if (!window.fs || !window.path) {
	document.body.innerHTML = ''
		+ '<div style="max-width:520px;margin:14vh auto;padding:0 24px;'
		+ 'font:14px/1.6 -apple-system,Arial,sans-serif;color:#dfe3ea;text-align:center">'
		+ '<h1 style="font-size:18px;margin:0 0 10px">Explorer needs the PixOS shell</h1>'
		+ '<p style="color:#939caa;margin:0 0 18px">It browses the filesystem that lives in '
		+ 'the shell&rsquo;s window, so there is nothing for it to show on its own.</p>'
		+ '<p><a style="color:#6fb3ff" href="/">Open PixOS</a></p></div>';
	document.body.style.background = '#14171c';
}
else {
	openExplorer();
}

(function () {
	var s = document.createElement('script');
	s.type = 'text/javascript';
	s.src = '../fix-webm-duration.js';
	document.body.append(s);
})();

fs.stat('/apps/ffmpeg.0.12.10/ffmpeg.js', function (err, stats) {
	if (stats) {
		var s = document.createElement('script');
		s.type = 'text/javascript';
		s.src = '../ffmpeg.0.12.10/ffmpeg.js';
		s.onload = function () {
			window.FFmpeg = FFmpegWASM.FFmpeg;
		};
		document.body.append(s);
	}
});

async function openExplorer () {
	var {
		guarded, report, copyTextToClipboard, copyChordLabel,
		reportFailure, reportFetchFailure, describeFailure, readableActionName
	} = createFailure({
		shell: parent,
		win: window,
		doc: document,
		nav: navigator,
		// Late-bound, and it has to be: this is the first statement in the function and
		// `openInfoDialog` is assigned by createDialogs twenty lines down. Nothing calls it
		// before then, because nothing has failed yet.
		openInfoDialog: function (title, message) { return openInfoDialog(title, message); }
	});

	var rootElem = document.querySelector('#explorer');

	var state = {
		cwd: getInitialCwd(),
		items: [],
		selectedPaths: new Set(),
		clipboard: null,
		lastSelectedPath: null,
		sort: {
			key: 'name',
			dir: 'asc'
		},
			viewMode: 'details',
		contextMenu: null,
		dialog: null,
		busy: false,

			historyBack: [],
			historyForward: [],
			dragPaths: [],
			dragHoverFolderPath: null,
			dragDropHandled: false,
			dragCommitInProgress: false,
			selectionBox: null,
			recording: null

	var ui = {};

	// Phase 21, the modules that need the context object. `state` and `ui` go in by
	// reference -- they are the shared mutable pair every one of these functions reads and
	// writes -- and everything else is named. `ui` is still empty here; renderLayout fills it
	// in two lines down, and only ever mutates it.
	var {
		openContextMenu, closeContextMenu, buildContextMenuNode,
		positionContextMenuNode, buildContextMenuList, positionSubmenuNode
	} = createContextMenu({
		state: state,
		doc: document,
		win: window,
		renderOverlays: renderOverlays
	});

	var {
		getItemByPath, getCurrentFolderItem, getSelectedItems, applySelectionFromEvent,
		toggleSelection, setAllSelection, syncSelectionUI, syncSelectAllUI,
		startSelectionBox, handleSelectionBoxMove, handleSelectionBoxEnd,
		updateSelectionBoxVisual, updateSelectionBoxSelection, getSelectionBoxRect,
		getSelectionPoint, getSelectionIntersectedPaths, getNodeRectInMain,
		intersectsSelectionBox
	} = createSelection({
		state: state,
		ui: ui,
		rootElem: rootElem,
		doc: document,
		closeContextMenu: closeContextMenu,
		// Late-bound, and the second genuine cycle in this file. Changing what is selected
		// asks for a redraw and the redraw reads what is selected, so one of the two has to
		// be built first -- js/view.js is, because it takes four things from here and gives
		// back two, and two thunks are better than four.
		renderStatus: function () { return renderStatus(); },
		renderToolbarState: function () { return renderToolbarState(); }
	});

	// Everything Explorer draws of itself. It goes after selection for the reason just above,
	// and before everything else because `renderLayout` has to have run before a single line
	// below reads a node off `ui` -- which is the call three blocks down, not this one.
	// `renderOverlays` stayed behind in this file; js/view.js says why.
	var {
		renderLayout, sortItems, renderToolbarState, renderBreadcrumbs, renderRows, renderStatus
	} = createView({
		state: state,
		ui: ui,
		rootElem: rootElem,
		doc: document,
		escapeAttr: escapeAttr,
		escapeHtml: escapeHtml,
		formatSize: formatSize,
		getExt: getExt,
		getItemTitle: getItemTitle,
		// Late-bound, the third time this shape comes up: the toolbar greys Paste out by asking
		// the clipboard, every clipboard action redraws the toolbar, and js/clipboard.js is built
		// after file-ops because a paste is a copy or a move.
		hasInternalClipboard: function () { return hasInternalClipboard(); },
		getSelectedItems: getSelectedItems,
		syncSelectAllUI: syncSelectAllUI
	});

	// The dialog machinery. It goes before the archive module because that one opens its
	// dialogs through `openDialog`, and after everything that draws, because a dialog is drawn
	// into the overlay layer. The two archive builders are the one place the dependency runs
	// the other way -- `buildDialogNode` dispatches on `dialog.type` and has to be able to draw
	// them -- so they go in late-bound, which is where this genuine cycle is broken.
	// `wireSimpleDialog`, `isCallbackName` and the two default-app writes are exported for the
	// tests but not named here: every caller of them is now inside the module.
	var {
		buildDialogNode, focusDialogInput, openDialog, closeDialog, openInfoDialog,
		buildDefaultAppsManagerDialog
	} = createDialogs({
		state: state,
		doc: document,
		win: window,
		shell: parent,
		guarded: guarded,
		readableActionName: readableActionName,
		renderOverlays: renderOverlays,
		escapeHtml: escapeHtml,
		escapeAttr: escapeAttr,
		basenameEnd: basenameEnd,
		getDefaultAppRows: getDefaultAppRows,
		getInstalledAppsForPicker: getInstalledAppsForPicker,
		isAppCompatibleWithExtension: isAppCompatibleWithExtension,
		normalizeExtensionInput: normalizeExtensionInput,
		buildArchiveDialog: function (dialog) { return buildArchiveDialog(dialog); },
		buildCompressDialog: function (dialog) { return buildCompressDialog(dialog); }
	});

	// Everything that puts a file somewhere. It goes after the dialog machinery because the
	// conflict question is a dialog, and before the three modules that write files through it:
	// dnd hands it a drop, archive-ui hands it an extracted file, recording hands it a finished
	// video. That ordering is why none of those three needs a thunk -- the one cycle in this
	// file is still the archive builders above, and it is still the only one.
	// Eight names, not fifteen: the module also exports `copyEntryRecursive`,
	// `writeIncomingFile`, `resolvePasteDestination`, `buildIndexedCopyPath`,
	// `unlinkQuietly`, `askPasteConflict` and `refuseOversizedFile`, and every caller of
	// those is now inside it. The tests reach for them by name.
	var {
		moveItemsToFolder, copyItemsToFolder, resolveIncomingDestination,
		resolveIncomingRoots, rerootIncomingPath,
		writeNewFile, addIncomingFile, onFileHandler
	} = createFileOps({
		state: state,
		path: window.path,
		Buffer: Buffer,
		shell: parent,
		win: window,
		normalizePath: normalizePath,
		splitNameAndExtension: splitNameAndExtension,
		stat: stat,
		readFile: readFile,
		writeFile: writeFile,
		readdir: readdir,
		ensureDir: ensureDir,
		fsRename: fsRename,
		unlink: unlink,
		unlinkFile: unlinkFile,
		fileToAB: fileToAB,
		report: report,
		reportFailure: reportFailure,
		openDialog: openDialog,
		renderOverlays: renderOverlays,
		refreshCurrentDir: refreshCurrentDir
	});

	// Below file-ops, because a drop is a move: `moveItemsToFolder` used to be a hoisted
	// declaration in this file and could be named from anywhere in it, and is now a binding
	// that has to exist before it is read.
	var {
		handleItemDragStart, handleItemDragOver, handleItemDragLeave, handleItemDrop,
		handleItemDragEnd, commitPendingDragMove, clearDropTargets,
		updateDragHoverFromPoint, isInternalDrag
	} = createDragAndDrop({
		state: state,
		rootElem: rootElem,
		doc: document,
		win: window,
		moveItemsToFolder: moveItemsToFolder
	});

	// Archives. No `ui`: the dialogs are drawn into the overlay layer, so this asks for a
	// redraw rather than holding a node. `archiveNames` comes back out because the row menu
	// needs to know whether a file is an archive before any of this is otherwise reached.
	var {
		buildArchiveDialog, buildCompressDialog, extract, compress, extractSelected, archiveNames
	} = createArchiveUi({
		state: state,
		doc: document,
		win: window,
		path: window.path,
		report: report,
		reportFailure: reportFailure,
		formatSize: formatSize,
		readFile: readFile,
		writeFile: writeFile,
		ensureDir: ensureDir,
		listDirectory: listDirectory,
		writeNewFile: writeNewFile,
		openDialog: openDialog,
		renderOverlays: renderOverlays,
		refreshCurrentDir: refreshCurrentDir,
		navigateTo: navigateTo,
		// For the three archive entries in `actions`, which live in the module now and are the
		// only reason it reads the selection. `openArchiveDialog`, `openCompressDialog`,
		// `loadArchiveEngine`, `reportArchiveFailure` and `writeExtracted` are still exported, for
		// the tests; nothing out here calls them any more.
		getItemByPath: getItemByPath,
		getSelectedItems: getSelectedItems,
		Buffer: Buffer
	});

	// Every platform object this one needs is a parameter -- getDisplayMedia, MediaRecorder,
	// AudioContext, the clock and the timers -- because a recording is otherwise only
	// reachable by granting a real browser a real screen. The module also exports
	// `doStartScreenRecording` and `updateRecordingTimer`; neither is
	// named here because nothing outside it calls them any more -- the dialog's onSubmit and
	// the timer interval are both set up inside. The tests reach for them.
	var {
		startScreenRecording, stopScreenRecording, toggleMicMute, toggleSysMute
	} = createRecording({
		state: state,
		ui: ui,
		win: window,
		nav: navigator,
		reportFailure: reportFailure,
		guarded: guarded,
		readableActionName: readableActionName,
		renderOverlays: renderOverlays,
		openDialog: openDialog,
		openInfoDialog: openInfoDialog,
		onFileHandler: onFileHandler,
		blobToFile: blobToFile
	});

	// The four mount actions, lifted out of `actions` whole. They go here because `actions` is
	// built from what this returns, and the sidebar -- which draws the mounts and is redrawn by
	// every one of them -- is built from `actions`. That circle is closed with the one thunk
	// below: `renderSidebar` is a `var` two hundred lines further down, and by the time anybody
	// has a mount to unmount it holds a function.
	var {
		mountArchive, mountNativeDir, mountFiles3, umount, reconnectMount, forgetMount
	} = createMounts({
		state: state,
		fs: window.fs,
		path: window.path,
		shell: parent,
		win: window,
		mountManager: window.mountManager,
		normalizePath: normalizePath,
		getItemByPath: getItemByPath,
		getNormalizedExtension: getNormalizedExtension,
		openDialog: openDialog,
		openInfoDialog: openInfoDialog,
		report: report,
		reportFailure: reportFailure,
		renderOverlays: renderOverlays,
		renderSidebar: function () { return renderSidebar(); },
		navigateTo: navigateTo,
		refreshCurrentDir: refreshCurrentDir,
		// Parameters for the same reason js/dnd.js takes its own: the ten-second watch on a
		// native folder that will not answer is otherwise a ten-second test.
		setTimer: function (fn, ms) { return setTimeout(fn, ms); },
		clearTimer: function (handle) { return clearTimeout(handle); }
	});

	// The pinned places: the `Places` group of the bookmarks document, which the shell writes.
	// Beside the mounts for the mounts' reason -- `actions` is built from what this returns and the
	// sidebar that draws them is built from `actions` -- so `renderSidebar` goes in late-bound too.
	var {
		loadPlaces, pinFolder, unpinPlace, movePlace, renamePlace
	} = createPlaces({
		state: state,
		shell: parent,
		openDialog: openDialog,
		renderOverlays: renderOverlays,
		renderSidebar: function () { return renderSidebar(); }
	});

	// The internal clipboard, and Copy path onto the system one. Below file-ops, because a paste
	// is a copy or a move, and below the view, whose `renderToolbarState` every one of these
	// redraws -- which is why the view takes `hasInternalClipboard` from here late-bound. The
	// module also exports `getEffectiveSelectedPaths`; only Copy and Cut ever called it.
	var {
		hasInternalClipboard, copySelected, cutSelected, pasteClipboard, copyPath
	} = createClipboard({
		state: state,
		normalizePath: normalizePath,
		getSelectedItems: getSelectedItems,
		copyItemsToFolder: copyItemsToFolder,
		moveItemsToFolder: moveItemsToFolder,
		renderToolbarState: renderToolbarState,
		copyTextToClipboard: copyTextToClipboard,
		openDialog: openDialog
	});

	// New, Rename, Delete, Download and SHA1. Below file-ops for the same reason as the clipboard:
	// New Folder and Rename both ask its conflict question before they write, and New File writes
	// through it. `File`, `Blob`, `fetch` and `crypto` come off `win`.
	var {
		createFile, createFolder, addOnlineFile, rename, deleteSelected, downloadSelected, getHashSHA1
	} = createItemActions({
		state: state,
		path: window.path,
		Buffer: Buffer,
		win: window,
		getItemByPath: getItemByPath,
		getSelectedItems: getSelectedItems,
		getNameByPath: getNameByPath,
		openDialog: openDialog,
		openInfoDialog: openInfoDialog,
		renderOverlays: renderOverlays,
		resolveIncomingDestination: resolveIncomingDestination,
		writeNewFile: writeNewFile,
		mkdir: mkdir,
		unlink: unlink,
		fsRename: fsRename,
		readFile: readFile,
		downloadBlob: downloadBlob,
		reportFetchFailure: reportFetchFailure,
		refreshCurrentDir: refreshCurrentDir
	});

	// Open, Open with, Manage Defaults, bookmarks and the peer share: the actions whose work the
	// shell does. `guarded` and `readableActionName` go in because the chooser's Manage Defaults
	// button runs after `openWith` has returned and needs the same wrapper the loop below gives
	// the table -- which this module cannot read, being one of the things it is built from.
	var {
		open, openWith, manageDefaultApps, addToBookmarks, shareWithPeers, stopSharing
	} = createShellActions({
		state: state,
		shell: parent,
		getItemByPath: getItemByPath,
		getSelectedItems: getSelectedItems,
		getNameByPath: getNameByPath,
		getOpenWithAppsForItems: getOpenWithAppsForItems,
		getSpecificExtension: getSpecificExtension,
		buildDefaultAppsManagerDialog: buildDefaultAppsManagerDialog,
		openDialog: openDialog,
		renderOverlays: renderOverlays,
		navigateTo: navigateTo,
		refreshCurrentDir: refreshCurrentDir,
		report: report,
		guarded: guarded,
		readableActionName: readableActionName
	});

	// FFmpeg, the last body the action table had. `ensureFfmpegLoaded` and `splitCommandLine` went
	// with it and are exported for the tests; nothing out here calls either. The script that puts
	// `window.FFmpeg` there at all is still at the bottom of this file's module, with the other
	// loaders, because it runs once for the window rather than once per press.
	var {ffmpeg} = createConvert({
		state: state,
		path: window.path,
		Buffer: Buffer,
		win: window,
		getSelectedItems: getSelectedItems,
		readFile: readFile,
		writeNewFile: writeNewFile,
		openDialog: openDialog,
		openInfoDialog: openInfoDialog,
		renderOverlays: renderOverlays,
		refreshCurrentDir: refreshCurrentDir
	});

	// Two Explorer windows on one folder each read their listing once. Everything below is
	// the answer to that: the shell wraps the one fs everyone writes through and hands out
	// batches, and this asks each batch the only question this window has. The selection is
	// kept, because a refresh nobody asked for must not take away what they had selected --
	// refreshCurrentDir drops any row that has since gone, which is the correct half of it.
	function watchForChanges () {
		if (parent === window || typeof parent.watchFiles !== 'function') { return; }
		parent.watchFiles(window, function (change) {
			// A mount is a change to the sidebar wherever it landed, so it is worth a
			// refresh even when it is nowhere near the folder on screen.
			var mounted = (change.entries || []).some(function (entry) {
				return entry.kind === 'mount' || entry.kind === 'unmount';
			});
			if (mounted || change.affects(state.cwd)) {
				refreshWhenIdle();
			}
			// The places are the bookmarks document, which the Bookmarks app, the shell and every
			// other Explorer write. Only the sidebar changes, so only the places are read again.
			if (change.touches(LINKS_FILE)) {
				loadPlaces();
			}
		});
	}

	// Re-rendering the rows out from under a pointer that is dragging one of them, or under
	// a rubber-band selection being drawn over them, loses the gesture. Neither lasts long,
	// so the refresh waits for it rather than being dropped -- dropping it is how a window
	// ends up stale again with nothing left to trigger it.
	var idleRefreshTimer = null;
	function refreshWhenIdle () {
		if (state.selectionBox || state.dragCommitInProgress) {
			if (idleRefreshTimer === null) {
				idleRefreshTimer = setTimeout(function () {
					idleRefreshTimer = null;
					refreshWhenIdle();
				}, 200);
			}
			return;
		}
		refreshCurrentDir(true);
	}

	function bindEvents () {
		ui.back.onclick = function () {
			if (!state.historyBack.length) return;
			state.historyForward.push(state.cwd);
			state.cwd = state.historyBack.pop();
			sidebarChosen();
			refreshCurrentDir(false);
		};

		ui.forward.onclick = function () {
			if (!state.historyForward.length) return;
			state.historyBack.push(state.cwd);
			state.cwd = state.historyForward.pop();
			sidebarChosen();
			refreshCurrentDir(false);
		};

		ui.up.onclick = function () {
			navigateTo(getParentPath(state.cwd));
		};

		ui.newBtn.onclick = function (e) {
			e.stopPropagation();
			openContextMenu({
				x: e.clientX,
				y: e.clientY,
				items: getEmptyAreaMenuItems()
			});
		};

		ui.upload.onclick = function () {
			ui.fileInput.click();
		};

		ui.copy.onclick = function () {
			actions.copySelected();
		};

		ui.cut.onclick = function () {
			actions.cutSelected();
		};

		ui.paste.onclick = function () {
			actions.pasteClipboard();
		};

		ui.defaults.onclick = function () {
			actions.manageDefaultApps();
		};

		ui.recordingStop.onclick = function () {
			actions.stopScreenRecording();
		};

		ui.recordingMicBtn.onclick = function () {
			actions.toggleMicMute();
		};

		ui.recordingSysBtn.onclick = function () {
			actions.toggleSysMute();
		};

		ui.selectAll.onchange = function () {
			setAllSelection(this.checked);
		};

		ui.selectAllToolbar.onchange = function () {
			setAllSelection(this.checked);
		};

			var fromQuery = new URLSearchParams(location.search).get('cwd');
			if (fromQuery) {
				return fromQuery;
			}
		}
		catch (err) {
			// URLSearchParams is unavailable in nothing we support, but a bad URL should
			// not stop Explorer from opening at all.
		}
		return window.cwd || '/';
	}

	function isEditableTarget (node) {
		return !!(node && (node.closest('input, textarea, select') || node.isContentEditable));
	}
}
</script>
