<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monaco editor</title>
<link rel="stylesheet" data-name="vs/editor/editor.main" href="vendor/vs/editor/editor.main.css">
	<style>
		html,
		body,
		#container {
			height: 100%;
			overflow: hidden;
		}
		body {
			margin: 0;
		}
		#container {
			height: calc(100% - 22px);
		}
		#panel {
			background-color: rgb(0, 122, 204);
			color: #fff;
			height: 22px;
			padding-left: 10px;
			padding-right: 10px;
		}
		#panel a {
			color: #fff;
			text-decoration: none;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			margin-right: 1em;
		}
		#panel #right {
			float: right;
		}
	</style>
</head>
<body>
<div id="container"></div>
	<div id="panel">
		<a href="../">&larr; В список</a>
		<div id="right">
			<select id="modesPicker">
				<option value="plaintext" selected>plaintext</option>
			</select>
		</div>
	</div>
<script src="vendor/vs/loader.js"></script>

<script type="module">

// require is provided by loader.js.
//
// Monaco lives in vendor/vs rather than on a CDN, so this app works with no network at
// all -- see vendor/README.md for the version and where it came from. The path is
// resolved to an absolute URL rather than left relative: the AMD loader resolves `paths`
// against its own notion of a base, and this app is served from
// /__browserfs__/apps/monaco-cdn/, which is not where the page thinks it is.
//
// Being same-origin has a second effect worth knowing about. Monaco runs its language
// services in a web worker loaded from vs/base/worker/workerMain.js; from a CDN that is a
// cross-origin worker, which the browser refuses, so those services never actually ran.
// They do now.
require.config({
	paths: {
		'vs': new URL('vendor/vs', document.baseURI).href
	}
});

window.openFile = async function (src, name) {
	var path = src;
	var text = await fetch(path).then(r=>r.text());
	var type;

	require(["vs/editor/editor.main"], () => {
		setModesOptions();

		const onUpdateDebounced = debounce(onUpdate);
		const mode = findLanguageByFile(name).id;

		type = mode;

		var editor = monaco.editor.create(document.getElementById('container'), {
			language: "plaintext",
			theme: "vs-dark",
			wordWrap: 'on',
			automaticLayout: true,
			renderWhitespace: true,
			insertSpaces: false,
			tabSize: 4,

			value: text,
		});


		monaco.editor.setModelLanguage(editor.getModel(), mode);
		modesPicker.value = mode;

		editor.onDidChangeModelContent(function () {
			if (typeof markDirty === 'function') { markDirty(true); }
			onUpdateDebounced();
		});

		modesPicker.onchange = function (e) {
			monaco.editor.setModelLanguage(editor.getModel(), this.value);
			onUpdateDebounced();
		}

		function findLanguageByFile (filename) {
			var result = '';
			var languages = monaco.languages.getLanguages();
			var extension = '.'+ filename.split('.').pop();

			for (var i = 0; i < languages.length; i++) {
				if (
					languages[i].extensions?.indexOf(extension) > -1
				) {
					return languages[i];
				}
			}

			return result;
		}

		// The save contract: the window shows a dot while there is an edit that has not
		// reached the filesystem yet, and stops showing one when it has. The gap is short
		// -- this autosaves -- but it is not nothing, and the browser's close warning is
		// armed from exactly this.
		function onUpdate () {
			const editorValue = editor.getModel().getValue();

			Promise.resolve(parent.saveFileLocal(path, editorValue, name, type)).then(function () {
				if (typeof markDirty === 'function') { markDirty(false); }
			}, function () {
				// The shell reports the failure; the dot staying is what says it is still
				// unsaved.
			});
		}

		function setModesOptions () {
			var MODES = (function() {
				var modesIds = monaco.languages.getLanguages().map(function(lang) {
					return lang.id;
				});

				modesIds.sort();

				return modesIds.map(function(modeId) {
					return {
						modeId: modeId,
					};
				});
			})();

			for (var i = 0; i < MODES.length; i++) {
				var o = document.createElement('option');

				o.textContent = MODES[i].modeId;
				modesPicker.appendChild(o);
			}
		}
	});
};

// уменьшение количества вызовов
function debounce (func, wait, immediate) {
	var timeout;

	return function() {
		var context = this;
		var later = function() {
			timeout = null;
			if (!immediate) func.apply(context, arguments);
		}
		var callNow = immediate && !timeout;
		
		clearTimeout(timeout);
		timeout = setTimeout(later, wait || 500);
		if (callNow) func.apply(context, arguments);
	};
};

</script>
</body>
</html>
